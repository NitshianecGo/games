<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>METRO NET // STABLE AUDIO & P2P</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/mqtt@5.3.0/dist/mqtt.min.js"></script>
    <style>
        :root {
            --metro-amber: #ff7700;
            --metro-amber-glow: rgba(255, 119, 0, 0.4);
            --metro-green: #33ff66;
            --metro-green-glow: rgba(51, 255, 102, 0.4);
            --metro-blue: #00bfff;
            --metro-blue-glow: rgba(0, 191, 255, 0.4);
            --metro-red: #ff3333;
            --metro-dark: #0a0d0f;
            --metro-panel: #141a1f;
            --metro-border: #2c3842;
            --metro-text: #c8d6e0;
            --metro-muted: #627785;
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--metro-dark);
            color: var(--metro-text);
            font-family: 'Share Tech Mono', monospace;
            height: 100dvh; width: 100vw;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        .crt::before {
            content: " "; display: block;
            position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 999; background-size: 100% 3px, 6px 100%;
            pointer-events: none;
        }

        .screen {
            display: none; width: 100%; max-width: 900px;
            height: 100dvh; flex-direction: column;
            position: relative; z-index: 10; padding: 6px;
        }
        .screen.active { display: flex; }

        #screen-loading { justify-content: center; align-items: center; text-align: center; background: #050708; }
        .metro-loader {
            width: 50px; height: 50px;
            border: 4px solid var(--metro-border);
            border-top: 4px solid var(--metro-amber);
            border-radius: 50%; animation: spin 0.8s linear infinite;
            box-shadow: 0 0 15px var(--metro-amber-glow); margin-bottom: 20px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .loading-title { color: var(--metro-amber); font-size: 20px; letter-spacing: 2px; text-shadow: 0 0 10px var(--metro-amber); margin-bottom: 8px; }
        .loading-status { color: var(--metro-muted); font-size: 13px; }

        #screen-login { justify-content: center; align-items: center; }
        .login-card { background: var(--metro-panel); border: 2px solid var(--metro-border); padding: 20px; width: 100%; max-width: 380px; box-shadow: 0 0 25px rgba(0,0,0,0.8); }
        .metro-title { color: var(--metro-amber); font-size: 20px; text-align: center; margin-bottom: 16px; text-shadow: 0 0 10px var(--metro-amber); letter-spacing: 2px; }
        .field-group { margin-bottom: 14px; }
        .field-group label { display: block; font-size: 11px; color: var(--metro-muted); margin-bottom: 4px; text-transform: uppercase; }
        
        .metro-input {
            width: 100%; background: #0b0e11; border: 1px solid var(--metro-border);
            color: var(--metro-amber); padding: 10px 12px; font-family: inherit; font-size: 14px; outline: none;
            user-select: text; -webkit-user-select: text;
        }

        .metro-btn {
            width: 100%; background: var(--metro-panel); color: var(--metro-amber);
            border: 1px solid var(--metro-amber); padding: 12px; font-family: inherit;
            font-size: 14px; font-weight: bold; cursor: pointer; text-transform: uppercase;
            display: flex; justify-content: center; align-items: center; gap: 8px;
        }

        .chat-header {
            background: var(--metro-panel); border: 1px solid var(--metro-border);
            padding: 8px 10px; display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 6px; gap: 6px; flex-shrink: 0;
        }
        .channel-info { display: flex; align-items: center; gap: 8px; font-size: 12px; }

        .gas-lamp-box { display: flex; align-items: center; gap: 6px; background: #080b0d; padding: 3px 8px; border: 1px solid var(--metro-border); border-radius: 4px; }
        .gas-lamp-bulb { width: 11px; height: 11px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.2); background: #220000; transition: all 0.3s ease; }
        .gas-lamp-bulb.green { background: var(--metro-green); box-shadow: 0 0 10px var(--metro-green), 0 0 15px var(--metro-green-glow); }
        .gas-lamp-bulb.blue { background: var(--metro-blue); box-shadow: 0 0 10px var(--metro-blue), 0 0 15px var(--metro-blue-glow); }
        .gas-lamp-bulb.red { background: var(--metro-red); box-shadow: 0 0 10px var(--metro-red), 0 0 15px rgba(255, 51, 51, 0.6); }

        .lamp-text { font-size: 10px; color: var(--metro-muted); font-weight: bold; }
        .user-tag { color: var(--metro-amber); font-weight: bold; }

        .copy-btn { background: transparent; border: 1px solid var(--metro-border); color: var(--metro-text); padding: 6px 10px; font-family: inherit; font-size: 11px; cursor: pointer; }

        .call-banner {
            display: none; background: rgba(51, 255, 102, 0.15); border: 1px solid var(--metro-green);
            color: var(--metro-green); padding: 8px; text-align: center; font-size: 12px; margin-bottom: 6px;
            letter-spacing: 1px; animation: pulse 1s infinite alternate;
        }
        @keyframes pulse { 0% { opacity: 0.6; } 100% { opacity: 1; } }
        .call-banner.active { display: block; }

        .chat-body {
            flex: 1; min-height: 0; background: #07090b; border: 1px solid var(--metro-border);
            padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 6px;
        }

        .msg { max-width: 85%; padding: 8px 12px; border: 1px solid var(--metro-border); background: var(--metro-panel); word-wrap: break-word; }
        .msg.self { align-self: flex-end; border-color: rgba(255, 119, 0, 0.4); background: #1c150e; }
        .msg.other { align-self: flex-start; border-color: #2a343d; }
        .msg.system { align-self: center; max-width: 95%; background: transparent; border: none; color: var(--metro-muted); font-size: 11px; text-align: center; }

        .msg-meta { display: flex; justify-content: space-between; font-size: 10px; color: var(--metro-muted); margin-bottom: 4px; gap: 10px; }
        .msg.self .msg-sender { color: var(--metro-amber); }
        .msg-text { font-size: 13px; line-height: 1.3; color: var(--metro-text); user-select: text; }

        .msg-media-preview img, .msg-media-preview video { max-width: 100%; max-height: 220px; border: 1px solid var(--metro-border); display: block; cursor: pointer; }

        .audio-player { display: flex; align-items: center; gap: 8px; margin-top: 4px; background: #0b0e11; padding: 6px 10px; border: 1px solid var(--metro-border); }
        .audio-play-btn { background: var(--metro-amber); color: var(--metro-dark); border: none; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-weight: bold; }

        .chat-input-panel { background: var(--metro-panel); border: 1px solid var(--metro-border); padding: 6px; display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
        .controls-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

        .mode-btn {
            height: 48px; background: #0b0e11; border: 1px solid var(--metro-border);
            color: var(--metro-amber); font-family: inherit; font-size: 11px; font-weight: bold;
            cursor: pointer; display: flex; justify-content: center; align-items: center; text-align: center;
        }
        .mode-btn.ptt-mode.active-ptt { background: var(--metro-amber) !important; color: var(--metro-dark) !important; }
        .mode-btn.call-mode.active-call { background: var(--metro-red); border-color: var(--metro-red); color: white; }

        .input-row { display: flex; gap: 6px; align-items: center; }
        .input-btn { background: #0b0e11; border: 1px solid var(--metro-border); color: var(--metro-amber); width: 38px; height: 38px; font-size: 16px; cursor: pointer; display: flex; justify-content: center; align-items: center; flex-shrink: 0; }
        .input-btn.recording { background: var(--metro-red); color: white; border-color: var(--metro-red); animation: pulse 0.8s infinite alternate; }

        #chat-message-input { flex: 1; height: 38px; font-size: 13px; }

        #media-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 7, 9, 0.96); z-index: 10000; flex-direction: column; justify-content: space-between; align-items: center; padding: 15px;
        }
        #media-modal.active { display: flex; }
        .modal-body img, .modal-body video { max-width: 95vw; max-height: 80vh; object-fit: contain; border: 1px solid var(--metro-amber); }
        .download-btn { background: var(--metro-amber); color: var(--metro-dark); border: none; padding: 12px 24px; font-family: inherit; font-size: 13px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body class="crt">

    <audio id="remote-audio" autoplay playsinline style="display:none;"></audio>

    <!-- LIGHTBOX -->
    <div id="media-modal">
        <div style="width:100%; display:flex; justify-content:space-between; align-items:center;">
            <span style="color:var(--metro-amber); font-size: 12px;">ПРОСМОТР МЕДИА</span>
            <button style="background:#141a1f; border:1px solid var(--metro-amber); color:var(--metro-amber); padding:6px 12px; cursor:pointer;" onclick="closeMediaModal()">✕ ЗАКРЫТЬ</button>
        </div>
        <div class="modal-body" id="modal-container"></div>
        <div>
            <button class="download-btn" onclick="downloadCurrentMedia()">💾 СОХРАНИТЬ</button>
        </div>
    </div>

    <!-- 1. Экран Загрузки -->
    <div id="screen-loading" class="screen active">
        <div class="metro-loader"></div>
        <div class="loading-title">METRO-NET STABLE AUDIO</div>
        <div id="loading-status" class="loading-status">ПОДКЛЮЧЕНИЕ К СЕТИ...</div>
    </div>

    <!-- 2. Экран Входа -->
    <div id="screen-login" class="screen">
        <div class="login-card">
            <div class="metro-title">ЛИНИЯ СВЯЗИ</div>
            <div class="field-group">
                <label for="username-input">Позывной сталкера</label>
                <input type="text" id="username-input" class="metro-input" placeholder="Артем" maxlength="15">
            </div>
            <div class="field-group">
                <label for="room-input">Номер частоты</label>
                <input type="text" id="room-input" class="metro-input" placeholder="канал..." maxlength="20">
            </div>
            <button class="metro-btn" onclick="startSession()">ПОДКЛЮЧИТЬСЯ ➤</button>
        </div>
    </div>

    <!-- 3. Экран Чата -->
    <div id="screen-chat" class="screen">
        <div class="chat-header">
            <div class="channel-info">
                <div class="gas-lamp-box">
                    <div id="gas-lamp" class="gas-lamp-bulb red"></div>
                    <span id="gas-lamp-text" class="lamp-text">OFF</span>
                </div>
                <div>
                    <span><strong id="display-user" class="user-tag">---</strong></span>
                    <span style="color:var(--metro-muted); margin-left: 2px;">[<span id="display-room" style="color:var(--metro-amber);">---</span>]</span>
                </div>
            </div>
            <button class="copy-btn" onclick="copyInviteLink()">🔗 ССЫЛКА</button>
        </div>

        <div id="call-banner" class="call-banner">🎙️ ЭФИР АКТИВЕН: <span id="banner-mode-text">ПОДКЛЮЧЕНО</span></div>

        <div id="chat-messages" class="chat-body">
            <div class="msg system">Сеть готова. Используются брокеры на порту 443 (без блокировок провайдерами).</div>
        </div>

        <div class="chat-input-panel">
            <div class="controls-row">
                <button id="ptt-btn" class="mode-btn ptt-mode">📻 РАЦИЯ<br>(ЗАЖАТЬ И ДЕРЖАТЬ)</button>
                <button id="call-toggle-btn" class="mode-btn call-mode" onclick="toggleCall()">📞 ЗВОНОК<br>(1 НАЖАТИЕ)</button>
            </div>

            <div class="input-row">
                <button class="input-btn" onclick="document.getElementById('file-picker').click()">📎</button>
                <input type="file" id="file-picker" style="display:none;" accept="image/*,video/*" onchange="handleFileSelect(event)">
                <input type="text" id="chat-message-input" class="metro-input" placeholder="Сообщение..." onkeypress="handleKeyPress(event)">
                <button id="rec-btn" class="input-btn" onclick="toggleVoiceRecord()">🎙️</button>
                <button class="input-btn" onclick="sendTextMessage()">➤</button>
            </div>
        </div>
    </div>

    <script>
        /* ================= 1. БРОКЕРЫ НА ПОРТУ 443 (ОБХОД БЛОКИРОВОК В РФ БЕЗ VPN) ================= */
        const BROKERS = [
            'wss://broker.emqx.io:443/mqtt',
            'wss://public.mqtthq.com:443/mqtt',
            'wss://test.mosquitto.org:8081/mqtt',
            'wss://broker.hivemq.com:8884/mqtt'
        ];
        let currentBrokerIdx = 0;
        let mqttClient = null;

        const iceServersConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:global.stun.twilio.com:3478' },
                { urls: "turn:openrelay.metered.ca:443", username: "openrelay", credential: "openrelay" },
                { urls: "turn:openrelay.metered.ca:443?transport=tcp", username: "openrelay", credential: "openrelay" }
            ]
        };

        let myUserId = localStorage.getItem('metro_uid') || 'u_' + Math.random().toString(36).substr(2, 7);
        localStorage.setItem('metro_uid', myUserId);

        let myUsername = localStorage.getItem('metro_uname') || '';
        let rawRoom = new URLSearchParams(window.location.search).get('room') || localStorage.getItem('metro_room') || '';

        function cleanRoomName(str) {
            if (!str) return '';
            try { str = decodeURIComponent(str); } catch(e){}
            return str.toLowerCase().replace(/[^a-z0-9_-]/g, '');
        }

        let currentRoom = cleanRoomName(rawRoom);

        /* WebRTC & Web Audio Engine State */
        let peerConnection = null;
        let localStream = null;
        let isPTTActive = false;
        let isCallActive = false;
        
        /* Web Audio API Engine for Dynamic Sample-Rate & Jitter Buffer */
        let audioCtx = null;
        let voiceRecorder = null;
        let voiceChunks = [];
        let isVoiceRecording = false;
        let jitterBufferQueue = [];
        let isProcessingJitter = false;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        window.onload = () => {
            setTimeout(() => {
                document.getElementById('screen-loading').classList.remove('active');
                document.getElementById('screen-login').classList.add('active');

                if (myUsername) document.getElementById('username-input').value = myUsername;
                if (!currentRoom) currentRoom = 'metro-' + Math.random().toString(36).substr(2, 6);
                document.getElementById('room-input').value = currentRoom;

                if (myUsername && new URLSearchParams(window.location.search).get('room')) {
                    startSession();
                }
            }, 500);

            const pttBtn = document.getElementById('ptt-btn');
            pttBtn.addEventListener('mousedown', (e) => { e.preventDefault(); getAudioContext(); startPTT(); });
            pttBtn.addEventListener('mouseup', (e) => { e.preventDefault(); stopPTT(); });
            pttBtn.addEventListener('mouseleave', (e) => { e.preventDefault(); stopPTT(); });
            pttBtn.addEventListener('touchstart', (e) => { e.preventDefault(); getAudioContext(); startPTT(); }, { passive: false });
            pttBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopPTT(); }, { passive: false });
        };

        function startSession() {
            getAudioContext();
            const unameInput = document.getElementById('username-input').value.trim();
            const roomInput = cleanRoomName(document.getElementById('room-input').value.trim());

            if (!unameInput || !roomInput) return alert("Заполните поля!");

            myUsername = unameInput;
            currentRoom = roomInput;

            localStorage.setItem('metro_uname', myUsername);
            localStorage.setItem('metro_room', currentRoom);

            window.history.replaceState({}, '', `?room=${encodeURIComponent(currentRoom)}`);

            document.getElementById('screen-login').classList.remove('active');
            document.getElementById('screen-loading').classList.add('active');
            document.getElementById('loading-status').innerText = `ПОДКЛЮЧЕНИЕ (ПОРТ 443)...`;

            initAudioStream();
            connectMQTT();
        }

        async function initAudioStream() {
            if (!localStream) {
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({
                        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                    });
                    setMicEnabled(false);
                } catch(e) { console.error("Ошибка микрофона:", e); }
            }
        }

        /* ================= 2. СИГНАЛИЗАЦИЯ И СТАТУС СВЯЗИ ================= */
        function updateGasLamp(color, text) {
            const lamp = document.getElementById('gas-lamp');
            const lampText = document.getElementById('gas-lamp-text');
            lamp.className = `gas-lamp-bulb ${color}`;
            lampText.innerText = text;
        }

        function connectMQTT() {
            const clientId = 'metro_' + myUserId + '_' + Math.random().toString(36).substr(2, 4);

            try {
                mqttClient = mqtt.connect(BROKERS[currentBrokerIdx], { clientId: clientId, keepalive: 30 });

                mqttClient.on('connect', () => {
                    const topic = `metro/webrtc/v12/${currentRoom}`;
                    mqttClient.subscribe(topic, { qos: 1 }, (err) => {
                        if (!err) {
                            showChatScreen();
                            updateGasLamp('green', 'ONLINE');
                            publishPayload({ type: 'system', content: `Сталкер [${myUsername}] подключился.` });
                        }
                    });
                });

                mqttClient.on('message', (topic, message) => {
                    try {
                        const payload = JSON.parse(message.toString());
                        if (payload.uid === myUserId && (payload.type.startsWith('rtc_') || payload.type === 'status_update')) return;

                        if (payload.type === 'rtc_offer') handleOffer(payload);
                        else if (payload.type === 'rtc_answer') handleAnswer(payload);
                        else if (payload.type === 'rtc_candidate') handleCandidate(payload);
                        else if (payload.type === 'status_update') handleRemoteStatus(payload);
                        else renderIncomingMessage(payload);
                    } catch(e) { console.error(e); }
                });

                mqttClient.on('error', () => switchBroker());
                mqttClient.on('close', () => updateGasLamp('red', 'OFF'));
            } catch(e) { switchBroker(); }
        }

        function switchBroker() {
            if (mqttClient) { try { mqttClient.end(true); } catch(e){} }
            currentBrokerIdx = (currentBrokerIdx + 1) % BROKERS.length;
            setTimeout(connectMQTT, 1000);
        }

        function showChatScreen() {
            document.getElementById('screen-loading').classList.remove('active');
            document.getElementById('screen-chat').classList.add('active');
            document.getElementById('display-user').innerText = myUsername;
            document.getElementById('display-room').innerText = '#' + currentRoom;
        }

        /* ================= 3. WEBRTC & РАЦИЯ ================= */
        async function setupPeerConnection() {
            if (peerConnection) return;

            peerConnection = new RTCPeerConnection(iceServersConfig);
            peerConnection.oniceconnectionstatechange = () => {
                const s = peerConnection.iceConnectionState;
                if (s === 'connected' || s === 'completed') updateGasLamp('green', 'P2P');
                else if (s === 'failed' || s === 'disconnected') updateGasLamp('red', 'BAD');
            };

            await initAudioStream();
            if (localStream) {
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            }

            peerConnection.ontrack = (event) => {
                const remoteAudio = document.getElementById('remote-audio');
                remoteAudio.srcObject = event.streams[0];
                remoteAudio.play().catch(() => {});
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) publishPayload({ type: 'rtc_candidate', candidate: event.candidate });
            };
        }

        function setMicEnabled(enabled) {
            if (localStream) {
                localStream.getAudioTracks().forEach(track => { track.enabled = enabled; });
            }
        }

        async function startPTT() {
            if (isPTTActive || isCallActive) return;
            isPTTActive = true;
            document.getElementById('ptt-btn').classList.add('active-ptt');

            await setupPeerConnection();
            setMicEnabled(true);

            if (peerConnection && peerConnection.signalingState === 'stable') {
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                publishPayload({ type: 'rtc_offer', offer: offer });
            }

            updateBanner(true, `РАЦИЯ: ${myUsername} говорит...`);
            publishPayload({ type: 'status_update', mode: 'ptt', active: true, speaker: myUsername });
        }

        function stopPTT() {
            if (!isPTTActive) return;
            isPTTActive = false;
            document.getElementById('ptt-btn').classList.remove('active-ptt');

            if (!isCallActive) {
                setMicEnabled(false);
                updateBanner(false);
            }
            publishPayload({ type: 'status_update', mode: 'ptt', active: false, speaker: myUsername });
        }

        async function toggleCall() {
            getAudioContext();
            if (!isCallActive) {
                isCallActive = true;
                document.getElementById('call-toggle-btn').classList.add('active-call');
                document.getElementById('call-toggle-btn').innerHTML = '🔴 ЗВОНОК<br>(В ЭФИРЕ)';

                await setupPeerConnection();
                setMicEnabled(true);

                if (peerConnection) {
                    const offer = await peerConnection.createOffer();
                    await peerConnection.setLocalDescription(offer);
                    publishPayload({ type: 'rtc_offer', offer: offer });
                }

                updateBanner(true, `АУДИОЗВОНОК (АКТИВЕН)`);
                publishPayload({ type: 'status_update', mode: 'call', active: true, speaker: myUsername });
            } else {
                isCallActive = false;
                document.getElementById('call-toggle-btn').classList.remove('active-call');
                document.getElementById('call-toggle-btn').innerHTML = '📞 ЗВОНОК<br>(1 НАЖАТИЕ)';

                if (!isPTTActive) {
                    setMicEnabled(false);
                    updateBanner(false);
                }
                publishPayload({ type: 'status_update', mode: 'call', active: false, speaker: myUsername });
            }
        }

        async function handleOffer(payload) {
            await setupPeerConnection();
            await peerConnection.setRemoteDescription(new RTCSessionDescription(payload.offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            publishPayload({ type: 'rtc_answer', answer: answer });
        }

        async function handleAnswer(payload) {
            if (peerConnection && peerConnection.signalingState !== 'stable') {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(payload.answer));
            }
        }

        async function handleCandidate(payload) {
            if (peerConnection) {
                try { await peerConnection.addIceCandidate(new RTCIceCandidate(payload.candidate)); } catch(e){}
            }
        }

        function handleRemoteStatus(payload) {
            if (payload.active) {
                updateBanner(true, `${payload.mode.toUpperCase()}: говорит ${payload.speaker}`);
            } else if (!isCallActive && !isPTTActive) {
                updateBanner(false);
            }
        }

        function updateBanner(show, text = '') {
            const banner = document.getElementById('call-banner');
            document.getElementById('banner-mode-text').innerText = text;
            banner.classList.toggle('active', show);
        }

        /* ================= 4. ДИНАМИЧЕСКИЙ SAMPLE-RATE И JITTER BUFFER ================= */
        async function toggleVoiceRecord() {
            const ctx = getAudioContext();
            const btn = document.getElementById('rec-btn');

            if (!isVoiceRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    voiceRecorder = new MediaRecorder(stream);
                    voiceChunks = [];

                    voiceRecorder.ondataavailable = e => { if (e.data.size > 0) voiceChunks.push(e.data); };
                    voiceRecorder.onstop = () => {
                        const audioBlob = new Blob(voiceChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            // ОТПРАВЛЯЕМ ВМЕСТЕ С РЕАЛЬНОЙ ЧАСТОТОЙ ДИСКРЕТИЗАЦИИ УСТРОЙСТВА
                            publishPayload({ 
                                type: 'audio', 
                                sampleRate: ctx.sampleRate, 
                                content: reader.result 
                            });
                        };
                        reader.readAsDataURL(audioBlob);
                        stream.getTracks().forEach(track => track.stop());
                    };

                    voiceRecorder.start();
                    isVoiceRecording = true;
                    btn.classList.add('recording');
                } catch(e) { alert("Ошибка микрофона!"); }
            } else {
                isVoiceRecording = false;
                btn.classList.remove('recording');
                if (voiceRecorder && voiceRecorder.state === 'recording') voiceRecorder.stop();
            }
        }

        // ДЕКОДИРОВАНИЕ С АВТОМАТИЧЕСКИМ РЕСЕМПЛИРОВАНИЕМ В ДИНАМИК ПРИНИМАЮЩЕЙ СТОРОНЫ (БЕЗ "ПЬЯНОГО" ГОЛОСА)
        async function playAudioBufferWithResampling(base64Data, senderSampleRate) {
            const ctx = getAudioContext();
            
            // Преобразуем Base64 в ArrayBuffer
            const res = await fetch(base64Data);
            const arrayBuffer = await res.arrayBuffer();

            // decodeAudioData автоматически подгоняет частоту записи под текущую частоту динамика
            ctx.decodeAudioData(arrayBuffer, (decodedBuffer) => {
                // ПОМЕЩАЕМ В JITTER BUFFER (СГЛАЖИВАНИЕ В 60 МС)
                jitterBufferQueue.push(decodedBuffer);
                if (!isProcessingJitter) {
                    processJitterBuffer();
                }
            }, (err) => console.error("Ошибка декодирования аудио:", err));
        }

        // АНТИ-ЭХО И СГЛАЖИВАНИЕ ДЖИТЕРА (60 МС БУФЕР)
        function processJitterBuffer() {
            if (jitterBufferQueue.length === 0) {
                isProcessingJitter = false;
                return;
            }

            isProcessingJitter = true;
            const ctx = getAudioContext();
            const bufferToPlay = jitterBufferQueue.shift();

            const source = ctx.createBufferSource();
            source.buffer = bufferToPlay;
            source.connect(ctx.destination);

            // Небольшая сглаживающая пауза (60ms Jitter Buffer)
            setTimeout(() => {
                source.start(0);
                source.onended = () => processJitterBuffer();
            }, 60);
        }

        /* ================= 5. СООБЩЕНИЯ И МЕДИА ================= */
        function publishPayload(data) {
            if (!mqttClient || !mqttClient.connected) return;
            const fullPayload = {
                id: 'm_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                uid: myUserId,
                sender: myUsername,
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                ...data
            };
            mqttClient.publish(`metro/webrtc/v12/${currentRoom}`, JSON.stringify(fullPayload), { qos: 1 });
        }

        function sendTextMessage() {
            const input = document.getElementById('chat-message-input');
            const text = input.value.trim();
            if (!text) return;
            publishPayload({ type: 'text', content: text });
            input.value = '';
        }

        function handleKeyPress(e) { if (e.key === 'Enter') sendTextMessage(); }

        const renderedMsgs = new Set();

        function renderIncomingMessage(data) {
            if (data.id && renderedMsgs.has(data.id)) return;
            if (data.id) renderedMsgs.add(data.id);

            const box = document.getElementById('chat-messages');

            if (data.type === 'system') {
                const sysDiv = document.createElement('div');
                sysDiv.className = 'msg system';
                sysDiv.innerText = data.content;
                box.appendChild(sysDiv);
                box.scrollTop = box.scrollHeight;
                return;
            }

            const isSelf = data.uid === myUserId;
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${isSelf ? 'self' : 'other'}`;

            let contentHTML = '';
            if (data.type === 'text') {
                contentHTML = `<div class="msg-text">${escapeHTML(data.content)}</div>`;
            } else if (data.type === 'image') {
                contentHTML = `<div class="msg-media-preview" onclick="openMediaModal('image', '${data.content}')"><img src="${data.content}"></div>`;
            } else if (data.type === 'video') {
                contentHTML = `<div class="msg-media-preview" onclick="openMediaModal('video', '${data.content}')"><video src="${data.content}"></video></div>`;
            } else if (data.type === 'audio') {
                contentHTML = `
                    <div class="audio-player">
                        <button class="audio-play-btn" onclick="playAudioBufferWithResampling('${data.content}', ${data.sampleRate || 44100})">▶</button>
                        <span style="font-size:10px; color:var(--metro-muted);">ГОЛОСОВОЕ (${data.sampleRate ? data.sampleRate + 'Hz' : 'AUTO'})</span>
                    </div>
                `;
            }

            msgDiv.innerHTML = `
                <div class="msg-meta">
                    <span class="msg-sender">${escapeHTML(data.sender)}</span>
                    <span class="msg-time">${data.timestamp}</span>
                </div>
                ${contentHTML}
            `;

            box.appendChild(msgDiv);
            box.scrollTop = box.scrollHeight;
        }

        let activeMediaSrc = '', activeMediaType = '';
        function openMediaModal(type, src) {
            activeMediaSrc = src; activeMediaType = type;
            const container = document.getElementById('modal-container');
            container.innerHTML = type === 'image' ? `<img src="${src}">` : `<video src="${src}" controls autoplay></video>`;
            document.getElementById('media-modal').classList.add('active');
        }

        function closeMediaModal() {
            document.getElementById('modal-container').innerHTML = '';
            document.getElementById('media-modal').classList.remove('active');
        }

        function downloadCurrentMedia() {
            if (!activeMediaSrc) return;
            const a = document.createElement('a');
            a.href = activeMediaSrc;
            a.download = `metro_media_${Date.now()}.${activeMediaType === 'image' ? 'jpg' : 'mp4'}`;
            a.click();
        }

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (evt) => publishPayload({ type: 'image', content: evt.target.result });
                reader.readAsDataURL(file);
            } else if (file.type.startsWith('video/')) {
                if (file.size > 10 * 1024 * 1024) return alert("Видео до 10 МБ!");
                const reader = new FileReader();
                reader.onload = (evt) => publishPayload({ type: 'video', content: evt.target.result });
                reader.readAsDataURL(file);
            }
            e.target.value = '';
        }

        function copyInviteLink() {
            navigator.clipboard.writeText(window.location.href);
            alert("Ссылка скопирована!");
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }
    </script>
