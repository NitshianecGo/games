<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>METRO NET // ПРЯМАЯ ЛИНИЯ СВЯЗИ (WEBRTC)</title>
    <!-- Шрифт терминала Metro -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <!-- MQTT.js для быстрых сигналов -->
    <script src="https://unpkg.com/mqtt@5.3.0/dist/mqtt.min.js"></script>
    <style>
        :root {
            --metro-amber: #ff7700;
            --metro-amber-glow: rgba(255, 119, 0, 0.4);
            --metro-green: #33ff66;
            --metro-green-glow: rgba(51, 255, 102, 0.4);
            --metro-red: #ff3333;
            --metro-dark: #0a0d0f;
            --metro-panel: #141a1f;
            --metro-border: #2c3842;
            --metro-text: #c8d6e0;
            --metro-muted: #627785;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--metro-dark);
            color: var(--metro-text);
            font-family: 'Share Tech Mono', monospace;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .crt::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 999;
            background-size: 100% 3px, 6px 100%;
            pointer-events: none;
        }

        .screen {
            display: none;
            width: 100%;
            max-width: 900px;
            height: 100dvh;
            max-height: 100dvh;
            flex-direction: column;
            position: relative;
            z-index: 10;
            padding: 6px;
        }

        .screen.active { display: flex; }

        #screen-loading {
            justify-content: center;
            align-items: center;
            text-align: center;
            background: #050708;
        }

        .metro-loader {
            width: 50px;
            height: 50px;
            border: 4px solid var(--metro-border);
            border-top: 4px solid var(--metro-amber);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            box-shadow: 0 0 15px var(--metro-amber-glow);
            margin-bottom: 20px;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .loading-title {
            color: var(--metro-amber);
            font-size: 20px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--metro-amber);
            margin-bottom: 8px;
        }

        .loading-status { color: var(--metro-muted); font-size: 13px; }

        #screen-login { justify-content: center; align-items: center; }

        .login-card {
            background: var(--metro-panel);
            border: 2px solid var(--metro-border);
            padding: 20px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 0 25px rgba(0,0,0,0.8);
        }

        .metro-title {
            color: var(--metro-amber);
            font-size: 20px;
            text-align: center;
            margin-bottom: 16px;
            text-shadow: 0 0 10px var(--metro-amber);
            letter-spacing: 2px;
        }

        .field-group { margin-bottom: 14px; }
        .field-group label {
            display: block;
            font-size: 11px;
            color: var(--metro-muted);
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .metro-input {
            width: 100%;
            background: #0b0e11;
            border: 1px solid var(--metro-border);
            color: var(--metro-amber);
            padding: 10px 12px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            user-select: text;
            -webkit-user-select: text;
        }

        .metro-btn {
            width: 100%;
            background: var(--metro-panel);
            color: var(--metro-amber);
            border: 1px solid var(--metro-amber);
            padding: 12px;
            font-family: inherit;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        #screen-chat { padding: 6px; }

        .chat-header {
            background: var(--metro-panel);
            border: 1px solid var(--metro-border);
            padding: 8px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            gap: 6px;
            flex-shrink: 0;
        }

        .channel-info { display: flex; align-items: center; gap: 8px; font-size: 12px; }

        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--metro-green);
            box-shadow: 0 0 8px var(--metro-green);
        }

        .status-dot.disconnected { background: var(--metro-red); box-shadow: 0 0 8px var(--metro-red); }

        .user-tag { color: var(--metro-amber); font-weight: bold; }

        .copy-btn {
            background: transparent;
            border: 1px solid var(--metro-border);
            color: var(--metro-text);
            padding: 6px 10px;
            font-family: inherit;
            font-size: 11px;
            cursor: pointer;
        }

        .call-banner {
            display: none;
            background: rgba(51, 255, 102, 0.15);
            border: 1px solid var(--metro-green);
            color: var(--metro-green);
            padding: 8px;
            text-align: center;
            font-size: 12px;
            margin-bottom: 6px;
            letter-spacing: 1px;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse { 0% { opacity: 0.6; } 100% { opacity: 1; } }
        .call-banner.active { display: block; }

        .chat-body {
            flex: 1;
            min-height: 0;
            background: #07090b;
            border: 1px solid var(--metro-border);
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 6px;
        }

        .msg {
            max-width: 85%;
            padding: 8px 12px;
            border: 1px solid var(--metro-border);
            background: var(--metro-panel);
            word-wrap: break-word;
        }

        .msg.self { align-self: flex-end; border-color: rgba(255, 119, 0, 0.4); background: #1c150e; }
        .msg.other { align-self: flex-start; border-color: #2a343d; }
        .msg.system {
            align-self: center;
            max-width: 95%;
            background: transparent;
            border: none;
            color: var(--metro-muted);
            font-size: 11px;
            text-align: center;
        }

        .msg-meta { display: flex; justify-content: space-between; font-size: 10px; color: var(--metro-muted); margin-bottom: 4px; gap: 10px; }
        .msg.self .msg-sender { color: var(--metro-amber); }
        .msg-text { font-size: 13px; line-height: 1.3; color: var(--metro-text); user-select: text; }

        .chat-input-panel {
            background: var(--metro-panel);
            border: 1px solid var(--metro-border);
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
        }

        .input-row { display: flex; gap: 6px; align-items: center; }

        .input-btn {
            background: #0b0e11;
            border: 1px solid var(--metro-border);
            color: var(--metro-amber);
            width: 38px; height: 38px;
            font-size: 16px;
            cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            flex-shrink: 0;
        }

        #chat-message-input { flex: 1; height: 38px; font-size: 13px; }

        .call-btn {
            width: 100%;
            height: 48px;
            background: #0b0e11;
            border: 2px solid var(--metro-amber);
            color: var(--metro-amber);
            font-family: inherit;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
            transition: all 0.2s ease;
        }

        .call-btn.active-call {
            background: var(--metro-red);
            border-color: var(--metro-red);
            color: white;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.6);
        }

        #toast {
            position: fixed;
            bottom: 80px; left: 50%;
            transform: translateX(-50%);
            background: var(--metro-amber);
            color: var(--metro-dark);
            padding: 6px 16px;
            font-weight: bold;
            display: none;
            z-index: 1000;
            font-size: 12px;
        }
    </style>
</head>
<body class="crt">

    <div id="toast">СКОПИРОВАНО В БУФЕР</div>

    <!-- Скрытый элемент для воспроизведения чистейшего голоса -->
    <audio id="remote-audio" autoplay style="display:none;"></audio>

    <!-- 1. Экран Загрузки -->
    <div id="screen-loading" class="screen active">
        <div class="metro-loader"></div>
        <div class="loading-title">METRO-NET WebRTC</div>
        <div id="loading-status" class="loading-status">ПОДКЛЮЧЕНИЕ К СЕТИ...</div>
    </div>

    <!-- 2. Экран Входа -->
    <div id="screen-login" class="screen">
        <div class="login-card">
            <div class="metro-title">ПРЯМАЯ ЛИНИЯ</div>
            <div class="field-group">
                <label for="username-input">Позывной сталкера</label>
                <input type="text" id="username-input" class="metro-input" placeholder="Артем" maxlength="15" autocomplete="off">
            </div>
            <div class="field-group">
                <label for="room-input">Номер частоты</label>
                <input type="text" id="room-input" class="metro-input" placeholder="канал..." maxlength="20" autocomplete="off">
            </div>
            <button class="metro-btn" onclick="startSession()">
                <span>ПОДКЛЮЧИТЬСЯ</span> ➤
            </button>
        </div>
    </div>

    <!-- 3. Экран Чата и Звонка -->
    <div id="screen-chat" class="screen">
        <div class="chat-header">
            <div class="channel-info">
                <div id="conn-status" class="status-dot"></div>
                <div>
                    <span>ПОЗЫВНОЙ: <strong id="display-user" class="user-tag">---</strong></span>
                    <span style="color:var(--metro-muted); margin-left: 4px;">[<span id="display-room" style="color:var(--metro-amber);">---</span>]</span>
                </div>
            </div>
            <button class="copy-btn" onclick="copyInviteLink()">🔗 ССЫЛКА</button>
        </div>

        <div id="call-banner" class="call-banner">
            📞 АКТИВНОЕ СОЕДИНЕНИЕ WEBRTC (ПРЯМОЙ ЭФИР)
        </div>

        <div id="chat-messages" class="chat-body">
            <div class="msg system">Канал без VPN. Нажмите «НАЧАТЬ ЗВОНОК» — у собеседника автоматически включится аудиосвязь.</div>
        </div>

        <div class="chat-input-panel">
            <button id="call-toggle-btn" class="call-btn" onclick="toggleCall()">
                📞 НАЧАТЬ ЗВОНОК (БЕЗ VPN)
            </button>

            <div class="input-row">
                <input type="text" id="chat-message-input" class="metro-input" placeholder="Сообщение..." onkeypress="handleKeyPress(event)">
                <button class="input-btn" onclick="sendTextMessage()">➤</button>
            </div>
        </div>
    </div>

    <script>
        /* ================= 1. КОНФИГУРАЦИЯ И СЕРВЕРЫ ОБХОДА БЛОКИРОВОК ================= */
        // Публичные STUN-серверы Google & Twilio для создания прямого P2P соединения РФ-США
        const iceServersConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
                { urls: 'stun:global.stun.twilio.com:3478' }
            ]
        };

        const BROKERS = [
            'wss://broker.emqx.io:8084/mqtt',
            'wss://test.mosquitto.org:8081/mqtt',
            'wss://broker.hivemq.com:8884/mqtt'
        ];
        let currentBrokerIdx = 0;
        let mqttClient = null;

        let myUserId = localStorage.getItem('metro_uid') || 'u_' + Math.random().toString(36).substr(2, 7);
        localStorage.setItem('metro_uid', myUserId);

        let myUsername = localStorage.getItem('metro_uname') || '';
        let rawRoom = new URLSearchParams(window.location.search).get('room') || localStorage.getItem('metro_room') || '';

        function cleanRoomName(str) {
            if (!str) return '';
            try { str = decodeURIComponent(str); } catch(e){}
            return str.toLowerCase().replace(/[^a-z0-9_-]/g, '');
        }

        let currentRoom = cleanRoomName(rawRoom);

        /* WebRTC переменные */
        let peerConnection = null;
        let localStream = null;
        let isInCall = false;

        /* ================= 2. ИНИЦИАЛИЗАЦИЯ ================= */
        window.onload = () => {
            setTimeout(() => {
                document.getElementById('screen-loading').classList.remove('active');
                document.getElementById('screen-login').classList.add('active');

                if (myUsername) document.getElementById('username-input').value = myUsername;
                if (!currentRoom) currentRoom = 'metro-' + Math.random().toString(36).substr(2, 6);
                document.getElementById('room-input').value = currentRoom;

                if (myUsername && new URLSearchParams(window.location.search).get('room')) {
                    startSession();
                }
            }, 800);
        };

        function startSession() {
            const unameInput = document.getElementById('username-input').value.trim();
            const roomInput = cleanRoomName(document.getElementById('room-input').value.trim());

            if (!unameInput || !roomInput) return alert("Укажите позывной и корректную частоту!");

            myUsername = unameInput;
            currentRoom = roomInput;

            localStorage.setItem('metro_uname', myUsername);
            localStorage.setItem('metro_room', currentRoom);

            window.history.replaceState({}, '', `?room=${encodeURIComponent(currentRoom)}`);

            document.getElementById('screen-login').classList.remove('active');
            document.getElementById('screen-loading').classList.add('active');
            document.getElementById('loading-status').innerText = `ПОДКЛЮЧЕНИЕ К ЧАСТОТЕ #${currentRoom}...`;

            connectMQTT();
        }

        /* ================= 3. МГНОВЕННАЯ СИГНАЛИЗАЦИЯ СВЯЗИ ================= */
        function connectMQTT() {
            const clientId = 'metro_' + myUserId + '_' + Math.random().toString(36).substr(2, 4);

            try {
                mqttClient = mqtt.connect(BROKERS[currentBrokerIdx], { clientId: clientId, keepalive: 30 });

                mqttClient.on('connect', () => {
                    const topic = `metro/webrtc/v7/${currentRoom}`;
                    mqttClient.subscribe(topic, { qos: 1 }, (err) => {
                        if (!err) {
                            showChatScreen();
                            publishPayload({ type: 'system', content: `Сталкер [${myUsername}] подключился.` });
                        }
                    });
                });

                mqttClient.on('message', (topic, message) => {
                    try {
                        const payload = JSON.parse(message.toString());
                        if (payload.uid === myUserId) return; // Игнорируем свои сообщения

                        if (payload.type === 'rtc_offer') handleOffer(payload);
                        else if (payload.type === 'rtc_answer') handleAnswer(payload);
                        else if (payload.type === 'rtc_candidate') handleCandidate(payload);
                        else if (payload.type === 'rtc_end') stopCall(false);
                        else renderIncomingMessage(payload);
                    } catch(e) { console.error(e); }
                });

                mqttClient.on('error', () => switchBroker());
            } catch(e) { switchBroker(); }
        }

        function switchBroker() {
            if (mqttClient) { try { mqttClient.end(true); } catch(e){} }
            currentBrokerIdx = (currentBrokerIdx + 1) % BROKERS.length;
            setTimeout(connectMQTT, 1500);
        }

        function showChatScreen() {
            document.getElementById('screen-loading').classList.remove('active');
            document.getElementById('screen-chat').classList.add('active');
            document.getElementById('display-user').innerText = myUsername;
            document.getElementById('display-room').innerText = '#' + currentRoom;
        }

        /* ================= 4. ДВИЖОК WEBRTC (ПРЯМОЙ ЭФИР РЕСПУБЛИКА-США) ================= */
        async function toggleCall() {
            if (!isInCall) {
                await startCall(true);
            } else {
                stopCall(true);
            }
        }

        async function createPeerConnection() {
            peerConnection = new RTCPeerConnection(iceServersConfig);

            // Получаем доступ к микрофону с шумоподавлением и эхоподавлением
            localStream = await navigator.mediaDevices.getUserMedia({
                audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
            });

            // Добавляем микрофон в прямой поток
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            // Когда прилетает голос собеседника -> выводим в динамики
            peerConnection.ontrack = (event) => {
                const remoteAudio = document.getElementById('remote-audio');
                remoteAudio.srcObject = event.streams[0];
            };

            // Пересылаем сетевые данные (ICE) второму абоненту
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    publishPayload({ type: 'rtc_candidate', candidate: event.candidate });
                }
            };
        }

        async function startCall(isInitiator) {
            try {
                isInCall = true;
                updateCallUI(true);
                await createPeerConnection();

                if (isInitiator) {
                    const offer = await peerConnection.createOffer();
                    await peerConnection.setLocalDescription(offer);
                    publishPayload({ type: 'rtc_offer', offer: offer });
                }
            } catch (e) {
                alert("Ошибка доступа к микрофону!");
                stopCall(false);
            }
        }

        async function handleOffer(payload) {
            if (!isInCall) {
                isInCall = true;
                updateCallUI(true);
                await createPeerConnection();
            }

            await peerConnection.setRemoteDescription(new RTCSessionDescription(payload.offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            publishPayload({ type: 'rtc_answer', answer: answer });
        }

        async function handleAnswer(payload) {
            if (peerConnection) {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(payload.answer));
            }
        }

        async function handleCandidate(payload) {
            if (peerConnection) {
                try {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(payload.candidate));
                } catch(e) {}
            }
        }

        function stopCall(sendSignal = true) {
            isInCall = false;
            updateCallUI(false);

            if (sendSignal) publishPayload({ type: 'rtc_end' });

            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }

            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }

            const remoteAudio = document.getElementById('remote-audio');
            remoteAudio.srcObject = null;
        }

        function updateCallUI(active) {
            const btn = document.getElementById('call-toggle-btn');
            const banner = document.getElementById('call-banner');

            if (active) {
                btn.classList.add('active-call');
                btn.innerText = '🔴 В ЭФИРЕ (НАЖМИТЕ ЧТОБЫ ЗАВЕРШИТЬ)';
                banner.classList.add('active');
            } else {
                btn.classList.remove('active-call');
                btn.innerText = '📞 НАЧАТЬ ЗВОНОК (БЕЗ VPN)';
                banner.classList.remove('active');
            }
        }

        /* ================= 5. ЧАТ И СООБЩЕНИЯ ================= */
        function publishPayload(data) {
            if (!mqttClient || !mqttClient.connected) return;
            const fullPayload = {
                id: 'm_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                uid: myUserId,
                sender: myUsername,
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                ...data
            };
            mqttClient.publish(`metro/webrtc/v7/${currentRoom}`, JSON.stringify(fullPayload), { qos: 1 });
        }

        function handleKeyPress(e) { if (e.key === 'Enter') sendTextMessage(); }

        function sendTextMessage() {
            const input = document.getElementById('chat-message-input');
            const text = input.value.trim();
            if (!text) return;
            publishPayload({ type: 'text', content: text });
            input.value = '';
        }

        const renderedMsgs = new Set();

        function renderIncomingMessage(data) {
            if (data.id && renderedMsgs.has(data.id)) return;
            if (data.id) renderedMsgs.add(data.id);

            const box = document.getElementById('chat-messages');

            if (data.type === 'system') {
                const sysDiv = document.createElement('div');
                sysDiv.className = 'msg system';
                sysDiv.innerText = data.content;
                box.appendChild(sysDiv);
                box.scrollTop = box.scrollHeight;
                return;
            }

            const isSelf = data.uid === myUserId;
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${isSelf ? 'self' : 'other'}`;

            msgDiv.innerHTML = `
                <div class="msg-meta">
                    <span class="msg-sender">${escapeHTML(data.sender)}</span>
                    <span class="msg-time">${data.timestamp}</span>
                </div>
                <div class="msg-text">${escapeHTML(data.content)}</div>
            `;

            box.appendChild(msgDiv);
            box.scrollTop = box.scrollHeight;
        }

        function copyInviteLink() {
            navigator.clipboard.writeText(window.location.href);
            const toast = document.getElementById('toast');
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 2000);
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }
    </script>
</body>
</html>
