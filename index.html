<!DOCTYPE html>
<html lang="ru">
<head>

    <style>
        /* ===== ОБЩИЕ СТИЛИ ===== */
        * {
            box-sizing: border-box;
        }
        body {
            background: #0c0a09;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #1c1917;
        }
        ::-webkit-scrollbar-thumb {
            background: #44403c;
            border-radius: 2px;
        }
        .toast-container {

        }
        .toast-container>* {
            pointer-events: auto;
        }
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-16px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .toast-enter {
            animation: slideDown 0.28s ease-out forwards;
        }
        .modal-overlay {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(2px);

        .modal-scroll {

        }
        .modal-scroll::-webkit-scrollbar {

        }

        .sys-window {

        .shop-item .owned-badge {

        .raid-boss-svg {

        .toast-close {

        }

        .toast-content {

        /* ===== КАРТА ===== */
        #mapCanvas {
            width: 100%;
            height: 280px;
            border-radius: 4px;
            border: 1px solid #3d352e;

        .map-legend {

        /* ===== МУЗЫКАЛЬНЫЙ ПЛЕЕР ===== */

        /* ===== ВКЛАДКИ ПОРТФОЛИО (Ачивки, Чертежи, Рецепты) ===== */
        .tab-btn {
            flex: 1;
            text-align: center;
            padding: 6px 0;
            font-size: 11px;
            font-family: monospace;
            background: transparent;
            border: none;
            color: #78716c;
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.12s;
        }
        .tab-btn.active {
            background: #f59e0b;
            color: #0c0a09;
            font-weight: 700;
        }
        .tab-btn:hover:not(.active) {
            color: #d6d3d1;
        }

        /* Экран загрузки */
        #loading-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #0a0806;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', monospace;
            color: #d4a373;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        #loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        #loading-screen .logo {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            background: linear-gradient(45deg, #d97706, #f59e0b, #d97706);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 2s ease-in-out infinite alternate;
        }
        #loading-screen .sub {
            margin-top: 0.5rem;
            font-size: 0.8rem;
            letter-spacing: 0.5em;
            opacity: 0.7;
            color: #a87c4b;
        }
        #loading-screen .loader {
            margin-top: 2rem;
            width: 200px;
            height: 4px;
            background: #2a1f14;
            border-radius: 2px;
            overflow: hidden;
            border: 1px solid #5a3f2b;
        }
        #loading-screen .loader-bar {
            height: 100%;
            width: 0%;
            background: #d97706;
            animation: loadProgress 2.5s ease-in-out forwards;
        }
        #loading-screen .status {
            margin-top: 0.8rem;
            font-size: 0.7rem;
            font-family: monospace;
            color: #7a5f3b;
            letter-spacing: 0.2em;
            animation: pulseText 1.5s ease-in-out infinite;
        }
        @keyframes shimmer {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 100% 50%;
            }
        }
        @keyframes loadProgress {
            0% {
                width: 0%;
            }
            100% {
                width: 100%;
            }
        }
        @keyframes pulseText {
            0%,
            100% {
                opacity: 0.4;
            }
            50% {
                opacity: 1;
            }
        }
    </style>
</head>
<body>

    <!-- ===== ЭКРАН ЗАГРУЗКИ ===== -->
    <div id="loading-screen">
        <div class="logo">Протокол Пустошь</div>
        <div class="sub">ВЫЖИВАНИЕ · АКТИВАЦИЯ</div>
        <div class="loader">
            <div class="loader-bar"></div>
        </div>
        <div class="status">ЗАГРУЗКА СИСТЕМЫ...</div>
    </div>

    <!-- ===== КОРНЕВОЙ КОНТЕЙНЕР ===== -->
    <div id="root"></div>

    <!-- ===== МУЗЫКАЛЬНЫЙ ПЛЕЕР ===== -->
    <div class="music-player" id="musicPlayer" style="display:none;">
        <div class="controls">
            <button id="musicToggle" title="Вкл/Выкл">🔊</button>
            <button id="musicPrev" title="Предыдущий">⏮</button>
            <button id="musicNext" title="Следующий">⏭</button>
        </div>
        <div class="track-name" id="trackName">8-bit 1</div>
        <input type="range" class="volume-slider" id="musicVolume" min="0" max="100" value="30" />
    </div>

    <script>
        // ============================================================
        //  МУЗЫКА (8-Bit синтезатор)
        // ============================================================
        const Music = {
            ctx: null,
            isPlaying: false,
            currentTrack: 0,
            volume: 0.3,
            interval: null,
            tracks: [
                { name: "Пустошь", notes: [
                        ['C4', 4],
                        ['E4', 4],
                        ['G4', 4],
                        ['C5', 4],
                        ['G4', 4],
                        ['E4', 4],
                        ['C4', 4],
                        ['E4', 4],
                        ['G4', 4],
                        ['C5', 4],
                        ['G4', 4],
                        ['E4', 4]
                    ] },
                { name: "Ветер", notes: [
                        ['D4', 2],
                        ['F#4', 2],
                        ['A4', 2],
                        ['D5', 2],
                        ['A4', 2],
                        ['F#4', 2],
                        ['D4', 2],
                        ['F#4', 2],
                        ['A4', 2],
                        ['D5', 2],
                        ['A4', 2],
                        ['F#4', 2]
                    ] },
                { name: "Тишина", notes: [
                        ['E4', 3],
                        ['G4', 3],
                        ['B4', 3],
                        ['E5', 3],
                        ['B4', 3],
                        ['G4', 3],
                        ['E4', 3],
                        ['G4', 3],
                        ['B4', 3],
                        ['E5', 3],
                        ['B4', 3],
                        ['G4', 3]
                    ] },
            ],
            init() {
                try {
                    this.ctx = new(window.AudioContext || window.webkitAudioContext)();
                } catch (e) {
                    console.warn('Web Audio не поддерживается');
                    return;
                }
                document.getElementById('musicToggle').addEventListener('click', () => this.toggle());
                document.getElementById('musicPrev').addEventListener('click', () => this.prev());
                document.getElementById('musicNext').addEventListener('click', () => this.next());
                document.getElementById('musicVolume').addEventListener('input', (e) => {
                    this.volume = parseFloat(e.target.value) / 100;
                });
                document.getElementById('musicPlayer').style.display = 'flex';
            },
            toggle() {
                if (this.isPlaying) this.stop();
                else this.start();
            },
            start() {
                if (!this.ctx) return;
                if (this.isPlaying) return;
                this.isPlaying = true;
                document.getElementById('musicToggle').textContent = '🔇';
                this.playTrack(this.currentTrack);
            },
            stop() {
                this.isPlaying = false;
                document.getElementById('musicToggle').textContent = '🔊';
                if (this.interval) {
                    clearInterval(this.interval);
                    this.interval = null;
                }
                if (this.ctx) {
                    this.ctx.close();
                    this.ctx = new(window.AudioContext || window.webkitAudioContext)();
                }
            },
            playTrack(index) {
                if (!this.isPlaying) return;
                const track = this.tracks[index];
                document.getElementById('trackName').textContent = track.name;
                let noteIndex = 0;
                const playNext = () => {
                    if (!this.isPlaying) return;
                    if (noteIndex >= track.notes.length) {
                        this.next();
                        return;
                    }
                    const [noteName, duration] = track.notes[noteIndex];
                    this.playNote(noteName, duration);
                    noteIndex++;
                    this.interval = setTimeout(playNext, duration * 180);
                };
                playNext();
            },
            playNote(noteName, duration) {
                if (!this.ctx) return;
                const freq = this.noteToFreq(noteName);
                if (!freq) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.value = freq;
                gain.gain.value = this.volume * 0.25;
                gain.gain.setValueAtTime(0, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(this.volume * 0.25, this.ctx.currentTime + 0.02);
                gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + duration * 0.17);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration * 0.18);
            },
            noteToFreq(note) {
                const map = {
                    'C4': 261.63,
                    'D4': 293.66,
                    'E4': 329.63,
                    'F4': 349.23,
                    'G4': 392.00,
                    'A4': 440.00,
                    'B4': 493.88,
                    'C5': 523.25,
                    'D5': 587.33,
                    'E5': 659.25,
                    'F5': 698.46,
                    'G5': 783.99,
                    'A5': 880.00,
                    'B5': 987.77,
                    'F#4': 369.99,
                    'G#4': 415.30,
                    'A#4': 466.16,
                    'C#4': 277.18,
                    'D#4': 311.13,
                };
                return map[note] || 440;
            },
            next() {
                if (!this.isPlaying) return;
                this.currentTrack = (this.currentTrack + 1) % this.tracks.length;
                if (this.interval) {
                    clearTimeout(this.interval);
                    this.interval = null;
                }
                this.playTrack(this.currentTrack);
            },
            prev() {
                if (!this.isPlaying) return;
                this.currentTrack = (this.currentTrack - 1 + this.tracks.length) % this.tracks.length;
                if (this.interval) {
                    clearTimeout(this.interval);
                    this.interval = null;
                }
                this.playTrack(this.currentTrack);
            }
        };

        // ============================================================
        //  ДАННЫЕ (расширенные)
        // ============================================================

            { id: "bp3", category: "medical", name: "Первая помощь при ожогах", threshold: 14000, risk: "low",
                short: "Что делать в первые минуты после бытового ожога.",
                steps: ["Убери источник тепла немедленно.", "Охлаждай прохладной проточной водой 10-15 минут.",

        // ============================================================

        function levelInfo(steps) {
            let level = 1;
            while (500 * level * level <= steps) level++;
            const prevReq = 500 * (level - 1) * (level - 1);
            const nextReq = 500 * level * level;
            const progress = Math.min(1, (steps - prevReq) / (nextReq - prevReq));
            return { level, prevReq, nextReq, progress };
        }

        function getCrystals() {
            const fromSteps = Math.floor(state.steps / 10000) * 5 +
                Math.floor(state.steps / 30000) * 50;
            return fromSteps + state.crystalsBought - state.crystalsSpent;
        }

        function getLevelInfo() { return levelInfo(state.steps); }

        function getDistance() { return state.steps * 0.0008; }

        function getActiveMinutes() { return Math.floor(state.steps / 130); }

        function getStatPoints() { return Math.floor(getDistance() / 0.5); }

        function getEndurance() { return 5 + Math.round(getStatPoints() * 0.4); }

        function getStrength() { return 5 + Math.round(getStatPoints() * 0.35); }

        function getAgility() { return 5 + Math.round(getStatPoints() * 0.25); }

        function getHeroTier() {
            const lv = getLevelInfo().level;
            return lv >= 12 ? 4 : lv >= 8 ? 3 : lv >= 4 ? 2 : 1;
        }

        function getAdsDisabled() { return state.steps >= 500000; }

        function getClanTierObj() { return CLAN_TIERS[state.clanTier] || CLAN_TIERS[0]; }

        function getSelectedBp() {
            if (!state.selectedItem) return null;
            return ALL_LEARNABLE.find(b => b.id === state.selectedItem) || null;
        }

        // ============================================================
        //  TOASTS
        // ============================================================

        let toastIdCounter = 0;

        function pushToast(text, type = 'info') {
            const id = ++toastIdCounter;
            state.toasts.push({ id, text, type });
            scheduleUpdate();
            setTimeout(() => {
                removeToast(id);
            }, 5000);
        }

        function removeToast(id) {
            state.toasts = state.toasts.filter(t => t.id !== id);
            scheduleUpdate();
        }

        // ============================================================
        //  SAVE / LOAD
        // ============================================================

        function saveState() {
            try {
                const data = {
                    steps: state.steps,
                    unlocked: state.unlocked,
                    unlockedAch: state.unlockedAch,
                    confirmedAdult: state.confirmedAdult,
                    crystalsSpent: state.crystalsSpent,
                    crystalsBought: state.crystalsBought,
                    owned: state.owned,
                    notifSettings: state.notifSettings,
                    lastAdMilestone: state.lastAdMilestone,
                    clanTier: state.clanTier,
                    _portfolioSub: state._portfolioSub,
                    avatar: state.avatar,
                    questsCompleted: state.questsCompleted,
                    loreUnlocked: state.loreUnlocked,
                };
                localStorage.setItem('wasteland_protocol', JSON.stringify(data));
            } catch (e) { /* ignore */ }
        }

        function loadState() {
            try {
                const raw = localStorage.getItem('wasteland_protocol');
                if (!raw) return;
                const data = JSON.parse(raw);
                Object.assign(state, data);
                state.prevLevel = getLevelInfo().level;
                state.unlocked = state.unlocked || [];
                state.unlockedAch = state.unlockedAch || [];
                state.owned = state.owned || [];
                state.confirmedAdult = state.confirmedAdult || {};
                state.notifSettings = state.notifSettings || { progress: true, raid: true, clan: true, offers: true };
                state._portfolioSub = state._portfolioSub || 'achievements';
                state.avatar = state.avatar || { head: "none", top: "none", bottom: "none", shoes: "none" };
                state.questsCompleted = state.questsCompleted || [];
                state.loreUnlocked = state.loreUnlocked || 0;
                if (state.raid.interval) {
                    clearInterval(state.raid.interval);
                    state.raid.interval = null;
                }
                state.raid.stage = 'idle';
            } catch (e) { /* ignore */ }
        }

                    pushToast(`Открыто: «${bp.name}»`, 'blueprint');

                    state.unlockedAch.push(a.id);
                    pushToast(`Достижение получено: «${a.name}»`, 'achievement');
                }
            });
            if (li.level > state.prevLevel) {
                pushToast(`Новый уровень: ${li.level}`, 'level');
                state.prevLevel = li.level;
            }
            const milestone = Math.floor(state.steps / 30000);
            if (milestone > state.lastAdMilestone && state.steps < 500000 && !getAdsDisabled()) {
                state.showAd = true;
            }
            LORE.forEach((lore, index) => {
                if (state.steps >= lore.threshold && state.loreUnlocked <= index) {
                    state.loreUnlocked = index + 1;
                    pushToast(`📖 ${lore.title}: ${lore.text.substring(0, 60)}...`, 'info');
                }
            });
            QUESTS.forEach(q => {
                if (q.type === 'steps' && state.steps >= q.target && !state.questsCompleted.includes(q.id)) {
                    state.questsCompleted.push(q.id);
                    const crystalsReward = q.reward || 30;
                    state.crystalsBought += crystalsReward;
                    pushToast(`Квест выполнен: ${q.desc} (+${crystalsReward} кристаллов)`, 'success');
                }
            });
        }

        // ============================================================
        //  UPDATE LOOP
        // ============================================================

        let updateScheduled = false;

        function scheduleUpdate() {
            if (!updateScheduled) {
                updateScheduled = true;
                requestAnimationFrame(() => {
                    updateScheduled = false;
                    fullUpdate();
                });
            }
        }

        function fullUpdate() {
            runEffects();
            handleChallengeTimer();
            saveState();
            render();
        }

        // ============================================================
        //  CHALLENGE TIMER
        // ============================================================

        function handleChallengeTimer() {
            if (state.challenge.active) {
                if (state.challenge.timeLeft <= 0) {
                    const success = state.challenge.clicks >= 18;
                    state.challenge.active = false;
                    state.challenge.result = success ? 'win' : 'lose';
                    if (success) {
                        state.steps += 2000;
                        pushToast('Локация пройдена: бонус за скорость получен', 'success');
                    } else {
                        pushToast('Время вышло — бонус не выдан', 'warn');
                    }
                    scheduleUpdate();
                    return;
                }
                if (!state.challengeTimer) {
                    state.challengeTimer = setTimeout(() => {
                        state.challenge.timeLeft -= 1;
                        state.challengeTimer = null;
                        scheduleUpdate();
                    }, 1000);
                }
            } else {
                if (state.challengeTimer) {
                    clearTimeout(state.challengeTimer);
                    state.challengeTimer = null;
                }
            }
        }

        // ============================================================
        //  RAID
        // ============================================================

        function startRaid() {
            if (state.raid.interval) {
                clearInterval(state.raid.interval);
                state.raid.interval = null;
            }
            const level = getLevelInfo().level;
            const baseDist = 200 + Math.floor(Math.random() * 300);
            const speed = 1.2 + level * 0.3;
            const timeNeeded = baseDist / speed;
            const timeLimit = Math.ceil(timeNeeded) + 60;

            state.raid = {
                stage: 'run',
                meters: 0,
                target: baseDist,
                combo: 0,
                puzzle: null,
                result: null,
                timeLeft: timeLimit,
                totalTime: timeLimit,
                interval: null,
                speed: speed,
            };

            pushToast(`Рейд начат! Дистанция ${baseDist}м, время ${timeLimit}с.`, 'info');

            state.raid.interval = setInterval(() => {
                const r = state.raid;
                if (r.stage === 'puzzle') {
                    r.timeLeft -= 1;
                    if (r.timeLeft <= 0) {
                        clearInterval(r.interval);
                        r.interval = null;
                        r.stage = 'result';
                        r.result = 'lose';
                        pushToast('Время вышло! Рейд провален.', 'warn');
                        scheduleUpdate();
                    }
                    scheduleUpdate();
                    return;
                }
                if (r.stage !== 'run') {
                    clearInterval(r.interval);
                    r.interval = null;
                    return;
                }
                r.timeLeft -= 1;
                r.meters += r.speed;
                if (r.meters >= r.target) {
                    clearInterval(r.interval);
                    r.interval = null;
                    r.stage = 'result';
                    r.result = 'win';
                    const bonus = Math.floor(r.combo * 500 + 1000);
                    state.steps += bonus;
                    pushToast(`Рейд пройден! +${bonus} шагов`, 'success');
                    scheduleUpdate();
                    return;
                }
                if (r.timeLeft <= 0) {
                    clearInterval(r.interval);
                    r.interval = null;
                    r.stage = 'result';
                    r.result = 'lose';
                    pushToast('Время вышло! Рейд провален.', 'warn');
                    scheduleUpdate();
                    return;
                }
                scheduleUpdate();
            }, 1000);
            scheduleUpdate();
        }

        function answerPuzzle(idx) {
            const r = state.raid;
            if (r.stage !== 'puzzle' || !r.puzzle) return;
            const correct = idx === r.puzzle.answer;
            if (correct) {
                pushToast('Верно! Комбо +1', 'success');
                r.combo += 1;
                r.stage = 'run';
                r.puzzle = null;
                r.timeLeft += 30;
                pushToast('Дополнительные 30 секунд!', 'info');
                scheduleUpdate();
            } else {
                pushToast('Неверно, штраф: -10 секунд', 'warn');
                r.timeLeft -= 10;
                if (r.timeLeft < 0) r.timeLeft = 0;
                scheduleUpdate();
            }
        }

        // ============================================================
        //  ACTIONS
        // ============================================================

        function setTab(tab) { state.tab = tab;
            scheduleUpdate(); }

        function addSteps(n) {
            state.steps += n;
            scheduleUpdate();
        }

        function startChallenge() {
            state.challenge = { active: true, timeLeft: 15, clicks: 0, result: null };
            state.challengeTimer = null;
            scheduleUpdate();
        }

        function challengeClick() {
            if (!state.challenge.active) return;
            state.challenge.clicks += 1;
            scheduleUpdate();
        }

        function buyItem(item) {
            const crystals = getCrystals();
            if (crystals < item.price) { pushToast('Недостаточно кристаллов', 'warn');
                scheduleUpdate(); return; }
            state.crystalsSpent += item.price;
            state.owned.push(item.id);
            pushToast(`Куплено: ${item.name}`, 'success');
            scheduleUpdate();
        }

        function buyPack(pack) {
            state.crystalsBought += pack.amount;
            pushToast(`+${pack.amount} кристаллов зачислено (демо-покупка)`, 'success');
            scheduleUpdate();
        }

        function upgradeClan() {
            const next = CLAN_TIERS[state.clanTier + 1];
            if (!next) return;
            const crystals = getCrystals();
            if (crystals < next.cost) { pushToast('Недостаточно кристаллов для улучшения', 'warn');
                scheduleUpdate(); return; }
            state.crystalsSpent += next.cost;
            state.clanTier += 1;
            pushToast(`Клан улучшен: ${next.label}`, 'success');
            scheduleUpdate();
        }

        function toggleNotif(id) {
            state.notifSettings[id] = !state.notifSettings[id];
            scheduleUpdate();
        }

        function closeAd() {
            state.showAd = false;
            state.lastAdMilestone = Math.floor(state.steps / 30000);
            scheduleUpdate();
        }

        function closeModal() { state.selectedItem = null;
            scheduleUpdate(); }

        function confirmAdult(id) {
            state.confirmedAdult[id] = true;
            scheduleUpdate();
        }

        function setSelectedItem(id) { state.selectedItem = id;
            scheduleUpdate(); }

        function resetProgress() {
            if (!confirm('Сбросить весь прогресс? Это действие необратимо.')) return;
            localStorage.removeItem('wasteland_protocol');
            if (state.raid.interval) {
                clearInterval(state.raid.interval);
                state.raid.interval = null;
            }
            Object.assign(state, {
                steps: 0,
                unlocked: [],
                unlockedAch: [],
                confirmedAdult: {},
                crystalsSpent: 0,
                crystalsBought: 0,
                owned: [],
                notifSettings: { progress: true, raid: true, clan: true, offers: true },
                lastAdMilestone: 0,
                showAd: false,
                clanTier: 0,
                challenge: { active: false, timeLeft: 15, clicks: 0, result: null },
                raid: { stage: 'idle', meters: 0, target: 0, combo: 0, puzzle: null, result: null, timeLeft: 0,
                    totalTime: 0, interval: null, speed: 0 },
                prevLevel: 1,
                _portfolioSub: 'achievements',
                avatar: { head: "none", top: "none", bottom: "none", shoes: "none" },
                questsCompleted: [],
                loreUnlocked: 0,
            });
            if (state.challengeTimer) {
                clearTimeout(state.challengeTimer);

        // ============================================================
        //  КАРТА (рисование на canvas) – до 100 000 шагов
        // ============================================================

        function drawMap() {
            const canvas = document.getElementById('mapCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width = canvas.clientWidth || 600;
            const h = canvas.height = canvas.clientHeight || 280;

            // Фон
            const grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, '#4a6a3a');
            grad.addColorStop(0.3, '#6a8a4a');
            grad.addColorStop(0.6, '#8a7a4a');
            grad.addColorStop(0.85, '#6a5a3a');
            grad.addColorStop(1, '#4a3a2a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            // Небо
            const skyGrad = ctx.createLinearGradient(0, 0, 0, h * 0.3);
            skyGrad.addColorStop(0, '#5a7a8a');
            skyGrad.addColorStop(1, '#6a8a6a');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, w, h * 0.3);

            // Облака
            for (let i = 0; i < 6; i++) {
                const cx = (i * 120 + 30) % w;
                const cy = 20 + (i * 17) % 30;
                ctx.fillStyle = 'rgba(200,210,200,0.3)';
                ctx.beginPath();
                ctx.ellipse(cx, cy, 50 + i * 10, 14 + i * 3, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(cx + 40, cy - 8, 35 + i * 8, 12 + i * 2, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(cx - 30, cy + 4, 30 + i * 6, 10 + i * 2, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            // Горы
            const mountains = [
                [0.05, 0.6, 0.25, 0.35],
                [0.25, 0.55, 0.20, 0.40],
                [0.45, 0.65, 0.30, 0.30],
                [0.70, 0.58, 0.22, 0.38],
                [0.88, 0.62, 0.18, 0.33]
            ];
            mountains.forEach(([x, y, wm, hm]) => {
                const px = x * w,
                    py = y * h;
                const pw = wm * w,
                    ph = hm * h;
                ctx.fillStyle = '#4a5a3a';
                ctx.beginPath();
                ctx.moveTo(px, py + ph);
                ctx.quadraticCurveTo(px + pw * 0.3, py - ph * 0.2, px + pw * 0.5, py);
                ctx.quadraticCurveTo(px + pw * 0.7, py - ph * 0.15, px + pw, py + ph);
                ctx.fill();
                ctx.fillStyle = 'rgba(220,230,240,0.3)';
                ctx.beginPath();
                ctx.moveTo(px + pw * 0.3, py + ph * 0.2);
                ctx.quadraticCurveTo(px + pw * 0.45, py - ph * 0.1, px + pw * 0.55, py + ph * 0.1);
                ctx.fill();
            });

            // Река
            ctx.strokeStyle = '#3a7a9a';
            ctx.lineWidth = 8;
            ctx.shadowColor = 'rgba(58,122,154,0.3)';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.moveTo(w * 0.02, h * 0.7);
            ctx.quadraticCurveTo(w * 0.15, h * 0.5, w * 0.3, h * 0.65);
            ctx.quadraticCurveTo(w * 0.45, h * 0.8, w * 0.6, h * 0.55);
            ctx.quadraticCurveTo(w * 0.75, h * 0.4, w * 0.9, h * 0.6);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Деревья
            const trees = [
                [0.08, 0.45],
                [0.12, 0.50],
                [0.18, 0.42],
                [0.35, 0.55],
                [0.42, 0.50],
                [0.55, 0.48],
                [0.65, 0.42],
                [0.72, 0.50],
                [0.82, 0.45],
                [0.92, 0.48]
            ];
            trees.forEach(([x, y]) => {
                const px = x * w,
                    py = y * h;
                ctx.fillStyle = '#2a4a2a';
                ctx.beginPath();
                ctx.arc(px, py, 10 + Math.random() * 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#1a3a1a';
                ctx.beginPath();
                ctx.arc(px - 4, py - 6, 8 + Math.random() * 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#3a5a3a';
                ctx.beginPath();
                ctx.arc(px + 5, py - 4, 7 + Math.random() * 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#4a3a2a';
                ctx.fillRect(px - 2, py + 6, 4, 12);
            });

            // Тропа
            ctx.setLineDash([6, 8]);
            ctx.strokeStyle = 'rgba(200,180,150,0.5)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(w * 0.02, h * 0.75);
            ctx.quadraticCurveTo(w * 0.12, h * 0.6, w * 0.25, h * 0.55);
            ctx.quadraticCurveTo(w * 0.38, h * 0.45, w * 0.50, h * 0.50);
            ctx.quadraticCurveTo(w * 0.62, h * 0.55, w * 0.75, h * 0.45);
            ctx.quadraticCurveTo(w * 0.88, h * 0.40, w * 0.96, h * 0.50);
            ctx.stroke();
            ctx.setLineDash([]);

            // Точки локаций (из LORE)
            const unlocked = state.loreUnlocked;
            LORE.forEach((lore, idx) => {
                const px = lore.x / 100 * w;
                const py = lore.y / 100 * h;
                const isUnlocked = idx < unlocked;
                const isHover = state.mapHoverPoint === idx;

                if (isUnlocked) {
                    const glow = ctx.createRadialGradient(px, py, 2, px, py, 22);
                    glow.addColorStop(0, 'rgba(255,215,0,0.25)');
                    glow.addColorStop(1, 'rgba(255,215,0,0)');
                    ctx.fillStyle = glow;
                    ctx.beginPath();
                    ctx.arc(px, py, 22, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.fillStyle = isUnlocked ? '#f59e0b' : '#44403c';
                ctx.strokeStyle = isUnlocked ? '#fbbf24' : '#57534e';
                ctx.lineWidth = isHover ? 3 : 2;
                ctx.beginPath();
                ctx.arc(px, py, isHover ? 14 : 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                if (isUnlocked) {
                    ctx.font = '16px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(lore.icon, px, py);
                }

                if (isUnlocked && isHover) {
                    ctx.fillStyle = 'rgba(12,10,9,0.85)';
                    const tw = ctx.measureText(lore.title).width || 60;
                    const tx = Math.min(Math.max(px - tw / 2 - 6, 4), w - tw - 12);
                    const ty = py - 28;
                    ctx.fillRect(tx, ty - 14, tw + 12, 24);
                    ctx.fillStyle = '#fbbf24';
                    ctx.font = 'bold 11px sans-serif';
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(lore.title, tx + 4, ty + 2);
                }
            });

            // Игрок – прогресс до 100 000 шагов
            const maxSteps = 100000;
            const pct = Math.min(1, state.steps / maxSteps);
            const px = w * (0.02 + pct * 0.94);
            const py = h * (0.75 - pct * 0.30);

            const glowP = ctx.createRadialGradient(px, py, 2, px, py, 28);
            glowP.addColorStop(0, 'rgba(255,200,100,0.3)');
            glowP.addColorStop(1, 'rgba(255,200,100,0)');
            ctx.fillStyle = glowP;
            ctx.beginPath();
            ctx.arc(px, py, 28, 0, Math.PI * 2);
            ctx.fill();

            ctx.font = '28px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🧑‍🦯', px, py);

            ctx.fillStyle = 'rgba(200,180,150,0.7)';
            ctx.font = '9px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('▶ ВЫ ЗДЕСЬ', px, py + 30);
        }

          </div>`;
            return tabHTML + `<div class="mt-3 space-y-2">${content}</div>`;
        }

        function renderHero() {
            const li = getLevelInfo();

                shoes: ['none', 'кроссовки', 'ботинки', 'сапоги']
            };

                head: { none: '👤', шляпа: '🎩', каска: '⛑️', бандана: '🧢' },

                bottom: { none: '👖', джинсы: '👖', шорты: '🩳', брюки: '👖' },

            let preview = '';
            ['head', 'top', 'bottom', 'shoes'].forEach(p => {

            let avatarHTML = `
            <div class="avatar-preview">${preview}</div>
            <div class="grid grid-cols-2 gap-2">

                <span class="text-xs text-stone-400 w-12">${part}:</span>
                <select class="avatar-select" data-avatar-part="${part}">
                  ${parts[part].map(opt => `<option value="${opt}" ${state.avatar[part] === opt ? 'selected' : ''}>${opt}</option>`).join('')}
                </select>
              </div>`;
            });
            avatarHTML += `</div>`;

            return `
          ${sysWindow('ПРОФИЛЬ ВЫЖИВШЕГО', `
            <div class="flex items-center gap-4">

                <div class="text-sm font-extrabold text-stone-100">Выживший · Ур. ${li.level}</div>

            ${statRow('flame', 'Сила', str, 'text-rose-400')}

          `)}
          `;
        }

        function renderClan() {
            const tier = getClanTierObj();
            const next = CLAN_TIERS[state.clanTier + 1];
            const crystals = getCrystals();
            const sorted = [...CLAN_MEMBERS].sort((a, b) => (b.leader ? 1 : 0) - (a.leader ? 1 : 0));

                ).join('');

            return `
          ${sysWindow('КЛАН · ПУСТОШЬ-7', `
            <div class="flex items-center gap-2 mb-2">${clanBannerSVG()}<div class="text-sm font-bold text-stone-100">${tier.label}</div></div>

        function renderRaid() {
            const r = state.raid;
            let body = '';
            if (r.stage === 'idle') {
                body = `
              <p class="text-xs text-stone-400 my-3">Активируй рейд: пробеги дистанцию за время. Уровень влияет на скорость.</p>
              <button class="w-full bg-rose-600 hover:bg-rose-500 text-white font-bold uppercase text-xs tracking-wide rounded-sm py-2.5" data-start-raid>Активировать рейд</button>
            `;
            } else if (r.stage === 'run') {
                const pct = Math.min(100, (r.meters / r.target) * 100);
                body = `
              <div class="mt-3">
                <div class="flex justify-between text-xs font-mono text-stone-400 mb-1">
                  <span>${Math.round(r.meters)} / ${r.target} м</span>
                  <span>⏱️ ${r.timeLeft} с</span>
                </div>
                <div class="w-full h-3 bg-stone-800 rounded-full overflow-hidden ring-1 ring-stone-700 mb-3">
                  <div class="h-full bg-amber-500 transition-all duration-200" style="width:${pct}%"></div>
                </div>
                <div class="text-xs text-stone-400 text-center">Скорость: ${r.speed.toFixed(1)} м/с</div>
                <div class="text-xs text-stone-500 mt-2 text-center">Автоматическое движение...</div>
              </div>
            `;
            } else if (r.stage === 'puzzle' && r.puzzle) {
                body = `
              <div class="mt-3">
                <div class="text-xs font-mono text-amber-300 mb-1">Комбо: ${r.combo}</div>
                <div class="text-sm font-bold text-stone-100 mb-2">${r.puzzle.q}</div>
                <div class="grid grid-cols-2 gap-2">
                  ${r.puzzle.options.map((o, i) => `<button class="bg-stone-800 hover:bg-stone-700 border border-stone-700 rounded-sm py-2 text-xs font-mono text-stone-200" data-puzzle="${i}">${o}</button>`).join('')}
                </div>
              </div>
            `;
            } else if (r.stage === 'result') {
                body = `
              <div class="mt-3 text-center space-y-2">
                <div class="text-${r.result === 'win' ? 'emerald' : 'rose'}-400 text-sm font-bold">${r.result === 'win' ? '🏆 Босс повержен!' : '💀 Рейд провален'}</div>

                <button class="w-full bg-amber-500 text-stone-950 font-bold uppercase text-xs tracking-wide rounded-sm py-2.5" data-start-raid>Ещё раз</button>
              </div>
            `;
            }
            return sysWindow('РЕЙД-БОСС', `
            ${raidBossSVG()}
            ${body}
          `);
        }

            return `

            <div class="text-[11px] font-mono text-stone-500 mb-3">За шаги (10k=5, 30k=50) + квесты + рейды.</div>

                <span>${isUnlocked ? lore.icon : '🔒'}</span>
                <span class="font-bold text-stone-100 text-sm">${isUnlocked ? lore.title : '???'}</span>
                <span class="text-[10px] text-stone-500 ml-auto">${isUnlocked ? fmt(lore.threshold) + ' шагов' : '🔒'}</span>

              <div class="text-xs text-stone-400 mt-1">${isUnlocked ? lore.text : 'Откроется на ' + lore.threshold + ' шагов'}</div>

            }).join('');

            return `

                  <div class="text-[10px] font-mono text-stone-500 mb-2">ПОШАГОВАЯ ИНСТРУКЦИЯ</div>
                  <ol class="space-y-2">
                    ${bp.steps.map((s, i) => `<li class="flex gap-2 text-sm text-stone-300"><span class="text-amber-500 font-mono text-xs shrink-0 mt-0.5">${i+1}.</span><span>${s}</span></li>`).join('')}
                  </ol>
                </div>
                <a href="${youtubeSearchUrl(bp.videoQuery)}" target="_blank" rel="noreferrer" class="flex items-center justify-center gap-2 w-full border border-stone-700 rounded-sm py-2.5 text-xs font-bold uppercase tracking-wide text-stone-300 hover:bg-stone-900 mt-3">
                  <i data-lucide="youtube" class="w-4 h-4 text-rose-500"></i> Смотреть видео
                </a>
                ${bp.escalation ? `<div class="border border-amber-800/60 bg-amber-950/20 rounded-sm p-3 flex gap-2 mt-3"><i data-lucide="phone" class="w-4 h-4 text-amber-400 shrink-0 mt-0.5"></i><span class="text-xs text-amber-200">${bp.escalation}</span></div>` : ''}
                <div class="text-[10px] text-stone-600 font-mono mt-3">Не заменяет консультацию специалиста.</div>
              `;
                }
                modalHTML = `
              <div class="fixed inset-0 bg-black/70 z-40 flex items-end sm:items-center justify-center p-0 sm:p-4 modal-overlay">
                <div class="bg-stone-950 border border-stone-700 rounded-t-lg sm:rounded-lg w-full max-w-md max-h-[85vh] overflow-y-auto modal-scroll">
                  <div class="sticky top-0 bg-stone-950 border-b border-stone-800 px-4 py-3 flex items-center justify-between">
                    <div>
                      <div class="text-[10px] font-mono tracking-widest text-amber-500/70">${bp.category === 'cooking' ? 'РЕЦЕПТ' : 'ЧЕРТЁЖ'}</div>
                      <div class="font-extrabold text-stone-100">${bp.name}</div>
                    </div>
                    <button class="text-stone-500" data-close-modal><i data-lucide="x" class="w-5 h-5"></i></button>
                  </div>
                  <div class="p-4 space-y-3">
                    <div class="text-xs font-mono ${risk.color}">${risk.label}</div>
                    ${modalBody}
                  </div>
                </div>
              </div>
            `;
            }

            const fullHTML = `
          ${topBar}
          ${adBanner}
          ${toastHTML}
          <div class="max-w-md mx-auto px-4 mt-4 space-y-4 pb-24">
            ${tabContent}
          </div>
          ${nav}
          ${modalHTML}
          `;

            root.innerHTML = fullHTML;

            // Рисуем карту
            if (state.tab === 'world') {
                setTimeout(drawMap, 50);
                const canvas = document.getElementById('mapCanvas');
                if (canvas) {
                    canvas.onmousemove = function(e) {
                        const rect = canvas.getBoundingClientRect();
                        const x = (e.clientX - rect.left) / rect.width * canvas.width;
                        const y = (e.clientY - rect.top) / rect.height * canvas.height;
                        let found = -1;
                        LORE.forEach((lore, idx) => {
                            const px = lore.x / 100 * canvas.width;
                            const py = lore.y / 100 * canvas.height;
                            const dist = Math.sqrt((x - px) ** 2 + (y - py) ** 2);
                            if (dist < 25 && idx < state.loreUnlocked) {
                                found = idx;
                            }
                        });
                        state.mapHoverPoint = found;
                        drawMap();
                    };
                    canvas.onmouseleave = function() {
                        state.mapHoverPoint = null;
                        drawMap();
                    };
                    canvas.onclick = function(e) {
                        const rect = canvas.getBoundingClientRect();
                        const x = (e.clientX - rect.left) / rect.width * canvas.width;
                        const y = (e.clientY - rect.top) / rect.height * canvas.height;
                        LORE.forEach((lore, idx) => {
                            const px = lore.x / 100 * canvas.width;
                            const py = lore.y / 100 * canvas.height;
                            const dist = Math.sqrt((x - px) ** 2 + (y - py) ** 2);
                            if (dist < 25 && idx < state.loreUnlocked) {
                                pushToast(`📖 ${lore.title}: ${lore.text}`, 'info');
                            }
                        });
                    };
                }
            }

            document.querySelectorAll('[data-avatar-part]').forEach(sel => {
                sel.onchange = function() {
                    const part = this.getAttribute('data-avatar-part');
                    setAvatarPart(part, this.value);
                };
            });

            if (typeof lucide !== 'undefined' && lucide.createIcons) {
                lucide.createIcons();
            }
        }

        // ============================================================
        //  EVENT DELEGATION
        // ============================================================

        function setupEventDelegation() {
            const root = document.getElementById('root');
            root.addEventListener('click', function(e) {
                const target = e.target.closest('[data-tab], [data-add], [data-start-challenge], [data-challenge-click], [data-select], [data-close-modal], [data-confirm-adult], [data-start-raid], [data-puzzle], [data-buy-item], [data-buy-pack], [data-upgrade-clan], [data-toggle], [data-close-ad], [data-psub], [data-reset], [data-close-toast], [data-check-sensors]');
                if (!target) return;

                if (target.hasAttribute('data-tab')) {
                    e.preventDefault();
                    setTab(target.getAttribute('data-tab'));
                    return;
                }
                if (target.hasAttribute('data-add')) {
                    e.preventDefault();
                    const n = parseInt(target.getAttribute('data-add'), 10);
                    addSteps(n);
                    return;
                }
                if (target.hasAttribute('data-start-challenge')) {
                    e.preventDefault();
                    startChallenge();
                    return;
                }
                if (target.hasAttribute('data-challenge-click')) {
                    e.preventDefault();
                    challengeClick();
                    return;
                }
                if (target.hasAttribute('data-select')) {
                    e.preventDefault();
                    const id = target.getAttribute('data-select');
                    if (state.unlocked.includes(id)) setSelectedItem(id);
                    return;
                }
                if (target.hasAttribute('data-close-modal')) {
                    e.preventDefault();
                    closeModal();
                    return;
                }
                if (target.hasAttribute('data-confirm-adult')) {
                    e.preventDefault();
                    const id = target.getAttribute('data-confirm-adult');
                    confirmAdult(id);
                    return;
                }
                if (target.hasAttribute('data-start-raid')) {
                    e.preventDefault();
                    startRaid();
                    return;
                }
                if (target.hasAttribute('data-puzzle')) {
                    e.preventDefault();
                    const idx = parseInt(target.getAttribute('data-puzzle'), 10);
                    answerPuzzle(idx);
                    return;
                }
                if (target.hasAttribute('data-buy-item')) {
                    e.preventDefault();
                    const id = target.getAttribute('data-buy-item');
                    const item = SHOP_ITEMS.find(i => i.id === id);
                    if (item) buyItem(item);
                    return;
                }
                if (target.hasAttribute('data-buy-pack')) {
                    e.preventDefault();
                    const id = target.getAttribute('data-buy-pack');
                    const pack = CRYSTAL_PACKS.find(p => p.id === id);
                    if (pack) buyPack(pack);
                    return;
                }
                if (target.hasAttribute('data-upgrade-clan')) {
                    e.preventDefault();
                    upgradeClan();
                    return;
                }
                if (target.hasAttribute('data-toggle')) {
                    e.preventDefault();
                    const id = target.getAttribute('data-toggle');
                    toggleNotif(id);
                    return;
                }
                if (target.hasAttribute('data-close-ad')) {
                    e.preventDefault();
                    closeAd();
                    return;
                }
                if (target.hasAttribute('data-psub')) {
                    e.preventDefault();
                    state._portfolioSub = target.getAttribute('data-psub');
                    scheduleUpdate();
                    return;
                }
                if (target.hasAttribute('data-reset')) {
                    e.preventDefault();
                    resetProgress();
                    return;
                }
                if (target.hasAttribute('data-close-toast')) {
                    e.preventDefault();
                    const id = parseInt(target.getAttribute('data-close-toast'), 10);
                    removeToast(id);
                    return;
                }
                if (target.hasAttribute('data-check-sensors')) {
                    e.preventDefault();
                    if ('geolocation' in navigator) {
                        navigator.geolocation.getCurrentPosition(
                            (pos) => pushToast(`📍 Геолокация: ${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`, 'success'),
                            () => pushToast('❌ Геолокация недоступна', 'warn')
                        );
                    } else {
                        pushToast('❌ Геолокация не поддерживается', 'warn');
                    }
                    if ('DeviceMotionEvent' in window) {
                        pushToast('📱 Шагомер: датчики движения доступны', 'success');
                    } else {
                        pushToast('📱 Шагомер: датчики не поддерживаются', 'warn');
                    }
                    return;
                }
            });
        }

        // ============================================================
        //  BOOT
        // ============================================================

        window.addEventListener('load', function() {
            setTimeout(function() {
                document.getElementById('loading-screen').classList.add('hidden');
            }, 1000);
            setTimeout(() => Music.init(), 500);
        });

        loadState();
        state.prevLevel = getLevelInfo().level;
        scheduleUpdate();
        setupEventDelegation();

        console.log('Протокол Пустошь загружен.');
    </script>
</body>
</html>
