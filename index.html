                    "Выключить конфорку", "Уйти и позвать на помощь"
                ], answer: 1 },
        ];
        const RAID_STAGES = ["run", "puzzle", "run", "puzzle", "puzzle"];

        // Объединяем всё в один массив для чертежей/рецептов
        const ALL_LEARNABLE = [...BLUEPRINTS, ...RECIPES];

        // ============================================================
        //  UTILITY
        // ============================================================

        function levelInfo(steps) {
            let level = 1;
            while (500 * level * level <= steps) level++;
            const prevReq = 500 * (level - 1) * (level - 1);
            const nextReq = 500 * level * level;
            const progress = Math.min(1, (steps - prevReq) / (nextReq - prevReq));
            return { level, prevReq, nextReq, progress };
        }

        function fmt(n) {
            return Math.round(n).toLocaleString("ru-RU");
        }

        function youtubeSearchUrl(q) {
            return `https://www.youtube.com/results?search_query=${encodeURIComponent(q)}`;
        }

        function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }

        function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

        // ============================================================
        //  STATE
        // ============================================================

        const state = {
            steps: 0,
            tab: 'home',
            toasts: [],
            unlocked: [],
            unlockedAch: [],
            selectedItem: null,
            confirmedAdult: {},
            crystalsSpent: 0,
            crystalsBought: 0,
            owned: [],
            notifSettings: { progress: true, raid: true, clan: true, offers: true },
            lastAdMilestone: 0,
            showAd: false,
            clanTier: 0,
            challenge: { active: false, timeLeft: 15, clicks: 0, result: null },
            // Рейд переработан
            raid: {
                stage: 'idle',
                stageIndex: 0,
                meters: 0,
                target: 0,
                combo: 0,
                puzzle: null,
                result: null,
                timeLeft: 0,
                totalTime: 0,
                timer: null,
                speed: 0, // метров в секунду
            },
            prevLevel: 1,
            challengeTimer: null,
            _portfolioSub: 'achievements',
            // Аватар
            avatar: { head: "none", top: "none", bottom: "none", shoes: "none" },
            // Квесты
            questsCompleted: [],
            // История
            loreUnlocked: 0,
        };

        // ============================================================
        //  COMPUTED
        // ============================================================

        function getCrystals() {
            const fromSteps = Math.floor(state.steps / 10000) * 5 + // базовый доход
                Math.floor(state.steps / 30000) * 50; // дополнительный за 30k
            return fromSteps + state.crystalsBought - state.crystalsSpent;
        }

        function getLevelInfo() { return levelInfo(state.steps); }

        function getDistance() { return state.steps * 0.0008; }

        function getActiveMinutes() { return Math.floor(state.steps / 130); }

        function getStatPoints() { return Math.floor(getDistance() / 0.5); }

        function getEndurance() { return 5 + Math.round(getStatPoints() * 0.4); }

        function getStrength() { return 5 + Math.round(getStatPoints() * 0.35); }

        function getAgility() { return 5 + Math.round(getStatPoints() * 0.25); }

        function getHeroTier() {
            const lv = getLevelInfo().level;
            return lv >= 12 ? 4 : lv >= 8 ? 3 : lv >= 4 ? 2 : 1;
        }

        function getAdsDisabled() { return state.steps >= 500000; }

        function getClanTierObj() { return CLAN_TIERS[state.clanTier] || CLAN_TIERS[0]; }

        function getSelectedBp() {
            if (!state.selectedItem) return null;
            return ALL_LEARNABLE.find(b => b.id === state.selectedItem) || null;
        }

        // ============================================================
        //  TOASTS (с автоматическим удалением)
        // ============================================================

        let toastIdCounter = 0;

        function pushToast(text, type = 'info') {
            const id = ++toastIdCounter;
            state.toasts.push({ id, text, type });
            scheduleUpdate();
            // Удаляем через 4.5 секунды
            setTimeout(() => {
                state.toasts = state.toasts.filter(t => t.id !== id);
                scheduleUpdate();
            }, 4500);
        }

        // ============================================================
        //  SAVE / LOAD
        // ============================================================

        function saveState() {
            try {
                const data = {
                    steps: state.steps,
                    unlocked: state.unlocked,
                    unlockedAch: state.unlockedAch,
                    confirmedAdult: state.confirmedAdult,
                    crystalsSpent: state.crystalsSpent,
                    crystalsBought: state.crystalsBought,
                    owned: state.owned,
                    notifSettings: state.notifSettings,
                    lastAdMilestone: state.lastAdMilestone,
                    clanTier: state.clanTier,
                    _portfolioSub: state._portfolioSub,
                    avatar: state.avatar,
                    questsCompleted: state.questsCompleted,
                    loreUnlocked: state.loreUnlocked,
                };
                localStorage.setItem('wasteland_protocol', JSON.stringify(data));
            } catch (e) { /* ignore */ }
        }

        function loadState() {
            try {
                const raw = localStorage.getItem('wasteland_protocol');
                if (!raw) return;
                const data = JSON.parse(raw);
                Object.assign(state, data);
                state.prevLevel = getLevelInfo().level;
                state.unlocked = state.unlocked || [];
                state.unlockedAch = state.unlockedAch || [];
                state.owned = state.owned || [];
                state.confirmedAdult = state.confirmedAdult || {};
                state.notifSettings = state.notifSettings || { progress: true, raid: true, clan: true, offers: true };
                state._portfolioSub = state._portfolioSub || 'achievements';
                state.avatar = state.avatar || { head: "none", top: "none", bottom: "none", shoes: "none" };
                state.questsCompleted = state.questsCompleted || [];
                state.loreUnlocked = state.loreUnlocked || 0;
            } catch (e) { /* ignore */ }
        }

        // ============================================================
        //  EFFECTS
        // ============================================================

        function runEffects() {
            const li = getLevelInfo();
            // Открытие чертежей и рецептов
            ALL_LEARNABLE.forEach(bp => {
                if (state.steps >= bp.threshold && !state.unlocked.includes(bp.id)) {
                    state.unlocked.push(bp.id);
                    pushToast(`Открыто: «${bp.name}»`, 'blueprint');
                }
            });
            // Ачивки
            ACHIEVEMENTS.forEach(a => {
                if (state.steps >= a.threshold && !state.unlockedAch.includes(a.id)) {
                    state.unlockedAch.push(a.id);
                    pushToast(`Достижение получено: «${a.name}»`, 'achievement');
                }
            });
            if (li.level > state.prevLevel) {
                pushToast(`Новый уровень: ${li.level}`, 'level');
                state.prevLevel = li.level;
            }
            // Реклама
            const milestone = Math.floor(state.steps / 30000);
            if (milestone > state.lastAdMilestone && state.steps < 500000 && !getAdsDisabled()) {
                state.showAd = true;
            }
            // История
            LORE.forEach((lore, index) => {
                if (state.steps >= lore.threshold && state.loreUnlocked <= index) {
                    state.loreUnlocked = index + 1;
                    pushToast(`Новая запись в истории: ${lore.title}`, 'info');
                }
            });
            // Проверка квестов (автовыполнение для шаговых)
            QUESTS.forEach(q => {
                if (q.type === 'steps' && state.steps >= q.target && !state.questsCompleted.includes(q.id)) {
                    state.questsCompleted.push(q.id);
                    const crystalsReward = q.reward || 30;
                    state.crystalsBought += crystalsReward;
                    pushToast(`Квест выполнен: ${q.desc} (+${crystalsReward} кристаллов)`, 'success');
                }
            });
            // Кристаллы за шаги (уже учтено в getCrystals)
        }

        // ============================================================
        //  UPDATE LOOP
        // ============================================================

        let updateScheduled = false;

        function scheduleUpdate() {
            if (!updateScheduled) {
                updateScheduled = true;
                requestAnimationFrame(() => {
                    updateScheduled = false;
                    fullUpdate();
                });
            }
        }

        function fullUpdate() {
            runEffects();
            handleRaidTimer(); // обрабатываем таймер рейда
            handleChallengeTimer();
            saveState();
            render();
        }

        // ============================================================
        //  RAID TIMER (автоматическое движение, без кнопки)
        // ============================================================

        function handleRaidTimer() {
            const r = state.raid;
            if (r.stage === 'idle' || r.stage === 'result' || r.stage === 'puzzle') {
                // Если рейд в пазле, таймер не двигает метры
                return;
            }
            if (r.stage === 'run') {
                // Проверяем, не истекло ли время
                if (r.timeLeft <= 0) {
                    // время вышло, рейд провален
                    if (r.timer) {
                        clearTimeout(r.timer);
                        r.timer = null;
                    }
                    state.raid.stage = 'result';
                    state.raid.result = 'lose';
                    pushToast('Время вышло! Рейд провален.', 'warn');
                    scheduleUpdate();
                    return;
                }

                // Если ещё нет таймера, запускаем его
                if (!r.timer) {
                    r.timer = setTimeout(() => {
                        // Уменьшаем время
                        r.timeLeft -= 1;
                        // Добавляем метры пропорционально скорости
                        r.meters += r.speed || 1.5; // если speed не задана, используем базовую

                        // Проверяем, не достиг ли дистанции
                        if (r.meters >= r.target) {
                            // Успех!
                            clearTimeout(r.timer);
                            r.timer = null;
                            state.raid.stage = 'result';
                            state.raid.result = 'win';
                            const bonus = Math.floor(r.combo * 500 + 1000);
                            state.steps += bonus;
                            pushToast(`Рейд пройден! +${bonus} шагов`, 'success');
                            scheduleUpdate();
                            return;
                        }

                        // Если время истекло, то проигрыш
                        if (r.timeLeft <= 0) {
                            clearTimeout(r.timer);
                            r.timer = null;
                            state.raid.stage = 'result';
                            state.raid.result = 'lose';
                            pushToast('Время вышло! Рейд провален.', 'warn');
                            scheduleUpdate();
                            return;
                        }

                        // Обновляем UI
                        scheduleUpdate();
                        // Продолжаем таймер
                        r.timer = setTimeout(arguments.callee, 1000);
                    }, 1000);
                }
            }
        }

        function startRaid() {
            // Определяем дистанцию и время
            const level = getLevelInfo().level;
            const baseDist = 200 + Math.floor(Math.random() * 300); // 200-500 м
            const baseSpeed = 1.4; // м/с (спокойный шаг)
            // Скорость зависит от уровня: чем выше уровень, тем быстрее бег
            // Формула: speed = 1.2 + level * 0.3
            const speed = 1.2 + level * 0.3;
            // Время, необходимое для прохождения дистанции с этой скоростью
            const timeNeeded = baseDist / speed;
            // Добавляем 60 секунд запаса
            const timeLimit = Math.ceil(timeNeeded) + 60;
            // Устанавливаем рейд
            state.raid = {
                stage: 'run',
                stageIndex: 0,
                meters: 0,
                target: baseDist,
                combo: 0,
                puzzle: null,
                result: null,
                timeLeft: timeLimit,
                totalTime: timeLimit,
                timer: null,
                speed: speed,
            };
            pushToast(`Рейд начат! Дистанция ${baseDist}м, время ${timeLimit}с. Скорость ${speed.toFixed(1)} м/с`, 'info');
            scheduleUpdate();
        }

        // Функция для пазлов (оставляем)
        function answerPuzzle(idx) {
            const r = state.raid;
            if (r.stage !== 'puzzle' || !r.puzzle) return;
            const correct = idx === r.puzzle.answer;
            if (correct) {
                pushToast('Верно! Комбо +1', 'success');
                r.combo += 1;
                // переходим к следующему этапу (ран)
                state.raid.stage = 'run';
                state.raid.puzzle = null;
                // даём дополнительное время?
                r.timeLeft += 30;
                pushToast('Дополнительные 30 секунд!', 'info');
                scheduleUpdate();
            } else {
                pushToast('Неверно, штраф: -10 секунд', 'warn');
                r.timeLeft -= 10;
                if (r.timeLeft < 0) r.timeLeft = 0;
                scheduleUpdate();
            }
        }

        // ============================================================
        //  CHALLENGE TIMER (без изменений)
        // ============================================================

        function handleChallengeTimer() {
            if (state.challenge.active) {
                if (state.challenge.timeLeft <= 0) {
                    const success = state.challenge.clicks >= 18;
                    state.challenge.active = false;
                    state.challenge.result = success ? 'win' : 'lose';
                    if (success) {
                        state.steps += 2000;
                        pushToast('Локация пройдена: бонус за скорость получен', 'success');
                    } else {
                        pushToast('Время вышло — бонус не выдан', 'warn');
                    }
                    scheduleUpdate();
                    return;
                }
                if (!state.challengeTimer) {
                    state.challengeTimer = setTimeout(() => {
                        state.challenge.timeLeft -= 1;
                        state.challengeTimer = null;
                        scheduleUpdate();
                    }, 1000);
                }
            } else {
                if (state.challengeTimer) {
                    clearTimeout(state.challengeTimer);
                    state.challengeTimer = null;
                }
            }
        }

        // ============================================================
        //  ACTIONS
        // ============================================================

        function setTab(tab) { state.tab = tab;
            scheduleUpdate(); }

        function addSteps(n) {
            state.steps += n;
            scheduleUpdate();
        }

        function startChallenge() {
            state.challenge = { active: true, timeLeft: 15, clicks: 0, result: null };
            state.challengeTimer = null;
            scheduleUpdate();
        }

        function challengeClick() {
            if (!state.challenge.active) return;
            state.challenge.clicks += 1;
            scheduleUpdate();
        }

        function buyItem(item) {
            const crystals = getCrystals();
            if (crystals < item.price) { pushToast('Недостаточно кристаллов', 'warn');
                scheduleUpdate(); return; }
            state.crystalsSpent += item.price;
            state.owned.push(item.id);
            pushToast(`Куплено: ${item.name}`, 'success');
            scheduleUpdate();
        }

        function buyPack(pack) {
            state.crystalsBought += pack.amount;
            pushToast(`+${pack.amount} кристаллов зачислено (демо-покупка)`, 'success');
            scheduleUpdate();
        }

        function upgradeClan() {
            const next = CLAN_TIERS[state.clanTier + 1];
            if (!next) return;
            const crystals = getCrystals();
            if (crystals < next.cost) { pushToast('Недостаточно кристаллов для улучшения', 'warn');
                scheduleUpdate(); return; }
            state.crystalsSpent += next.cost;
            state.clanTier += 1;
            pushToast(`Клан улучшен: ${next.label}`, 'success');
            scheduleUpdate();
        }

        function toggleNotif(id) {
            state.notifSettings[id] = !state.notifSettings[id];
            scheduleUpdate();
        }

        function closeAd() {
            state.showAd = false;
            state.lastAdMilestone = Math.floor(state.steps / 30000);
            scheduleUpdate();
        }

        function closeModal() { state.selectedItem = null;
            scheduleUpdate(); }

        function confirmAdult(id) {
            state.confirmedAdult[id] = true;
            scheduleUpdate();
        }

        function setSelectedItem(id) { state.selectedItem = id;
            scheduleUpdate(); }

        function resetProgress() {
            if (!confirm('Сбросить весь прогресс? Это действие необратимо.')) return;
            localStorage.removeItem('wasteland_protocol');
            Object.assign(state, {
                steps: 0,
                unlocked: [],
                unlockedAch: [],
                confirmedAdult: {},
                crystalsSpent: 0,
                crystalsBought: 0,
                owned: [],
                notifSettings: { progress: true, raid: true, clan: true, offers: true },
                lastAdMilestone: 0,
                showAd: false,
                clanTier: 0,
                challenge: { active: false, timeLeft: 15, clicks: 0, result: null },
                raid: { stage: 'idle', stageIndex: 0, meters: 0, target: 0, combo: 0, puzzle: null, result: null,
                    timeLeft: 0, totalTime: 0, timer: null, speed: 0 },
                prevLevel: 1,
                _portfolioSub: 'achievements',
                avatar: { head: "none", top: "none", bottom: "none", shoes: "none" },
                questsCompleted: [],
                loreUnlocked: 0,
            });
            if (state.challengeTimer) {
                clearTimeout(state.challengeTimer);
                state.challengeTimer = null;
            }
            if (state.raid.timer) {
                clearTimeout(state.raid.timer);
                state.raid.timer = null;
            }
            pushToast('Прогресс сброшен', 'warn');
            scheduleUpdate();
        }

        // Управление аватаром
        function setAvatarPart(part, value) {
            state.avatar[part] = value;
            scheduleUpdate();
        }

        // ============================================================
        //  RENDER — SVG HELPERS (без изменений)
        // ============================================================

        function heroAvatarSVG(tier) {
            const gearColor = tier >= 3 ? '#f59e0b' : '#78716c';
            return `<svg viewBox="0 0 160 160" class="w-28 h-28 shrink-0">
            <circle cx="80" cy="80" r="76" fill="#1c1917" stroke="#44403c" stroke-width="2"/>
            <circle cx="80" cy="58" r="26" fill="#a8a29e"/>
            <path d="M54 56 q26 -22 52 0 l-4 -18 q-22 -14 -44 0 z" fill="#3f3f46"/>
            <rect x="48" y="90" width="64" height="52" rx="10" fill="${gearColor}"/>
            <rect x="60" y="90" width="40" height="10" fill="#292524" opacity="0.5"/>
            ${tier >= 2 ? `<circle cx="80" cy="112" r="8" fill="#0c0a09" stroke="#f59e0b" stroke-width="2"/>` : ''}
            ${tier >= 4 ? `<path d="M40 96 L26 140 L54 130 Z" fill="#57534e"/><path d="M120 96 L134 140 L106 130 Z" fill="#57534e"/>` : ''}
          </svg>`;
        }

        function raidBossSVG() {
            return `<svg viewBox="0 0 200 140" class="w-full h-24">
            <ellipse cx="100" cy="120" rx="90" ry="14" fill="#0c0a09" opacity="0.6"/>

            <circle cx="80" cy="55" r="7" fill="#f59e0b"/>
            <circle cx="120" cy="55" r="7" fill="#f59e0b"/>

            <path d="M40 120 L20 100 M160 120 L180 100" stroke="#57534e" stroke-width="6" stroke-linecap="round"/>
          </svg>`;
        }

        function clanBannerSVG() {
            return `<svg viewBox="0 0 100 60" class="w-10 h-6 shrink-0">
            <rect x="10" y="4" width="4" height="52" fill="#78716c"/>
            <path d="M14 6 L80 6 L68 20 L80 34 L14 34 Z" fill="#d97706"/>
          </svg>`;
        }

        // ============================================================
        //  RENDER — TABS (добавлены: История, Карта, Аватар)
        // ============================================================

        function renderHome() {
            const li = getLevelInfo();
            const dist = getDistance();
            const mins = getActiveMinutes();
            return `
          ${sysWindow('ЖУРНАЛ АКТИВНОСТИ', `
            <div class="grid grid-cols-3 gap-2 text-center mb-3">
              <div><div class="text-xl font-black text-stone-100">${fmt(state.steps)}</div><div class="text-[10px] font-mono text-stone-500">шагов</div></div>
              <div><div class="text-xl font-black text-stone-100">${dist.toFixed(2)}</div><div class="text-[10px] font-mono text-stone-500">км</div></div>
              <div><div class="text-xl font-black text-stone-100">${mins}</div><div class="text-[10px] font-mono text-stone-500">мин активности</div></div>
            </div>
            <p class="text-xs text-stone-400 leading-relaxed">Система пробудилась вместе с тобой в первый день Пустоши. Каждый шаг здесь — ещё и шаг к настоящему навыку в реальном мире.</p>
          `)}
          ${sysWindow('СИМУЛЯЦИЯ ШАГОМЕРА', `
            <div class="text-[11px] text-stone-400 mb-3">Нажимай кнопки, чтобы добавлять шаги и прокачивать персонажа.</div>
            <div class="grid grid-cols-3 gap-2">
              <button class="bg-stone-800 hover:bg-stone-700 border border-stone-700 rounded-sm py-2 text-xs font-mono text-amber-300" data-add="100">+${fmt(100)}</button>
              <button class="bg-stone-800 hover:bg-stone-700 border border-stone-700 rounded-sm py-2 text-xs font-mono text-amber-300" data-add="1000">+${fmt(1000)}</button>
              <button class="bg-stone-800 hover:bg-stone-700 border border-stone-700 rounded-sm py-2 text-xs font-mono text-amber-300" data-add="5000">+${fmt(5000)}</button>
            </div>
          `)}
          `;
        }

        function renderQuests() {
            const c = state.challenge;
            // Список квестов
            let questList = QUESTS.map(q => {
                const done = state.questsCompleted.includes(q.id);
                return `<div class="flex justify-between items-center border-b border-stone-800 py-2 text-sm">
              <span class="${done ? 'text-emerald-400 line-through' : 'text-stone-300'}">${q.desc}</span>
              <span class="text-xs font-mono text-stone-500">${done ? '✅' : q.reward ? q.reward + ' крист.' : ''}</span>
            </div>`;
            }).join('');
            return `
          ${sysWindow('ЕЖЕДНЕВНОЕ ЗАДАНИЕ', `
            <div class="flex items-start justify-between">
              <div><div class="font-bold text-stone-100 text-sm">Пройди 3 000 шагов сегодня</div><div class="text-xs text-stone-500 mt-1">Награда: 20 кристаллов, опыт</div></div>
              <i data-lucide="footprints" class="w-5 h-5 text-amber-400 mt-1"></i>
            </div>
          `)}
          ${sysWindow('ОФЛАЙН-ЛОКАЦИЯ · БЕЗ СЕТИ', `
            <div class="font-bold text-stone-100 text-sm mb-1">Заброшенный склад</div>
            <p class="text-xs text-stone-400 mb-3">Локация без интернета. Пройди её как можно быстрее — награда зависит от скорости. Цель: 18+ действий за 15 секунд.</p>
            ${!c.active && c.result === null ? `
              <button class="w-full bg-amber-500 text-stone-950 font-bold uppercase text-xs tracking-wide rounded-sm py-2.5" data-start-challenge>Начать вылазку</button>
            ` : ''}
            ${c.active ? `
              <div>
                <div class="flex justify-between text-xs font-mono text-stone-400 mb-2"><span>Осталось: ${c.timeLeft}с</span><span>Действий: ${c.clicks} / 18</span></div>
                <button class="w-full bg-rose-600 hover:bg-rose-500 text-white font-bold uppercase text-xs tracking-wide rounded-sm py-4" data-challenge-click>Действовать!</button>
              </div>
            ` : ''}
            ${!c.active && c.result ? `
              <div class="text-xs font-mono flex items-center justify-between ${c.result === 'win' ? 'text-emerald-400' : 'text-rose-400'}">
                <span>${c.result === 'win' ? 'Успех — бонус получен' : 'Не успел — бонус не выдан'}</span>
                <button class="underline" data-start-challenge>ещё раз</button>
              </div>

                  <i data-lucide="youtube" class="w-4 h-4 text-rose-500"></i> Смотреть видео на YouTube
                </a>
                ${bp.escalation ? `<div class="border border-amber-800/60 bg-amber-950/20 rounded-sm p-3 flex gap-2 mt-3"><i data-lucide="phone" class="w-4 h-4 text-amber-400 shrink-0 mt-0.5"></i><span class="text-xs text-amber-200">${bp.escalation}</span></div>` : ''}
                <div class="text-[10px] text-stone-600 font-mono mt-3">Общеобразовательная информация. Не заменяет консультацию врача/специалиста. Не уверен — позови взрослого или позвони в службу спасения.</div>
              `;
                }
                modalHTML = `
              <div class="fixed inset-0 bg-black/70 z-40 flex items-end sm:items-center justify-center p-0 sm:p-4 modal-overlay">
                <div class="bg-stone-950 border border-stone-700 rounded-t-lg sm:rounded-lg w-full max-w-md max-h-[85vh] overflow-y-auto modal-scroll">
                  <div class="sticky top-0 bg-stone-950 border-b border-stone-800 px-4 py-3 flex items-center justify-between">
                    <div>
                      <div class="text-[10px] font-mono tracking-widest text-amber-500/70">${bp.category === 'cooking' ? 'РЕЦЕПТ' : 'ЧЕРТЁЖ'}</div>
                      <div class="font-extrabold text-stone-100">${bp.name}</div>
                    </div>
                    <button class="text-stone-500" data-close-modal><i data-lucide="x" class="w-5 h-5"></i></button>
                  </div>
                  <div class="p-4 space-y-3">
                    <div class="text-xs font-mono ${risk.color}">${risk.label}</div>
                    ${modalBody}
                  </div>
                </div>
              </div>
            `;
            }

            const fullHTML = `
          ${topBar}
          ${adBanner}
          ${toastHTML}
          <div class="max-w-md mx-auto px-4 mt-4 space-y-4 pb-24">
            ${tabContent}
          </div>
          ${nav}
          ${modalHTML}
          `;

            root.innerHTML = fullHTML;

            if (typeof lucide !== 'undefined' && lucide.createIcons) {
                lucide.createIcons();
            }
        }

        // ============================================================
        //  EVENT DELEGATION (обновлён)
        // ============================================================

        function setupEventDelegation() {
            const root = document.getElementById('root');
            root.addEventListener('click', function(e) {
                const target = e.target.closest('[data-tab], [data-add], [data-start-challenge], [data-challenge-click], [data-select], [data-close-modal], [data-confirm-adult], [data-start-raid], [data-puzzle], [data-buy-item], [data-buy-pack], [data-upgrade-clan], [data-toggle], [data-close-ad], [data-psub], [data-reset], [data-avatar]');
                if (!target) return;

                // Tab
                if (target.hasAttribute('data-tab')) {
                    e.preventDefault();
                    setTab(target.getAttribute('data-tab'));
                    return;
                }

                // Add steps
                if (target.hasAttribute('data-add')) {
                    e.preventDefault();
                    const n = parseInt(target.getAttribute('data-add'), 10);
                    addSteps(n);
                    return;
                }

                // Challenge
                if (target.hasAttribute('data-start-challenge')) {
                    e.preventDefault();
                    startChallenge();
                    return;
                }
                if (target.hasAttribute('data-challenge-click')) {
                    e.preventDefault();
                    challengeClick();
                    return;
                }

                // Select
                if (target.hasAttribute('data-select')) {
                    e.preventDefault();
                    const id = target.getAttribute('data-select');
                    if (state.unlocked.includes(id)) {
                        setSelectedItem(id);
                    }
                    return;
                }

                // Modal
                if (target.hasAttribute('data-close-modal')) {
                    e.preventDefault();
                    closeModal();
                    return;
                }
                if (target.hasAttribute('data-confirm-adult')) {
                    e.preventDefault();
                    const id = target.getAttribute('data-confirm-adult');
                    confirmAdult(id);
                    return;
                }

                // Raid
                if (target.hasAttribute('data-start-raid')) {
                    e.preventDefault();
                    startRaid();
                    return;
                }
                if (target.hasAttribute('data-puzzle')) {
                    e.preventDefault();
                    const idx = parseInt(target.getAttribute('data-puzzle'), 10);
                    answerPuzzle(idx);
                    return;
                }

                // Shop
                if (target.hasAttribute('data-buy-item')) {
                    e.preventDefault();
                    const id = target.getAttribute('data-buy-item');
                    const item = SHOP_ITEMS.find(i => i.id === id);
                    if (item) buyItem(item);
                    return;
                }
                if (target.hasAttribute('data-buy-pack')) {
                    e.preventDefault();
                    const id = target.getAttribute('data-buy-pack');
                    const pack = CRYSTAL_PACKS.find(p => p.id === id);
                    if (pack) buyPack(pack);
                    return;
                }

                // Clan
                if (target.hasAttribute('data-upgrade-clan')) {
                    e.preventDefault();
                    upgradeClan();
                    return;
                }

                // Toggle
                if (target.hasAttribute('data-toggle')) {
                    e.preventDefault();
                    const id = target.getAttribute('data-toggle');
                    toggleNotif(id);
                    return;
                }

                // Ad
                if (target.hasAttribute('data-close-ad')) {
                    e.preventDefault();
                    closeAd();
                    return;
                }

                // Portfolio sub
                if (target.hasAttribute('data-psub')) {
                    e.preventDefault();
                    const sub = target.getAttribute('data-psub');
                    state._portfolioSub = sub;
                    scheduleUpdate();
                    return;
                }

                // Reset
                if (target.hasAttribute('data-reset')) {
                    e.preventDefault();
                    resetProgress();
                    return;
                }

                // Avatar
                if (target.hasAttribute('data-avatar')) {
                    e.preventDefault();
                    const [part, value] = target.getAttribute('data-avatar').split('|');
                    setAvatarPart(part, value);
                    return;
                }
            });
        }

        // ============================================================
        //  BOOT
        // ============================================================

        window.addEventListener('load', function() {
            setTimeout(function() {
                document.getElementById('loading-screen').classList.add('hidden');
            }, 1000);
        });

        loadState();
        state.prevLevel = getLevelInfo().level;
        scheduleUpdate();
        setupEventDelegation();

        console.log('Протокол Пустошь загружен.');
    </script>
</body>
</html>
