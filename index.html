<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>МЕТРО ЭФИР — Рация & Связь</title>
    <!-- MQTT.js -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Атмосферный шрифт в стиле STALKER -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Special+Elite&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #050709;
            --panel-bg: rgba(15, 18, 22, 0.85);
            --panel-border: rgba(255, 153, 0, 0.35);
            --accent-gold: #ff9900;
            --accent-gold-glow: rgba(255, 153, 0, 0.6);
            --accent-green: #00ff66;
            --accent-red: #ff3333;
            --nixie-orange: #ff5500;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --radius: 8px;
            --stalker-font: 'Share Tech Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--stalker-font);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            height: -webkit-fill-available;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Эффект старого монитора (Scanlines) */
        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 999;
            background-size: 100% 3px, 6px 100%;
            pointer-events: none;
            opacity: 0.7;
        }

        /* Главная оболочка приложений */
        .screen {
            display: none;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            height: -webkit-fill-available;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            flex-direction: column;
            position: relative;
            z-index: 10;
            box-shadow: 0 0 50px rgba(0,0,0,0.9), inset 0 0 2px rgba(255,255,255,0.1);
            border-left: 1px solid rgba(255,153,0,0.15);
            border-right: 1px solid rgba(255,153,0,0.15);
            overflow: hidden;
            padding-bottom: env(safe-area-inset-bottom); /* Фикс под iPhone */
        }

        .screen.active { display: flex; }

        /* ================= 1. 3D ЭКРАН ЗАГРУЗКИ ================= */
        #screen-loading {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 100;
            background: #000;
            justify-content: center;
            align-items: center;
        }

        #webgl-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        .glass-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none;
            background: 
                radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 30%, rgba(0,0,0,0.9) 100%),
                repeating-linear-gradient(45deg, rgba(255,255,255,0.01) 0px, rgba(255,255,255,0.01) 2px, transparent 2px, transparent 4px);
        }

        .glass-grime {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 3;
            pointer-events: none;
            opacity: 0.6;
            background-image: radial-gradient(rgba(255,153,0,0.1) 1px, transparent 0);
            background-size: 20px 20px;
        }

        .loading-ui {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 25px 35px;
            background: rgba(8, 10, 12, 0.9);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius);
            box-shadow: 0 0 35px rgba(0,0,0,0.9), 0 0 15px var(--accent-gold-glow);
            backdrop-filter: blur(8px);
            max-width: 85%;
        }

        .stalker-title {
            font-family: 'Special Elite', cursive, var(--stalker-font);
            color: var(--accent-gold);
            font-size: 26px;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 12px var(--accent-gold);
            margin-bottom: 8px;
        }

        .progress-bar-wrap {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            margin: 15px 0 10px 0;
            overflow: hidden;
            border: 1px solid var(--panel-border);
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff6600, #ffaa00);
            box-shadow: 0 0 12px var(--accent-gold);
            transition: width 0.1s linear;
        }

        #loading-status {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 2px;
        }

        /* ================= 2. ЭКРАН ВХОДА ================= */
        #screen-login {
            justify-content: center;
            padding: 20px;
            background: radial-gradient(circle at center, #151921 0%, #050709 100%);
        }

        .login-card {
            background: rgba(12, 15, 19, 0.9);
            border: 1px solid var(--panel-border);
            padding: 25px;
            border-radius: var(--radius);
            box-shadow: 0 10px 30px rgba(0,0,0,0.9), 0 0 15px rgba(255,153,0,0.1);
        }

        .form-group { margin-bottom: 18px; }

        .form-group label {
            display: block;
            font-size: 11px;
            color: var(--accent-gold);
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 1.5px;
        }

        .metro-input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(5, 7, 9, 0.9);
            border: 1px solid var(--panel-border);
            color: var(--accent-gold);
            border-radius: var(--radius);
            font-size: 15px;
            outline: none;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
            transition: all 0.3s;
        }

        .metro-input:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 10px var(--accent-gold-glow), inset 0 2px 4px rgba(0,0,0,0.8);
        }

        /* КНОПКИ С ПОДСВЕТКОЙ */
        .btn-glow {
            position: relative;
            background: linear-gradient(180deg, #ffaa00 0%, #cc6600 100%);
            border: 1px solid #ffbb33;
            color: #000;
            font-weight: 900;
            letter-spacing: 2px;
            border-radius: var(--radius);
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(255, 153, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.4);
            transition: all 0.15s ease-in-out;
            overflow: hidden;
        }

        .btn-glow:hover {
            box-shadow: 0 0 25px rgba(255, 153, 0, 0.8), inset 0 1px 0 rgba(255,255,255,0.6);
            transform: translateY(-1px);
        }

        .btn-glow:active {
            transform: translateY(2px) scale(0.98);
            box-shadow: 0 0 10px rgba(255, 153, 0, 0.3);
        }

        /* ================= 3. ЧАТ И ГАЗОРАЗРЯДНЫЕ ЛАМПЫ ================= */
        .chat-header {
            padding: 10px 15px;
            background: rgba(10, 13, 16, 0.95);
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            gap: 10px;
        }

        .header-info h2 {
            font-family: 'Special Elite', cursive, var(--stalker-font);
            font-size: 15px;
            color: var(--accent-gold);
            letter-spacing: 1px;
            text-shadow: 0 0 8px var(--accent-gold-glow);
        }

        .header-info span {
            font-size: 10px;
            color: var(--text-muted);
        }

        /* 3D ГАЗОРАЗРЯДНЫЕ ЛАМПЫ (NIXIE TUBES) */
        .nixie-container {
            display: flex;
            align-items: center;
            gap: 3px;
            background: rgba(0, 0, 0, 0.8);
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid rgba(255, 85, 0, 0.4);
            box-shadow: inset 0 0 8px rgba(0,0,0,0.9), 0 0 10px rgba(255, 85, 0, 0.2);
        }

        .nixie-tube {
            position: relative;
            width: 16px;
            height: 26px;
            background: linear-gradient(180deg, rgba(255,255,255,0.1) 0%, rgba(0,0,0,0.5) 100%);
            border-radius: 3px;
            border: 1px solid rgba(255,255,255,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Share Tech Mono', monospace;
            font-size: 16px;
            font-weight: bold;
            color: var(--nixie-orange);
            text-shadow: 0 0 6px var(--nixie-orange), 0 0 12px #ff2200;
            box-shadow: inset 0 0 4px rgba(255, 85, 0, 0.5);
        }

        .nixie-tube::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.2) 0px, rgba(0,0,0,0.2) 1px, transparent 1px, transparent 2px);
            pointer-events: none;
        }

        .nixie-dots {
            color: var(--nixie-orange);
            font-size: 14px;
            animation: nixieBlink 1s infinite;
            text-shadow: 0 0 5px var(--nixie-orange);
        }

        @keyframes nixieBlink { 50% { opacity: 0.2; } }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 9px;
            color: var(--accent-green);
            background: rgba(0, 255, 102, 0.1);
            padding: 3px 6px;
            border-radius: 4px;
            border: 1px solid rgba(0, 255, 102, 0.3);
        }

        .status-dot {
            width: 5px; height: 5px;
            background: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--accent-green);
        }

        /* ЧАТ ЧАСТИЦЫ И СООБЩЕНИЯ */
        #dust-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.3;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
            z-index: 5;
        }

        .msg {
            max-width: 85%;
            display: flex;
            flex-direction: column;
            gap: 2px;
            animation: msgSlide 0.25s ease-out forwards;
        }

        @keyframes msgSlide { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .msg.self { align-self: flex-end; }
        .msg.other { align-self: flex-start; }

        .msg.system {
            align-self: center;
            font-size: 10px;
            color: var(--accent-gold);
            background: rgba(255, 153, 0, 0.08);
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 153, 0, 0.2);
        }

        .msg-meta {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            font-size: 9px;
            color: var(--text-muted);
        }

        .msg-text {
            background: rgba(20, 25, 32, 0.9);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.3;
            border: 1px solid rgba(255, 255, 255, 0.08);
            word-break: break-word;
        }

        .msg.self .msg-text {
            background: rgba(45, 30, 10, 0.9);
            border-color: rgba(255, 153, 0, 0.3);
        }

        .msg-media img, .msg-media video {
            max-width: 100%;
            max-height: 200px;
            border-radius: 6px;
            border: 1px solid var(--panel-border);
            margin-top: 4px;
        }

        /* АДАПТИВНАЯ НИЖНЯЯ ПАНЕЛЬ С КНОПКАМИ ПОД IPHONE */
        .ptt-container {
            padding: 8px 15px;
            background: rgba(10, 13, 16, 0.95);
            border-top: 1px solid var(--panel-border);
            z-index: 20;
        }

        .ptt-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(180deg, #252d38 0%, #12161c 100%);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            font-weight: bold;
            font-size: 12px;
            border-radius: var(--radius);
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 153, 0, 0.2);
            transition: all 0.1s;
            letter-spacing: 1.5px;
        }

        .ptt-btn:active, .ptt-btn.transmitting {
            background: linear-gradient(180deg, #e62e2e 0%, #801414 100%);
            border-color: var(--accent-red);
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 51, 51, 0.8);
            transform: scale(0.98);
        }

        .input-panel {
            padding: 8px 15px 12px 15px;
            background: rgba(10, 13, 16, 0.95);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 20;
        }

        .action-btn {
            background: rgba(20, 25, 32, 0.9);
            border: 1px solid var(--panel-border);
            color: var(--accent-gold);
            width: 38px;
            height: 38px;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            flex-shrink: 0;
            box-shadow: 0 0 8px rgba(0,0,0,0.5);
            transition: all 0.15s ease-in-out;
        }

        .action-btn:active {
            transform: scale(0.9);
            box-shadow: 0 0 12px var(--accent-gold-glow);
        }

        .action-btn.recording {
            background: var(--accent-red);
            color: #fff;
            animation: pulseRec 1s infinite alternate;
        }

        @keyframes pulseRec { from { opacity: 0.7; } to { opacity: 1; } }

        .chat-input {
            flex: 1;
            padding: 10px 12px;
            background: rgba(5, 7, 9, 0.9);
            border: 1px solid var(--panel-border);
            color: #fff;
            border-radius: var(--radius);
            font-size: 13px;
            outline: none;
        }

        .chat-input:focus { border-color: var(--accent-gold); }

        .ptt-banner {
            display: none;
            background: rgba(255, 51, 51, 0.2);
            border-bottom: 1px solid var(--accent-red);
            color: #ff8888;
            padding: 6px 15px;
            font-size: 11px;
            align-items: center;
            gap: 8px;
        }
        .ptt-banner.active { display: flex; }

        .toast {
            position: absolute;
            top: 20px; left: 50%;
            transform: translateX(-50%);
            background: var(--accent-gold);
            color: #000;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            display: none;
            z-index: 200;
            box-shadow: 0 0 15px var(--accent-gold);
        }
    </style>
</head>
<body>

    <div id="toast" class="toast">ССЫЛКА В БУФЕРЕ ОБМЕНА</div>

    <!-- 1. 3D ЭКРАН ЗАГРУЗКИ ПОЕЗДА (3-4 СЕКУНДЫ) -->
    <div id="screen-loading" class="screen active">
        <canvas id="webgl-canvas"></canvas>
        <div class="glass-overlay"></div>
        <div class="glass-grime"></div>

        <div class="loading-ui">
            <div class="stalker-title">МЕТРО ЭФИР</div>
            <div class="progress-bar-wrap">
                <div id="progress-fill" class="progress-bar-fill"></div>
            </div>
            <div id="loading-status">ПОДКЛЮЧЕНИЕ К СЕТИ...</div>
        </div>
    </div>

    <!-- 2. ЭКРАН ВХОДА -->
    <div id="screen-login" class="screen">
        <div class="login-card">
            <div class="stalker-title" style="text-align:center; font-size:22px;">ВХОД В ЭФИР</div>
            
            <div class="form-group" style="margin-top:15px;">
                <label>Позывной (Имя)</label>
                <input type="text" id="username-input" class="metro-input" placeholder="Хантер" maxlength="16">
            </div>

            <div class="form-group">
                <label>Частота (Комната)</label>
                <input type="text" id="room-input" class="metro-input" placeholder="metro-77" maxlength="20">
            </div>

            <button class="btn-glow" style="width:100%; padding:14px; margin-top:10px;" onclick="startSession()">ПОДКЛЮЧИТЬСЯ</button>
        </div>
    </div>

    <!-- 3. ОСНОВНОЙ ЧАТ -->
    <div id="screen-chat" class="screen">
        <canvas id="dust-canvas"></canvas>

        <!-- Шапка с Газоразрядными лампами по центру -->
        <div class="chat-header">
            <div class="header-info">
                <h2 id="display-room">#канал</h2>
                <span><strong id="display-user">...</strong></span>
            </div>

            <!-- ГАЗОРАЗРЯДНЫЕ ЛАМПЫ (ТАЙМЕР ЖИЗНИ КОМНАТЫ) -->
            <div class="nixie-container" title="Время жизни частоты">
                <div id="nixie-h1" class="nixie-tube">0</div>
                <div id="nixie-h2" class="nixie-tube">2</div>
                <div class="nixie-dots">:</div>
                <div id="nixie-m1" class="nixie-tube">4</div>
                <div id="nixie-m2" class="nixie-tube">5</div>
            </div>

            <div style="display: flex; gap: 6px; align-items: center;">
                <button class="action-btn" onclick="copyInviteLink()" title="Ссылка" style="width:30px; height:30px; font-size:12px;">🔗</button>
                <div id="conn-status" class="status-badge">
                    <div class="status-dot"></div>
                </div>
            </div>
        </div>

        <div id="ptt-banner" class="ptt-banner">
            <span>📻 ПРИЕМ:</span>
            <span id="ptt-speaker-name" style="font-weight:bold;">...</span>
        </div>

        <!-- Сообщения -->
        <div id="chat-messages" class="chat-messages"></div>

        <!-- Рация PTT -->
        <div class="ptt-container">
            <button id="ptt-button" class="ptt-btn">🎙️ ЗАЖМИ И ГОВОРИ (РАЦИЯ)</button>
        </div>

        <!-- Нижня панель (Адаптировано под iPhone) -->
        <div class="input-panel">
            <input type="file" id="file-input" accept="image/*,video/*" style="display:none;" onchange="handleFileSelect(event)">
            <button class="action-btn" onclick="document.getElementById('file-input').click()">📷</button>
            <button id="rec-btn" class="action-btn" onclick="toggleVoiceRecord()">🎤</button>
            <input type="text" id="chat-message-input" class="chat-input" placeholder="Сообщение..." onkeypress="handleKeyPress(event)">
            <button class="action-btn btn-glow" onclick="sendTextMessage()" style="color:#000;">➤</button>
        </div>
    </div>

    <script>
        /* ================= 1. ЗВУКОВОЙ ДВИЖОК ================= */
        class MetroSoundEngine {
            constructor() { this.ctx = null; }
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (this.ctx.state === 'suspended') this.ctx.resume();
            }

            playTrainStartup() {
                this.init();
                const now = this.ctx.currentTime;
                // Низкий гул тоннеля
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(60, now);
                osc.frequency.linearRampToValueAtTime(40, now + 3.5);
                
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 3.5);

                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(now); osc.stop(now + 3.5);
            }

            playClick() {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.05);
            }

            playPTTStart() {
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.setValueAtTime(1200, now + 0.04);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(now); osc.stop(now + 0.08);
            }

            playPTTEnd() {
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.setValueAtTime(200, now + 0.06);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(now); osc.stop(now + 0.1);
            }

            playMessageIncoming() {
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.setValueAtTime(800, now + 0.06);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(now); osc.stop(now + 0.15);
            }
        }

        const audioEngine = new MetroSoundEngine();

        /* ================= 2. 3D ТОННЕЛЬ (THREE.JS) АДАПТИВНЫЙ ================= */
        let scene, camera, renderer, tunnelMesh;

        function init3DTunnel() {
            const canvas = document.getElementById('webgl-canvas');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050709, 0.04);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // Каркас тоннеля Сталкер/Метро
            const tunnelGeo = new THREE.CylinderGeometry(5, 5, 200, 12, 60, true);
            const tunnelMat = new THREE.MeshBasicMaterial({ color: 0xff9900, wireframe: true, transparent: true, opacity: 0.15 });
            tunnelMesh = new THREE.Mesh(tunnelGeo, tunnelMat);
            tunnelMesh.rotation.x = Math.PI / 2;
            scene.add(tunnelMesh);

            animate3DTunnel();
        }

        function animate3DTunnel() {
            requestAnimationFrame(animate3DTunnel);
            if (tunnelMesh) {
                tunnelMesh.position.z += 1.8;
                if (tunnelMesh.position.z > 30) tunnelMesh.position.z = 0;
            }
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });

        /* ================= 3. ГАЗОРАЗРЯДНЫЕ ЛАМПЫ (ТАЙМЕР ЖИЗНИ КОМНАТЫ) ================= */
        let roomLifeSeconds = 7200; // 2 часа жизни комнаты

        function startNixieTimer() {
            setInterval(() => {
                if (roomLifeSeconds > 0) roomLifeSeconds--;
                const h = Math.floor(roomLifeSeconds / 3600);
                const m = Math.floor((roomLifeSeconds % 3600) / 60);

                const hStr = String(h).padStart(2, '0');
                const mStr = String(m).padStart(2, '0');

                document.getElementById('nixie-h1').innerText = hStr[0];
                document.getElementById('nixie-h2').innerText = hStr[1];
                document.getElementById('nixie-m1').innerText = mStr[0];
                document.getElementById('nixie-m2').innerText = mStr[1];
            }, 1000);
        }

        /* ================= 4. ЧАСТИЦЫ ПЫЛИ ================= */
        function initDustParticles() {
            const canvas = document.getElementById('dust-canvas');
            const ctx = canvas.getContext('2d');
            let width = canvas.width = canvas.offsetWidth;
            let height = canvas.height = canvas.offsetHeight;

            const particles = Array.from({ length: 30 }, () => ({
                x: Math.random() * width, y: Math.random() * height,
                r: Math.random() * 1.2 + 0.5, dx: (Math.random() - 0.5) * 0.2, dy: Math.random() * 0.3 + 0.1
            }));

            function render() {
                ctx.clearRect(0, 0, width, height);
                particles.forEach(p => {
                    p.x += p.dx; p.y += p.dy;
                    if (p.y > height) p.y = 0;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 153, 0, 0.4)'; ctx.fill();
                });
                requestAnimationFrame(render);
            }
            render();
        }

        /* ================= 5. MQTT БРОКЕРЫ И ЛОГИКА ================= */
        const BROKERS = [
            'wss://broker.emqx.io:8084/mqtt',
            'wss://broker.hivemq.com:8884/mqtt',
            'wss://mqtt.eclipseprojects.io:443/mqtt'
        ];
        let currentBrokerIdx = 0;
        let mqttClient = null;

        let myUserId = localStorage.getItem('metro_uid') || 'u_' + Math.random().toString(36).substr(2, 7);
        localStorage.setItem('metro_uid', myUserId);

        let myUsername = localStorage.getItem('metro_uname') || '';
        let rawRoom = new URLSearchParams(window.location.search).get('room') || localStorage.getItem('metro_room') || '';

        function cleanRoomName(str) {
            if (!str) return '';
            try { str = decodeURIComponent(str); } catch(e){}
            return str.toLowerCase().replace(/[^a-z0-9_-]/g, '');
        }

        let currentRoom = cleanRoomName(rawRoom);
        let isVoiceRecording = false, voiceRecorder = null, voiceChunks = [];
        let isPTTTransmitting = false, pttStreamId = null, pttAudioCtx = null, pttMicStream = null, pttProcessor = null, rxAudioCtx = null, nextStartTime = 0;

        window.onload = () => {
            init3DTunnel();
            setupPTTEvents();
            audioEngine.playTrainStartup();

            // Точно 3.5 секунды анимации загрузки
            let progress = 0;
            const fill = document.getElementById('progress-fill');
            const interval = setInterval(() => {
                progress += 2.8;
                fill.style.width = Math.min(progress, 100) + '%';
                if (progress >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        document.getElementById('screen-loading').style.display = 'none';
                        document.getElementById('screen-login').classList.add('active');

                        if (myUsername) document.getElementById('username-input').value = myUsername;
                        if (!currentRoom) currentRoom = 'metro-' + Math.random().toString(36).substr(2, 5);
                        document.getElementById('room-input').value = currentRoom;

                        if (myUsername && new URLSearchParams(window.location.search).get('room')) {
                            startSession();
                        }
                    }, 200);
                }
            }, 100);
        };

        function startSession() {
            audioEngine.playClick();
            const unameInput = document.getElementById('username-input').value.trim();
            const roomInput = cleanRoomName(document.getElementById('room-input').value.trim());

            if (!unameInput || !roomInput) return alert("Введите позывной и комнату!");

            myUsername = unameInput;
            currentRoom = roomInput;

            localStorage.setItem('metro_uname', myUsername);
            localStorage.setItem('metro_room', currentRoom);

            window.history.replaceState({}, '', `?room=${encodeURIComponent(currentRoom)}`);

            document.getElementById('screen-login').classList.remove('active');
            document.getElementById('screen-loading').style.display = 'flex';

            connectMQTT();
        }

        function connectMQTT() {
            const clientId = 'metro_' + myUserId + '_' + Math.random().toString(36).substr(2, 4);
            const targetBroker = BROKERS[currentBrokerIdx];

            document.getElementById('loading-status').innerText = `ПОДКЛЮЧЕНИЕ СЕТИ...`;

            try {
                if (mqttClient) mqttClient.end(true);
                mqttClient = mqtt.connect(targetBroker, { clientId: clientId, keepalive: 30, reconnectPeriod: 0, connectTimeout: 4000 });

                mqttClient.on('connect', () => {
                    const topic = `metro/channel/v6/${currentRoom}`;
                    mqttClient.subscribe(topic, { qos: 1 }, (err) => {
                        if (!err) {
                            showChatScreen();
                            publishPayload({ type: 'system', content: `Сталкер [${myUsername}] вышел на связь.` });
                        }
                    });
                });

                mqttClient.on('message', (topic, message) => {
                    try {
                        const payload = JSON.parse(message.toString());
                        if (payload.type.startsWith('ptt_')) handlePTTIncoming(payload);
                        else renderIncomingMessage(payload);
                    } catch(e){}
                });

                mqttClient.on('error', () => switchBroker());
            } catch(e) { switchBroker(); }
        }

        function switchBroker() {
            currentBrokerIdx = (currentBrokerIdx + 1) % BROKERS.length;
            setTimeout(connectMQTT, 1000);
        }

        function showChatScreen() {
            document.getElementById('screen-loading').style.display = 'none';
            document.getElementById('screen-chat').classList.add('active');
            document.getElementById('display-user').innerText = myUsername;
            document.getElementById('display-room').innerText = '#' + currentRoom;
            initDustParticles();
            startNixieTimer();
        }

        /* ================= 6. РАЦИЯ PTT ================= */
        function setupPTTEvents() {
            const btn = document.getElementById('ptt-button');
            btn.addEventListener('mousedown', startPTT);
            btn.addEventListener('mouseup', stopPTT);
            btn.addEventListener('mouseleave', stopPTT);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); startPTT(); }, { passive: false });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); stopPTT(); }, { passive: false });
        }

        async function startPTT() {
            if (isPTTTransmitting) return;
            audioEngine.playPTTStart();

            try {
                pttMicStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                isPTTTransmitting = true;
                pttStreamId = 'stream_' + Date.now();

                const btn = document.getElementById('ptt-button');
                btn.classList.add('transmitting');
                btn.innerText = '🔴 ПЕРЕДАЧА В ЭФИР...';

                pttAudioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                const source = pttAudioCtx.createMediaStreamSource(pttMicStream);
                pttProcessor = pttAudioCtx.createScriptProcessor(2048, 1, 1);

                publishPayload({ type: 'ptt_start', streamId: pttStreamId });

                pttProcessor.onaudioprocess = (e) => {
                    if (!isPTTTransmitting) return;
                    const inputData = e.inputBuffer.getChannelData(0);
                    const pttInt16 = new Int16Array(inputData.length);
                    for (let i = 0; i < inputData.length; i++) {
                        let s = Math.max(-1, Math.min(1, inputData[i]));
                        pttInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                    }
                    let binary = '';
                    const bytes = new Uint8Array(pttInt16.buffer);
                    for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
                    publishPayload({ type: 'ptt_chunk', streamId: pttStreamId, chunk: btoa(binary) });
                };

                source.connect(pttProcessor);
                pttProcessor.connect(pttAudioCtx.destination);
            } catch (err) { alert("Микрофон недоступен!"); isPTTTransmitting = false; }
        }

        function stopPTT() {
            if (!isPTTTransmitting) return;
            isPTTTransmitting = false;

            const btn = document.getElementById('ptt-button');
            btn.classList.remove('transmitting');
            btn.innerText = '🎙️ ЗАЖМИ И ГОВОРИ (РАЦИЯ)';
            audioEngine.playPTTEnd();

            if (pttProcessor) { pttProcessor.disconnect(); pttProcessor = null; }
            if (pttAudioCtx) { pttAudioCtx.close(); pttAudioCtx = null; }
            if (pttMicStream) { pttMicStream.getTracks().forEach(t => t.stop()); pttMicStream = null; }

            publishPayload({ type: 'ptt_end', streamId: pttStreamId });
        }

        function handlePTTIncoming(data) {
            if (data.uid === myUserId) return;
            const banner = document.getElementById('ptt-banner');
            const speakerTag = document.getElementById('ptt-speaker-name');

            if (data.type === 'ptt_start') {
                speakerTag.innerText = data.sender;
                banner.classList.add('active');
                audioEngine.playPTTStart();
                if (!rxAudioCtx) rxAudioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                if (rxAudioCtx.state === 'suspended') rxAudioCtx.resume();
                nextStartTime = rxAudioCtx.currentTime;
            } else if (data.type === 'ptt_chunk') {
                if (!rxAudioCtx) return;
                const binary = atob(data.chunk);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                const int16 = new Int16Array(bytes.buffer);
                const float32 = new Float32Array(int16.length);
                for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / (int16[i] < 0 ? 0x8000 : 0x7FFF);

                const audioBuffer = rxAudioCtx.createBuffer(1, float32.length, 16000);
                audioBuffer.getChannelData(0).set(float32);
                const source = rxAudioCtx.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(rxAudioCtx.destination);
                if (nextStartTime < rxAudioCtx.currentTime) nextStartTime = rxAudioCtx.currentTime;
                source.start(nextStartTime);
                nextStartTime += audioBuffer.duration;
            } else if (data.type === 'ptt_end') {
                setTimeout(() => { banner.classList.remove('active'); audioEngine.playPTTEnd(); }, 200);
            }
        }

        /* ================= 7. СООБЩЕНИЯ И ФАЙЛЫ ================= */
        function publishPayload(data) {
            if (!mqttClient || !mqttClient.connected) return;
            const fullPayload = {
                id: 'm_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                uid: myUserId,
                sender: myUsername,
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                ...data
            };
            mqttClient.publish(`metro/channel/v6/${currentRoom}`, JSON.stringify(fullPayload), { qos: 1 });
        }

        function handleKeyPress(e) { if (e.key === 'Enter') sendTextMessage(); }

        function sendTextMessage() {
            audioEngine.playClick();
            const input = document.getElementById('chat-message-input');
            const text = input.value.trim();
            if (!text) return;
            publishPayload({ type: 'text', content: text });
            input.value = '';
        }

        async function toggleVoiceRecord() {
            audioEngine.playClick();
            const btn = document.getElementById('rec-btn');
            if (!isVoiceRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    voiceRecorder = new MediaRecorder(stream);
                    voiceChunks = [];
                    voiceRecorder.ondataavailable = e => { if (e.data.size > 0) voiceChunks.push(e.data); };
                    voiceRecorder.onstop = () => {
                        const audioBlob = new Blob(voiceChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onloadend = () => publishPayload({ type: 'audio', content: reader.result });
                        reader.readAsDataURL(audioBlob);
                        stream.getTracks().forEach(track => track.stop());
                    };
                    voiceRecorder.start();
                    isVoiceRecording = true;
                    btn.classList.add('recording');
                } catch(e) { alert("Ошибка записи"); }
            } else {
                isVoiceRecording = false;
                btn.classList.remove('recording');
                if (voiceRecorder) voiceRecorder.stop();
            }
        }

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => publishPayload({ type: file.type.startsWith('image/') ? 'image' : 'video', content: evt.target.result });
            reader.readAsDataURL(file);
            e.target.value = '';
        }

        const renderedMsgs = new Set();
        function renderIncomingMessage(data) {
            if (data.id && renderedMsgs.has(data.id)) return;
            if (data.id) renderedMsgs.add(data.id);

            const box = document.getElementById('chat-messages');

            if (data.type === 'system') {
                const sysDiv = document.createElement('div');
                sysDiv.className = 'msg system';
                sysDiv.innerText = data.content;
                box.appendChild(sysDiv);
                box.scrollTop = box.scrollHeight;
                return;
            }

            const isSelf = data.uid === myUserId;
            if (!isSelf) audioEngine.playMessageIncoming();

            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${isSelf ? 'self' : 'other'}`;

            let contentHTML = '';
            if (data.type === 'text') contentHTML = `<div class="msg-text">${escapeHTML(data.content)}</div>`;
            else if (data.type === 'image') contentHTML = `<div class="msg-media"><img src="${data.content}"></div>`;
            else if (data.type === 'video') contentHTML = `<div class="msg-media"><video src="${data.content}" controls></video></div>`;
            else if (data.type === 'audio') contentHTML = `<audio src="${data.content}" controls style="max-width:200px;"></audio>`;

            msgDiv.innerHTML = `
                <div class="msg-meta">
                    <span>${escapeHTML(data.sender)}</span>
                    <span>${data.timestamp}</span>
                </div>
                ${contentHTML}
            `;

            box.appendChild(msgDiv);
            box.scrollTop = box.scrollHeight;
        }

        function copyInviteLink() {
            audioEngine.playClick();
            navigator.clipboard.writeText(window.location.href);
            const toast = document.getElementById('toast');
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 2000);
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }
    </script>
</body>
</html>
