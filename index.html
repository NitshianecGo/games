<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Anime ICQ Messenger 💕</title>
    
    <link rel="shortcut icon" href="data:image/x-icon;," type="image/x-icon">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <!-- Скрипт Tenor Embed для интерактивных гифок -->
    <script async src="https://tenor.com/embed.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&display=swap');

        :root {
            --anime-pink-bg: #fff0f5;
            --anime-main: #ff85a2;
            --anime-secondary: #ffb3c6;
            --anime-accent: #a3c4f3;
            --anime-purple: #c8b6ff;
            --anime-card: #ffffff;
            --text-dark: #5c3d46;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comfortaa', 'Segoe UI', cursive, sans-serif;
            font-size: 11px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            height: 100dvh;
            background: linear-gradient(135deg, #fde2e4 0%, #c8b6ff 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .icq-app {
            width: 100%;
            max-width: 480px;
            height: 100%;
            height: 100dvh;
            background: var(--anime-pink-bg);
            border: 3px solid #ffb3c6;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 15px 35px rgba(255, 133, 162, 0.3);
            position: relative;
            overflow: hidden;
        }

        /* 1. ЭКРАН ЗАГРУЗКИ */
        #loading-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #fff0f5;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s;
            padding: 20px;
        }

        .gif-loader-wrapper {
            width: 220px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(255, 133, 162, 0.4);
            border: 3px solid #ffb3c6;
            margin-bottom: 15px;
        }

        .gif-loader-wrapper img {
            width: 100%;
            height: auto;
            display: block;
        }

        .loading-text {
            font-weight: bold;
            color: var(--text-dark);
            font-size: 13px;
            letter-spacing: 1px;
            animation: pulseText 1.5s infinite;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* ЭКРАН ВЫХОДА (Bocchi) */
        #logout-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            z-index: 500;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .logout-gif-card {
            width: 280px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border: 3px solid #ffccd5;
        }

        .logout-gif-card img {
            width: 100%;
            display: block;
        }

        /* 2. ШАПКА ОКНА */
        .window-titlebar {
            background: linear-gradient(90deg, #ff85a2 0%, #ffb3c6 100%);
            padding: 6px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.15);
            font-weight: bold;
            font-size: 12px;
            flex-shrink: 0;
            border-bottom: 2px solid #ffccd5;
        }

        .title-left {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-exit {
            background: linear-gradient(180deg, #ff758f 0%, #ff4d6d 100%);
            border: none;
            color: white;
            font-weight: bold;
            font-size: 10px;
            padding: 3px 10px;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(255, 77, 109, 0.3);
            transition: transform 0.2s;
        }

        .btn-exit:active { transform: scale(0.92); }

        /* 3. ЭКРАН ВХОДА */
        #login-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex: 1;
            padding: 20px;
            background: var(--anime-pink-bg);
        }

        .login-card {
            background: var(--anime-card);
            border: 2px solid #ffccd5;
            border-radius: 16px;
            padding: 25px;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 8px 20px rgba(255, 179, 198, 0.25);
            text-align: center;
        }

        .input-field {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #ffc2d1;
            border-radius: 10px;
            margin-top: 4px;
            margin-bottom: 14px;
            outline: none;
            font-size: 12px;
            color: var(--text-dark);
            background: #fff5f7;
            transition: border-color 0.3s;
        }

        .input-field:focus { border-color: #ff85a2; }

        .btn-green-rounded {
            width: 100%;
            padding: 10px;
            background: linear-gradient(90deg, #ff85a2 0%, #c8b6ff 100%);
            border: none;
            border-radius: 20px;
            color: white;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 133, 162, 0.4);
            transition: transform 0.2s;
        }

        .btn-green-rounded:active { transform: scale(0.96); }

        /* 4. ЧАТ */
        .chat-top-panel {
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .tabs-bar {
            background: #ffe5ec;
            padding: 6px 10px 0 10px;
            display: flex;
            gap: 4px;
        }

        .tab-item {
            background: #ff85a2;
            border-radius: 10px 10px 0 0;
            padding: 5px 14px;
            color: white;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .action-toolbar {
            background: #ffffff;
            padding: 6px 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            border-bottom: 2px solid #ffe5ec;
            overflow-x: auto;
        }

        .tool-btn {
            padding: 4px 10px;
            background: #fff0f5;
            border: 1.5px solid #ffc2d1;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: bold;
            color: var(--text-dark);
            white-space: nowrap;
            transition: all 0.2s;
        }

        .tool-btn:hover { background: #ff85a2; color: white; }

        #chat-screen {
            display: none;
            flex: 1;
            flex-direction: column;
            min-height: 0;
            background: var(--anime-pink-bg);
        }

        #chat-screen.active { display: flex; }

        .chat-main-layout {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        .chat-left-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 8px;
            gap: 8px;
            min-width: 0;
        }

        .chat-right-side {
            width: 105px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            border-left: 2px dashed #ffccd5;
            flex-shrink: 0;
            background: #fff8fa;
        }

        .avatar-box {
            width: 65px;
            height: 65px;
            border: 2px solid #ffb3c6;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(255, 179, 198, 0.4);
        }

        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-info {
            font-size: 10px;
            font-weight: bold;
            color: var(--text-dark);
            text-align: center;
            word-break: break-all;
            max-width: 95px;
        }

        .video-stream-box {
            width: 90px;
            height: 90px;
            border: 2px solid #ff85a2;
            background: #2b2d42;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .video-stream-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-stream-box.fullscreen {
            position: absolute;
            top: 0; left: 0;
            width: 100% !important;
            height: 100% !important;
            z-index: 300;
            border-radius: 0;
            border: none;
        }

        .video-placeholder {
            color: #ffccd5;
            font-size: 9px;
            text-align: center;
            position: absolute;
        }

        .messages-box {
            flex: 1;
            background: #ffffff;
            border: 2px solid #ffccd5;
            border-radius: 12px;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
            animation: fadeInMsg 0.3s ease;
        }

        @keyframes fadeInMsg {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-header-text {
            font-weight: bold;
            color: #ff4d6d;
            font-size: 10px;
        }

        .msg-header-text.self { color: #7209b7; }

        .msg-content {
            font-size: 11px;
            color: var(--text-dark);
            word-break: break-word;
            user-select: text;
            background: #fff0f3;
            padding: 6px 10px;
            border-radius: 10px;
            display: inline-block;
            max-width: 90%;
        }

        .msg-content img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 4px;
        }

        .input-box {
            height: 50px;
            background: #ffffff;
            border: 2px solid #ffccd5;
            border-radius: 10px;
            padding: 8px;
            outline: none;
            resize: none;
            font-size: 11px;
            color: var(--text-dark);
        }

        .input-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn-send-icq {
            padding: 6px 20px;
            background: linear-gradient(90deg, #ff85a2 0%, #ffb3c6 100%);
            border: none;
            border-radius: 12px;
            font-weight: bold;
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(255, 133, 162, 0.4);
        }

        /* ВКЛАДКИ СМАЙЛОВ И ГИФОК */
        .emoticons-container {
            background: #ffffff;
            border: 2px solid #ffccd5;
            border-radius: 10px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .emoji-tabs-bar {
            display: flex;
            gap: 6px;
            border-bottom: 1px solid #ffe5ec;
            padding-bottom: 4px;
        }

        .emoji-tab-btn {
            font-weight: bold;
            font-size: 10px;
            color: var(--text-dark);
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 8px;
            background: #fff0f5;
        }

        .emoji-tab-btn.active {
            background: #ff85a2;
            color: white;
        }

        .emoticons-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            overflow-x: auto;
        }

        .gifs-grid-bar {
            display: none;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 2px;
        }

        .gif-thumb {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
            cursor: pointer;
            border: 1.5px solid #ffb3c6;
            flex-shrink: 0;
            transition: transform 0.2s;
        }

        .gif-thumb:hover { transform: scale(1.1); }

        .emoji-icon {
            font-size: 16px;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.15s;
        }

        .emoji-icon:hover { transform: scale(1.3); }

        /* ДВОЙНАЯ ПАНЕЛЬ РАЦИИ */
        .ptt-bar {
            padding: 8px;
            background: #ffe5ec;
            border-top: 2px solid #ffccd5;
            flex-shrink: 0;
            display: flex;
            gap: 8px;
        }

        .ptt-button {
            flex: 1;
            padding: 8px;
            background: linear-gradient(90deg, #ff85a2 0%, #ffb3c6 100%);
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 3px 8px rgba(255, 133, 162, 0.3);
            transition: transform 0.1s, background 0.2s;
        }

        .ptt-button.active {
            background: linear-gradient(90deg, #ff4d6d 0%, #c77dff 100%);
            animation: pulseActive 1s infinite alternate;
        }

        @keyframes pulseActive {
            0% { transform: scale(1); }
            100% { transform: scale(1.02); }
        }

        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(92, 61, 70, 0.4);
            backdrop-filter: blur(2px);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-card {
            background: #ffffff;
            border: 3px solid #ffb3c6;
            border-radius: 16px;
            padding: 15px;
            width: 100%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 10px 25px rgba(255, 133, 162, 0.3);
        }

        .modal-header {
            font-weight: bold;
            color: var(--text-dark);
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .notes-textarea {
            width: 100%;
            height: 120px;
            border: 2px solid #ffccd5;
            border-radius: 10px;
            padding: 8px;
            outline: none;
            resize: none;
            color: var(--text-dark);
        }

        #camera-video {
            width: 100%;
            height: 180px;
            background: #000;
            border-radius: 10px;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="icq-app">
        <!-- 1. Экран загрузки с гифкой Stelle -->
        <div id="loading-screen">
            <div class="gif-loader-wrapper">
                <img src="https://media.tenor.com/7L4S1z09OAwAAAAC/stelle-hsr-stelle-planacadia.gif" alt="Stelle Loading">
            </div>
            <div class="loading-text">Загрузка ICQ Anime... ✨</div>
        </div>

        <!-- Экран выхода c Bocchi -->
        <div id="logout-screen">
            <div class="logout-gif-card">
                <img src="https://media.tenor.com/b_8fR3-yN08AAAAC/anime-bocchi.gif" alt="Bocchi Logout">
            </div>
            <div style="font-weight:bold; color:var(--text-dark); margin-top:15px; font-size:13px;">Выход из аккаунта...</div>
        </div>

        <!-- Шапка -->
        <div class="window-titlebar">
            <div class="title-left">
                <span id="app-header-title">✨ Anime ICQ ✨</span>
            </div>
            <button id="exit-btn" class="btn-exit" style="display:none;" onclick="logout()">Выйти</button>
        </div>

        <!-- Экран входа -->
        <div id="login-screen">
            <div class="login-card">
                <div style="width:70px; height:70px; border-radius:50%; overflow:hidden; margin:0 auto 12px auto; border:2px solid #ffb3c6;">
                    <img src="https://media.tenor.com/2Xy-6I4M810AAAAC/konata-lucky-star.gif" style="width:100%; height:100%; object-fit:cover;">
                </div>
                <div style="font-weight:bold; color:var(--text-dark); margin-bottom:14px; font-size:14px;">Добро пожаловать!</div>
                
                <div style="text-align:left; font-weight:bold; margin-bottom:2px; color:var(--text-dark);">Твое имя:</div>
                <input type="text" id="username-input" class="input-field" placeholder="Например: Sakura" maxlength="16">

                <div style="text-align:left; font-weight:bold; margin-bottom:2px; color:var(--text-dark);">Комната:</div>
                <input type="text" id="room-input" class="input-field" placeholder="anime-room" maxlength="20">

                <button class="btn-green-rounded" onclick="startSession()">Войти в чат ✨</button>
            </div>
        </div>

        <!-- Чат -->
        <div id="chat-screen">
            <div class="chat-top-panel">
                <div class="tabs-bar">
                    <div class="tab-item">
                        <span>💬</span>
                        <span id="tab-room-name">Комната</span>
                    </div>
                </div>

                <div class="action-toolbar">
                    <div class="tool-btn" onclick="openNotes()">📝 Заметки</div>
                    <div class="tool-btn" onclick="openCamera()">📷 Камера</div>
                    <div class="tool-btn" onclick="document.getElementById('file-input').click()">📁 Файл</div>
                    <input type="file" id="file-input" accept="image/*,video/*" style="display:none;" onchange="handleFileSelect(event)">
                </div>
            </div>

            <div class="chat-main-layout">
                <div class="chat-left-side">
                    <div id="chat-messages" class="messages-box"></div>

                    <textarea id="chat-message-input" class="input-box" placeholder="Напиши что-нибудь милое..." onkeypress="handleKeyPress(event)"></textarea>

                    <div class="input-toolbar">
                        <button class="tool-btn" id="rec-btn" onclick="toggleVoiceRecord()">🎤 Голосовое</button>
                        <button class="btn-send-icq" onclick="sendTextMessage()">Send 💌</button>
                    </div>

                    <!-- Панель со смайликами и гифками -->
                    <div class="emoticons-container">
                        <div class="emoji-tabs-bar">
                            <div class="emoji-tab-btn active" id="tab-btn-emoji" onclick="switchEmojiTab('emoji')">Смайлы</div>
                            <div class="emoji-tab-btn" id="tab-btn-gif" onclick="switchEmojiTab('gif')">GIF</div>
                        </div>

                        <!-- Смайлики -->
                        <div class="emoticons-bar" id="emoticons-bar">
                            <span class="emoji-icon" onclick="insertEmoji('😊')">😊</span>
                            <span class="emoji-icon" onclick="insertEmoji('💖')">💖</span>
                            <span class="emoji-icon" onclick="insertEmoji('🌸')">🌸</span>
                            <span class="emoji-icon" onclick="insertEmoji('✨')">✨</span>
                            <span class="emoji-icon" onclick="insertEmoji('🥺')">🥺</span>
                            <span class="emoji-icon" onclick="insertEmoji('🐱')">🐱</span>
                            <span class="emoji-icon" onclick="insertEmoji('🎀')">🎀</span>
                            <span class="emoji-icon" onclick="insertEmoji('🍡')">🍡</span>
                            <span class="emoji-icon" onclick="insertEmoji('⭐')">⭐</span>
                            <span class="emoji-icon" onclick="insertEmoji('🧸')">🧸</span>
                        </div>

                        <!-- GIF-карусель -->
                        <div class="gifs-grid-bar" id="gifs-grid-bar">
                            <img src="https://media.tenor.com/z1I1W2I1vnoAAAAC/anime-girl.gif" class="gif-thumb" onclick="sendGif('https://media.tenor.com/z1I1W2I1vnoAAAAC/anime-girl.gif')">
                            <img src="https://media.tenor.com/5uPvhEToOkgAAAAC/42.gif" class="gif-thumb" onclick="sendGif('https://media.tenor.com/5uPvhEToOkgAAAAC/42.gif')">
                            <img src="https://media.tenor.com/YI5S2sYF9pUAAAAC/yuyukins.gif" class="gif-thumb" onclick="sendGif('https://media.tenor.com/YI5S2sYF9pUAAAAC/yuyukins.gif')">
                            <img src="https://media.tenor.com/OqD0y-r62h0AAAAC/slow-blink-cute-anime-boy.gif" class="gif-thumb" onclick="sendGif('https://media.tenor.com/OqD0y-r62h0AAAAC/slow-blink-cute-anime-boy.gif')">
                            <img src="https://media.tenor.com/y1vK62O10g4AAAAC/glare-scowl.gif" class="gif-thumb" onclick="sendGif('https://media.tenor.com/y1vK62O10g4AAAAC/glare-scowl.gif')">
                            <img src="https://media.tenor.com/dKxM1-uW8W4AAAAC/chicken-say-what.gif" class="gif-thumb" onclick="sendGif('https://media.tenor.com/dKxM1-uW8W4AAAAC/chicken-say-what.gif')">
                            <img src="https://media.tenor.com/9v_C150Gg0IAAAAC/anime-spy-x-family.gif" class="gif-thumb" onclick="sendGif('https://media.tenor.com/9v_C150Gg0IAAAAC/anime-spy-x-family.gif')">
                        </div>
                    </div>
                </div>

                <div class="chat-right-side">
                    <!-- Аватарка Создателя (Konata) -->
                    <div class="avatar-box" title="Создатель">
                        <img src="https://media.tenor.com/2Xy-6I4M810AAAAC/konata-lucky-star.gif" alt="Konata">
                    </div>
                    <div class="avatar-info" id="creator-name-tag">Создатель</div>

                    <!-- Окно видео рации -->
                    <div class="video-stream-box" id="peer-video-container" onclick="toggleFullscreenVideo()">
                        <div class="video-placeholder" id="video-placeholder">Рация выкл</div>
                        <video id="peer-video-element" autoplay playsinline style="display:none;"></video>
                    </div>

                    <!-- Аватарка Собеседника (Gojo) -->
                    <div class="avatar-box" title="Подключившийся">
                        <img src="https://media.tenor.com/R387a3R0cBgAAAAC/gojo-gojo-annoyed.gif" alt="Gojo">
                    </div>
                    <div class="avatar-info" id="joined-name-tag">Собеседник</div>
                </div>
            </div>

            <!-- ДВОЙНАЯ ПАНЕЛЬ РАЦИИ -->
            <div class="ptt-bar">
                <button id="ptt-button" class="ptt-button" onclick="toggleAudioPTT()">🎙️ РАЦИЯ (ГОЛОС)</button>
                <button id="vptt-button" class="ptt-button" style="background: linear-gradient(90deg, #a3c4f3 0%, #c8b6ff 100%);" onclick="toggleVideoPTT()">📹 ВИДЕО-РАЦИЯ</button>
            </div>
        </div>

        <!-- Модальные окна -->
        <div id="notes-modal" class="modal-overlay">
            <div class="modal-card">
                <div class="modal-header">
                    <span>📝 Заметки чата</span>
                    <button class="tool-btn" onclick="closeNotes()">✕</button>
                </div>
                <textarea id="notes-text" class="notes-textarea" placeholder="Запишите сюда важную информацию..."></textarea>
                <button class="btn-green-rounded" style="padding:6px;" onclick="saveNotes()">Сохранить заметку</button>
            </div>
        </div>

        <div id="camera-modal" class="modal-overlay">
            <div class="modal-card">
                <div class="modal-header">
                    <span>📷 Сделать фото</span>
                    <button class="tool-btn" onclick="closeCamera()">✕</button>
                </div>
                <video id="camera-video" autoplay playsinline></video>
                <div style="display:flex; gap:6px;">
                    <button class="tool-btn" style="flex:1; justify-content:center;" onclick="switchCameraMode()">🔄 Сменить камеру</button>
                    <button class="btn-green-rounded" style="flex:1; padding:6px;" onclick="takePhotoAndSend()">Сделать снимок</button>
                </div>
            </div>
        </div>
    </div>

    <audio id="peer-audio-element" autoplay style="display:none;"></audio>

    <script>
        /* 1. КОНФИГУРАЦИЯ FIREBASE */
        const firebaseConfig = {
            apiKey: "AIzaSyDo3LytnfDm-hAPL2RxTpz3VteGmTcSmAc",
            authDomain: "icqnovpn.firebaseapp.com",
            databaseURL: "https://icqnovpn-default-rtdb.firebaseio.com",
            projectId: "icqnovpn",
            storageBucket: "icqnovpn.firebasestorage.app",
            messagingSenderId: "624335054201",
            appId: "1:624335054201:web:69556400be41283b157ba8"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        /* ГЕНЕРАТОР ЗВУКОВ */
        class AnimeSoundEngine {
            constructor() { this.ctx = null; }
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
            playMsgSound() {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1318.51, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }
            playClickSound() {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }
        }
        const audioEngine = new AnimeSoundEngine();

        let myUserId = localStorage.getItem('icq_uid') || 'u_' + Math.random().toString(36).substr(2, 5);
        localStorage.setItem('icq_uid', myUserId);

        let myUsername = '';
        let currentRoom = '';
        let roomRef = null;
        let signalRef = null;
        let isVoiceRecording = false, voiceRecorder = null, voiceChunks = [];
        
        let cameraStream = null;
        let cameraFacingMode = 'user';

        let isAudioPTTActive = false;
        let isVideoPTTActive = false;
        let peerConnection = null;
        let localStream = null;

        const rtcServers = {
            iceServers: [
                { urls: "stun:stun.l.google.com:19302" },
                { urls: "stun:stun1.l.google.com:19302" }
            ]
        };

        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('loading-screen');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => { loader.style.display = 'none'; }, 800);
                }
            }, 1800);

            const savedUname = localStorage.getItem('icq_uname');
            const savedRoom = localStorage.getItem('icq_room');

            if (savedUname && savedRoom) {
                document.getElementById('username-input').value = savedUname;
                document.getElementById('room-input').value = savedRoom;
                startSession();
            }
        });

        function startSession() {
            audioEngine.playClickSound();
            const uname = document.getElementById('username-input').value.trim();
            const room = document.getElementById('room-input').value.trim();

            if (!uname || !room) return alert("Заполните все поля!");

            myUsername = uname;
            currentRoom = room.toLowerCase().replace(/[^a-z0-9_-]/g, '');

            localStorage.setItem('icq_uname', myUsername);
            localStorage.setItem('icq_room', currentRoom);

            const tabRoomEl = document.getElementById('tab-room-name');
            if (tabRoomEl) tabRoomEl.innerText = currentRoom;

            const headerEl = document.getElementById('app-header-title');
            if (headerEl) headerEl.innerText = `Anime ICQ — #${currentRoom}`;

            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('chat-screen').classList.add('active');
            document.getElementById('exit-btn').style.display = 'block';

            roomRef = database.ref('rooms/' + currentRoom + '/messages');
            signalRef = database.ref('rooms/' + currentRoom + '/signal/' + myUserId);

            roomRef.limitToLast(50).on('child_added', (snapshot) => {
                const val = snapshot.val();
                if (val && val.type) {
                    renderIncomingMessage(val);
                }
            });

            const allSignalsRef = database.ref('rooms/' + currentRoom + '/signal');
            allSignalsRef.on('child_changed', (snapshot) => {
                if (snapshot.key !== myUserId) {
                    handleSignalIncoming(snapshot.val());
                }
            });
            allSignalsRef.on('child_added', (snapshot) => {
                if (snapshot.key !== myUserId) {
                    handleSignalIncoming(snapshot.val());
                }
            });
        }

        /* АНИМИРОВАННЫЙ ВЫХОД С BOCCHI */
        function logout() {
            audioEngine.playClickSound();
            const logoutScreen = document.getElementById('logout-screen');
            logoutScreen.style.display = 'flex';

            setTimeout(() => {
                localStorage.removeItem('icq_uname');
                localStorage.removeItem('icq_room');
                location.reload();
            }, 2200);
        }

        function sendMessagePayload(data) {
            if (!roomRef) return;
            const fullPayload = {
                id: 'm_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                uid: myUserId,
                sender: myUsername,
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                ...data
            };
            roomRef.push(fullPayload);
        }

        function sendTextMessage() {
            audioEngine.playClickSound();
            const input = document.getElementById('chat-message-input');
            const text = input.value.trim();
            if (!text) return;
            sendMessagePayload({ type: 'text', content: text });
            input.value = '';
        }

        function sendGif(url) {
            audioEngine.playClickSound();
            sendMessagePayload({ type: 'image', content: url });
        }

        function switchEmojiTab(type) {
            audioEngine.playClickSound();
            const tabEmoji = document.getElementById('tab-btn-emoji');
            const tabGif = document.getElementById('tab-btn-gif');
            const emojiBar = document.getElementById('emoticons-bar');
            const gifBar = document.getElementById('gifs-grid-bar');

            if (type === 'emoji') {
                tabEmoji.classList.add('active');
                tabGif.classList.remove('active');
                emojiBar.style.display = 'flex';
                gifBar.style.display = 'none';
            } else {
                tabGif.classList.add('active');
                tabEmoji.classList.remove('active');
                emojiBar.style.display = 'none';
                gifBar.style.display = 'flex';
            }
        }

        const renderedMsgs = new Set();
        function renderIncomingMessage(data) {
            if (data.id && renderedMsgs.has(data.id)) return;
            if (data.id) renderedMsgs.add(data.id);

            const box = document.getElementById('chat-messages');
            const isSelf = data.uid === myUserId;

            if (!isSelf) audioEngine.playMsgSound();

            const msgDiv = document.createElement('div');
            msgDiv.className = 'msg-item';

            let contentHTML = '';
            if (data.type === 'text') contentHTML = escapeHTML(data.content);
            else if (data.type === 'image') contentHTML = `<img src="${data.content}">`;
            else if (data.type === 'video') contentHTML = `<video src="${data.content}" controls style="max-width:100%; margin-top:4px;"></video>`;
            else if (data.type === 'audio') contentHTML = `<audio src="${data.content}" controls style="max-width:200px; margin-top:4px;"></audio>`;

            msgDiv.innerHTML = `
                <div class="msg-header-text ${isSelf ? 'self' : ''}">${escapeHTML(data.sender)} (${data.timestamp}):</div>
                <div class="msg-content">${contentHTML}</div>
            `;

            box.appendChild(msgDiv);
            box.scrollTop = box.scrollHeight;
        }

        /* WEBRTC ДВИЖОК */
        function cleanupPeerConnection() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            if (peerConnection) {
                peerConnection.ontrack = null;
                peerConnection.onicecandidate = null;
                peerConnection.close();
                peerConnection = null;
            }
            
            const videoEl = document.getElementById('peer-video-element');
            const placeholder = document.getElementById('video-placeholder');
            if (videoEl) {
                videoEl.style.display = 'none';
                videoEl.srcObject = null;
            }
            if (placeholder) {
                placeholder.style.display = 'block';
                placeholder.innerText = 'Рация выкл';
            }
        }

        function initPeerConnection() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }

            peerConnection = new RTCPeerConnection(rtcServers);

            peerConnection.ontrack = (event) => {
                const videoEl = document.getElementById('peer-video-element');
                const audioEl = document.getElementById('peer-audio-element');
                const placeholder = document.getElementById('video-placeholder');

                if (event.track.kind === 'video') {
                    placeholder.style.display = 'none';
                    videoEl.style.display = 'block';
                    videoEl.srcObject = event.streams[0];
                } else if (event.track.kind === 'audio') {
                    audioEl.srcObject = event.streams[0];
                }
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    signalRef.set({ type: 'candidate', candidate: JSON.stringify(event.candidate) });
                }
            };
        }

        async function handleSignalIncoming(data) {
            if (!data) return;
            
            if (data.type === 'offer') {
                initPeerConnection();
                await peerConnection.setRemoteDescription(new RTCSessionDescription(JSON.parse(data.offer)));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                signalRef.set({ type: 'answer', answer: JSON.stringify(answer) });
            } else if (data.type === 'answer' && peerConnection) {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(JSON.parse(data.answer)));
            } else if (data.type === 'candidate' && peerConnection) {
                try {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(JSON.parse(data.candidate)));
                } catch(e) {}
            } else if (data.type === 'stop') {
                cleanupPeerConnection();
            }
        }

        /* 1. ГОЛОСОВАЯ РАЦИЯ */
        async function toggleAudioPTT() {
            audioEngine.playClickSound();
            const btn = document.getElementById('ptt-button');
            if (!isAudioPTTActive) {
                stopPTTAll();

                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ 
                        audio: { echoCancellation: true, noiseSuppression: true } 
                    });

                    initPeerConnection();
                    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                    const offer = await peerConnection.createOffer();
                    await peerConnection.setLocalDescription(offer);
                    signalRef.set({ type: 'offer', offer: JSON.stringify(offer) });

                    isAudioPTTActive = true;
                    btn.classList.add('active');
                    btn.innerText = '🔴 ВЕЩАНИЕ (АУДИО)';
                } catch(e) { alert("Ошибка микрофона!"); }
            } else {
                stopPTTAll();
            }
        }

        /* 2. ВИДЕО-РАЦИЯ */
        async function toggleVideoPTT() {
            audioEngine.playClickSound();
            const btn = document.getElementById('vptt-button');
            if (!isVideoPTTActive) {
                stopPTTAll();

                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ 
                        video: { width: 160, height: 120, facingMode: 'user' },
                        audio: { echoCancellation: true, noiseSuppression: true } 
                    });

                    initPeerConnection();
                    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                    const offer = await peerConnection.createOffer();
                    await peerConnection.setLocalDescription(offer);
                    signalRef.set({ type: 'offer', offer: JSON.stringify(offer) });

                    isVideoPTTActive = true;
                    btn.classList.add('active');
                    btn.innerText = '🔴 ВЕЩАНИЕ (ВИДЕО)';
                } catch(e) { alert("Ошибка камеры или микрофона!"); }
            } else {
                stopPTTAll();
            }
        }

        function stopPTTAll() {
            cleanupPeerConnection();

            if (signalRef) signalRef.set({ type: 'stop' });

            isAudioPTTActive = false;
            isVideoPTTActive = false;

            const audioBtn = document.getElementById('ptt-button');
            const videoBtn = document.getElementById('vptt-button');

            if (audioBtn) {
                audioBtn.classList.remove('active');
                audioBtn.innerText = '🎙️ РАЦИЯ (ГОЛОС)';
            }
            if (videoBtn) {
                videoBtn.classList.remove('active');
                videoBtn.innerText = '📹 ВИДЕО-РАЦИЯ';
            }
        }

        function toggleFullscreenVideo() {
            audioEngine.playClickSound();
            const container = document.getElementById('peer-video-container');
            container.classList.toggle('fullscreen');
        }

        function insertEmoji(emoji) {
            audioEngine.playClickSound();
            const input = document.getElementById('chat-message-input');
            input.value += emoji;
            input.focus();
        }

        function handleKeyPress(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendTextMessage(); } }

        /* Заметки */
        function openNotes() {
            audioEngine.playClickSound();
            document.getElementById('notes-text').value = localStorage.getItem(`notes_${currentRoom}`) || '';
            document.getElementById('notes-modal').style.display = 'flex';
        }
        function saveNotes() {
            audioEngine.playClickSound();
            localStorage.setItem(`notes_${currentRoom}`, document.getElementById('notes-text').value);
            closeNotes();
        }
        function closeNotes() { document.getElementById('notes-modal').style.display = 'none'; }

        /* Камера */
        async function openCamera() {
            audioEngine.playClickSound();
            try {
                if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
                cameraStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: cameraFacingMode } 
                });
                document.getElementById('camera-video').srcObject = cameraStream;
                document.getElementById('camera-modal').style.display = 'flex';
            } catch(e) { alert("Ошибка доступа к камере!"); }
        }

        function switchCameraMode() {
            audioEngine.playClickSound();
            cameraFacingMode = (cameraFacingMode === 'user') ? 'environment' : 'user';
            openCamera();
        }

        function takePhotoAndSend() {
            audioEngine.playClickSound();
            const videoEl = document.getElementById('camera-video');
            const canvas = document.createElement('canvas');
            canvas.width = videoEl.videoWidth || 640;
            canvas.height = videoEl.videoHeight || 480;
            canvas.getContext('2d').drawImage(videoEl, 0, 0, canvas.width, canvas.height);
            sendMessagePayload({ type: 'image', content: canvas.toDataURL('image/jpeg', 0.7) });
            closeCamera();
        }

        function closeCamera() { document.getElementById('camera-modal').style.display = 'none'; }

        /* Голосовые сообщения */
        async function toggleVoiceRecord() {
            audioEngine.playClickSound();
            const btn = document.getElementById('rec-btn');
            if (!isVoiceRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    voiceRecorder = new MediaRecorder(stream);
                    voiceChunks = [];
                    voiceRecorder.ondataavailable = e => { if (e.data.size > 0) voiceChunks.push(e.data); };
                    voiceRecorder.onstop = () => {
                        const reader = new FileReader();
                        reader.onloadend = () => sendMessagePayload({ type: 'audio', content: reader.result });
                        reader.readAsDataURL(new Blob(voiceChunks, { type: 'audio/webm' }));
                        stream.getTracks().forEach(track => track.stop());
                    };
                    voiceRecorder.start();
                    isVoiceRecording = true;
                    btn.innerText = '🔴 Стоп';
                } catch(e) { alert("Ошибка микрофона"); }
            } else {
                isVoiceRecording = false;
                btn.innerText = '🎤 Голосовое';
                if (voiceRecorder) voiceRecorder.stop();
            }
        }

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => sendMessagePayload({ type: file.type.startsWith('image/') ? 'image' : 'video', content: evt.target.result });
            reader.readAsDataURL(file);
            e.target.value = '';
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }
    </script>
</body>
