        function levelInfo(steps) {
            let level = 1;
            while (500 * level * level <= steps) level++;
            const prevReq = 500 * (level - 1) * (level - 1);
            const nextReq = 500 * level * level;
            const progress = Math.min(1, (steps - prevReq) / (nextReq - prevReq));
            return { level, prevReq, nextReq, progress };
        }

            const fromSteps = Math.floor(state.steps / 10000) * 5;
            return fromSteps + state.crystalsBought - state.crystalsSpent;
        }

        function getActiveMinutes() { return Math.floor(state.steps / 130); }

        function getStatPoints() { return Math.floor(getDistance() / 0.5); }

        function getAgility() { return 5 + Math.round(getStatPoints() * 0.25); }

        function getHeroTier() {
            const lv = getLevelInfo().level;
            return lv >= 12 ? 4 : lv >= 8 ? 3 : lv >= 4 ? 2 : 1;

        function saveState() {
            try {
                const data = {
                    steps: state.steps,
                    unlocked: state.unlocked,
                    unlockedAch: state.unlockedAch,
                    confirmedAdult: state.confirmedAdult,
                    crystalsSpent: state.crystalsSpent,
                    crystalsBought: state.crystalsBought,
                    owned: state.owned,
                    notifSettings: state.notifSettings,
                    lastAdMilestone: state.lastAdMilestone,
                    clanTier: state.clanTier,
                    _portfolioSub: state._portfolioSub,
                };
                localStorage.setItem('wasteland_protocol', JSON.stringify(data));
            } catch (e) { /* ignore */ }
        }

        function loadState() {
            try {
                const raw = localStorage.getItem('wasteland_protocol');
                if (!raw) return;
                const data = JSON.parse(raw);
                Object.assign(state, data);
                state.prevLevel = getLevelInfo().level;
                state.unlocked = state.unlocked || [];
                state.unlockedAch = state.unlockedAch || [];
                state.owned = state.owned || [];
                state.confirmedAdult = state.confirmedAdult || {};
                state.notifSettings = state.notifSettings || { progress: true, raid: true, clan: true, offers: true };
                state._portfolioSub = state._portfolioSub || 'achievements';
            } catch (e) { /* ignore */ }
        }

        // ============================================================
        //  EFFECTS (pure, no render calls)
        // ============================================================

        function runEffects() {
            const li = getLevelInfo();
            ALL_LEARNABLE.forEach(bp => {
                if (state.steps >= bp.threshold && !state.unlocked.includes(bp.id)) {
                    state.unlocked.push(bp.id);
                    pushToast(`Открыто: «${bp.name}»`, 'blueprint');
                }
            });
            ACHIEVEMENTS.forEach(a => {
                if (state.steps >= a.threshold && !state.unlockedAch.includes(a.id)) {
                    state.unlockedAch.push(a.id);
                    pushToast(`Достижение получено: «${a.name}»`, 'achievement');
                }
            });
            if (li.level > state.prevLevel) {
                pushToast(`Новый уровень: ${li.level}`, 'level');
                state.prevLevel = li.level;
            }
            const milestone = Math.floor(state.steps / 30000);
            if (milestone > state.lastAdMilestone && state.steps < 500000 && !getAdsDisabled()) {
                state.showAd = true;
            }
        }

        // ============================================================
        //  UPDATE LOOP (requestAnimationFrame based)
        // ============================================================

        let updateScheduled = false;

        function scheduleUpdate() {
            if (!updateScheduled) {
                updateScheduled = true;
                requestAnimationFrame(() => {
                    updateScheduled = false;
                    fullUpdate();
                });
            }
        }

        function fullUpdate() {
            // 1. Run effects (may push toasts, which call scheduleUpdate again, but we guard with flag)
            runEffects();
            // 2. Handle challenge timer
            handleChallengeTimer();
            // 3. Save state
            saveState();
            // 4. Render
            render();
        }

        // Challenge timer logic (uses setTimeout, but does NOT cause recursive render)
        function handleChallengeTimer() {
            if (state.challenge.active) {
                if (state.challenge.timeLeft <= 0) {
                    const success = state.challenge.clicks >= 18;
                    state.challenge.active = false;
                    state.challenge.result = success ? 'win' : 'lose';
                    if (success) {
                        state.steps += 2000;
                        pushToast('Локация пройдена: бонус за скорость получен', 'success');
                    } else {
                        pushToast('Время вышло — бонус не выдан', 'warn');
                    }
                    // after finishing, we schedule update but it's already in progress
                    // Just trigger render again
                    scheduleUpdate();
                    return;
                }
                if (!state.challengeTimer) {
                    state.challengeTimer = setTimeout(() => {
                        state.challenge.timeLeft -= 1;
                        state.challengeTimer = null;
                        // after decrement, update UI
                        scheduleUpdate();
                    }, 1000);
                }
            } else {
                if (state.challengeTimer) {
                    clearTimeout(state.challengeTimer);
                    state.challengeTimer = null;
                }
            }
        }

        function setTab(tab) { state.tab = tab;
            scheduleUpdate(); }

        function addSteps(n) {
            state.steps += n;
            scheduleUpdate();

        function startChallenge() {
            state.challenge = { active: true, timeLeft: 15, clicks: 0, result: null };
            state.challengeTimer = null;
            scheduleUpdate();
        }

        function challengeClick() {
            if (!state.challenge.active) return;
            state.challenge.clicks += 1;
            scheduleUpdate();
        }

        function startRaid() {
            state.raid = {
                stage: 'run',
                stageIndex: 0,
                meters: 0,
                target: 200 + Math.floor(Math.random() * 100),
                combo: 0,
                puzzle: null,
                result: null,
            };
            scheduleUpdate();
        }

        function advanceRaidStage(r) {
            const nextIndex = r.stageIndex + 1;
            if (nextIndex >= RAID_STAGES.length) {
                pushToast('Рейд завершён — награда получена', 'success');
                state.steps += 3000 + r.combo * 500;
                const newRaid = { ...r, stage: 'result', result: 'win', stageIndex: nextIndex };
                state.raid = newRaid;
                scheduleUpdate();
                return;
            }
            const stage = RAID_STAGES[nextIndex];
            if (stage === 'run') {
                state.raid = {
                    ...r,
                    stage: 'run',
                    stageIndex: nextIndex,
                    meters: 0,
                    target: 250 + Math.floor(Math.random() * 150),
                };
            } else {
                const puzzle = pick(PUZZLES);
                state.raid = { ...r, stage: 'puzzle', stageIndex: nextIndex, puzzle };
            }
            scheduleUpdate();
        }

        function runTap() {
            const r = state.raid;
            if (r.stage !== 'run') return;
            const meters = r.meters + 15 + Math.floor(Math.random() * 15);
            if (meters >= r.target) {
                advanceRaidStage({ ...r, meters: r.target });
            } else {
                state.raid = { ...r, meters };
                scheduleUpdate();
            }
        }

        function answerPuzzle(idx) {
            const r = state.raid;
            if (r.stage !== 'puzzle' || !r.puzzle) return;
            const correct = idx === r.puzzle.answer;
            if (correct) {
                pushToast('Верно! Комбо +1', 'success');
                advanceRaidStage({ ...r, combo: r.combo + 1 });
            } else {
                pushToast('Неверно, но группа продолжает вместе', 'warn');
                advanceRaidStage({ ...r });
            }
        }

            if (crystals < item.price) { pushToast('Недостаточно кристаллов', 'warn');

            state.owned.push(item.id);
            pushToast(`Куплено: ${item.name}`, 'success');
            scheduleUpdate();

            }

            let toastHTML = '';
            if (state.toasts.length) {
                toastHTML = `<div class="fixed top-3 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 w-[92%] max-w-md pointer-events-none">
              ${state.toasts.map(t => `
                <div class="border rounded-sm px-3 py-2 text-xs font-mono shadow-lg backdrop-blur bg-stone-900/95 pointer-events-auto toast-enter ${
                  t.type === 'success' ? 'border-emerald-700 text-emerald-300' :
                  t.type === 'warn' ? 'border-rose-700 text-rose-300' :
                  t.type === 'level' || t.type === 'achievement' ? 'border-amber-600 text-amber-300' :
                  'border-stone-700 text-stone-300'
                }">
                  <span class="opacity-60 mr-1">[SYSTEM]</span>${t.text}
                </div>
              `).join('')}
            </div>`;
            }

            let tabContent = '';
            switch (state.tab) {
                case 'home':
                    tabContent = renderHome();
                    break;
                case 'quests':
                    tabContent = renderQuests();
                    break;
                case 'portfolio':
                    tabContent = renderPortfolio();
                    break;
                case 'hero':
                    tabContent = renderHero();
                    break;
                case 'clan':
                    tabContent = renderClan();
                    break;
                case 'raid':
                    tabContent = renderRaid();
                    break;
                case 'shop':
                    tabContent = renderShop();
                    break;
                case 'settings':
                    tabContent = renderSettings();
                    break;
                default:
                    tabContent = renderHome();
            }

            const nav = `
          <div class="fixed bottom-0 left-0 right-0 bg-stone-950 border-t border-stone-800 z-30">
            <div class="max-w-md mx-auto grid grid-cols-7 text-[8px] font-mono">
              ${navBtn('home', 'home', 'Дом')}
              ${navBtn('quests', 'scroll-text', 'Квесты')}
              ${navBtn('portfolio', 'trophy', 'Портф.')}
              ${navBtn('hero', 'user', 'Герой')}
              ${navBtn('clan', 'users', 'Клан')}
              ${navBtn('raid', 'swords', 'Рейд')}
              ${navBtn('shop', 'shopping-bag', 'Магаз.')}
            </div>
          </div>
          `;

            let modalHTML = '';
            const bp = getSelectedBp();
            if (bp) {
                const risk = RISK_META[bp.risk] || RISK_META.none;
                const needsConfirm = bp.risk === 'high' && !state.confirmedAdult[bp.id];
                let modalBody = '';
                if (needsConfirm) {
                    modalBody = `
                <div class="border border-rose-800 bg-rose-950/30 rounded-sm p-3 space-y-3">
                  <div class="flex gap-2 text-rose-300 text-xs"><i data-lucide="alert-triangle" class="w-4 h-4 shrink-0 mt-0.5"></i><span>Это задача повышенного риска. Инструкция раскроется после подтверждения — рекомендуем делать это со взрослым или специалистом рядом.</span></div>
                  <button class="w-full bg-rose-600 text-white text-xs font-bold uppercase tracking-wide rounded-sm py-2.5" data-confirm-adult="${bp.id}">Понимаю риски — показать инструкцию</button>
                </div>
              `;
                } else {
                    modalBody = `
                <div>
                  <div class="text-[10px] font-mono text-stone-500 mb-2">ПОШАГОВАЯ ИНСТРУКЦИЯ</div>
                  <ol class="space-y-2">
                    ${bp.steps.map((s, i) => `<li class="flex gap-2 text-sm text-stone-300"><span class="text-amber-500 font-mono text-xs shrink-0 mt-0.5">${i+1}.</span><span>${s}</span></li>`).join('')}
                  </ol>
                </div>
                <a href="${youtubeSearchUrl(bp.videoQuery)}" target="_blank" rel="noreferrer" class="flex items-center justify-center gap-2 w-full border border-stone-700 rounded-sm py-2.5 text-xs font-bold uppercase tracking-wide text-stone-300 hover:bg-stone-900 mt-3">
                  <i data-lucide="youtube" class="w-4 h-4 text-rose-500"></i> Смотреть видео на YouTube
                </a>
                ${bp.escalation ? `<div class="border border-amber-800/60 bg-amber-950/20 rounded-sm p-3 flex gap-2 mt-3"><i data-lucide="phone" class="w-4 h-4 text-amber-400 shrink-0 mt-0.5"></i><span class="text-xs text-amber-200">${bp.escalation}</span></div>` : ''}
                <div class="text-[10px] text-stone-600 font-mono mt-3">Общеобразовательная информация. Не заменяет консультацию врача/специалиста. Не уверен — позови взрослого или позвони в службу спасения.</div>
              `;
                }
                modalHTML = `
              <div class="fixed inset-0 bg-black/70 z-40 flex items-end sm:items-center justify-center p-0 sm:p-4 modal-overlay">
                <div class="bg-stone-950 border border-stone-700 rounded-t-lg sm:rounded-lg w-full max-w-md max-h-[85vh] overflow-y-auto modal-scroll">
                  <div class="sticky top-0 bg-stone-950 border-b border-stone-800 px-4 py-3 flex items-center justify-between">
                    <div>
                      <div class="text-[10px] font-mono tracking-widest text-amber-500/70">${bp.category === 'cooking' ? 'РЕЦЕПТ' : 'ЧЕРТЁЖ'}</div>
                      <div class="font-extrabold text-stone-100">${bp.name}</div>
                    </div>
                    <button class="text-stone-500" data-close-modal><i data-lucide="x" class="w-5 h-5"></i></button>
                  </div>
                  <div class="p-4 space-y-3">
                    <div class="text-xs font-mono ${risk.color}">${risk.label}</div>
                    ${modalBody}
                  </div>
                </div>
              </div>
            `;
            }

            const fullHTML = `
          ${topBar}
          ${adBanner}
          ${toastHTML}
          <div class="max-w-md mx-auto px-4 mt-4 space-y-4 pb-24">
            ${tabContent}
          </div>
          ${nav}
          ${modalHTML}
          `;

            root.innerHTML = fullHTML;

            if (typeof lucide !== 'undefined' && lucide.createIcons) {
                lucide.createIcons();
            }
        }

        // ============================================================
        //  EVENT DELEGATION
        // ============================================================

        function setupEventDelegation() {
            const root = document.getElementById('root');
            root.addEventListener('click', function(e) {
                const target = e.target.closest('[data-tab], [data-add], [data-start-challenge], [data-challenge-click], [data-select], [data-close-modal], [data-confirm-adult], [data-start-raid], [data-run-tap], [data-puzzle], [data-buy-item], [data-buy-pack], [data-upgrade-clan], [data-toggle], [data-close-ad], [data-psub], [data-reset]');
                if (!target) return;

                if (target.hasAttribute('data-tab')) {
                    e.preventDefault();
                    setTab(target.getAttribute('data-tab'));
                    return;
                }

                if (target.hasAttribute('data-add')) {
                    e.preventDefault();
                    const n = parseInt(target.getAttribute('data-add'), 10);
                    addSteps(n);
                    return;
                }

                if (target.hasAttribute('data-start-challenge')) {
                    e.preventDefault();
                    startChallenge();
                    return;
                }

                if (target.hasAttribute('data-challenge-click')) {
                    e.preventDefault();
                    challengeClick();
                    return;
                }

                if (target.hasAttribute('data-select')) {
                    e.preventDefault();
                    const id = target.getAttribute('data-select');
                    if (state.unlocked.includes(id)) {
                        setSelectedItem(id);
                    }
                    return;
                }

                if (target.hasAttribute('data-close-modal')) {
                    e.preventDefault();
                    closeModal();
                    return;
                }

                if (target.hasAttribute('data-confirm-adult')) {
                    e.preventDefault();
                    const id = target.getAttribute('data-confirm-adult');
                    confirmAdult(id);
                    return;
                }

                if (target.hasAttribute('data-start-raid')) {
                    e.preventDefault();
                    startRaid();
                    return;
                }

                if (target.hasAttribute('data-run-tap')) {
                    e.preventDefault();
                    runTap();
                    return;
                }

                if (target.hasAttribute('data-puzzle')) {
                    e.preventDefault();
                    const idx = parseInt(target.getAttribute('data-puzzle'), 10);
                    answerPuzzle(idx);
                    return;
                }

                if (target.hasAttribute('data-buy-item')) {
                    e.preventDefault();
                    const id = target.getAttribute('data-buy-item');
                    const item = SHOP_ITEMS.find(i => i.id === id);
                    if (item) buyItem(item);
                    return;
                }

                if (target.hasAttribute('data-buy-pack')) {
                    e.preventDefault();
                    const id = target.getAttribute('data-buy-pack');
                    const pack = CRYSTAL_PACKS.find(p => p.id === id);
                    if (pack) buyPack(pack);
                    return;
                }

                if (target.hasAttribute('data-upgrade-clan')) {
                    e.preventDefault();
                    upgradeClan();
                    return;
                }

                if (target.hasAttribute('data-toggle')) {
                    e.preventDefault();
                    const id = target.getAttribute('data-toggle');
                    toggleNotif(id);
                    return;
                }

                if (target.hasAttribute('data-close-ad')) {
                    e.preventDefault();
                    closeAd();
                    return;
                }

                if (target.hasAttribute('data-psub')) {
                    e.preventDefault();
                    const sub = target.getAttribute('data-psub');
                    state._portfolioSub = sub;
                    scheduleUpdate();
                    return;
                }

                if (target.hasAttribute('data-reset')) {
                    e.preventDefault();
                    resetProgress();
                    return;
                }
            });
        }

        // ============================================================
        //  BOOT
        // ============================================================

        // Скрыть экран загрузки после загрузки страницы
        window.addEventListener('load', function() {
            setTimeout(function() {
                document.getElementById('loading-screen').classList.add('hidden');
            }, 1000);
        });

        // Загрузить сохранённое состояние
        loadState();
        state.prevLevel = getLevelInfo().level;

        // Первый рендер
        scheduleUpdate();

        // Навесить события
        setupEventDelegation();

        console.log('Протокол Пустошь загружен.');
    </script>
</body>
</html>
