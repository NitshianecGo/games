<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>METRO NET // РАДИОСТАНЦИЯ ЭКСПЕДИЦИИ</title>
    <!-- Шрифт терминала Metro -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <!-- MQTT.js CDN -->
    <script src="https://unpkg.com/mqtt@5.3.0/dist/mqtt.min.js"></script>
    <style>
        :root {
            --metro-amber: #ff7700;
            --metro-amber-glow: rgba(255, 119, 0, 0.4);
            --metro-green: #33ff66;
            --metro-green-glow: rgba(51, 255, 102, 0.4);
            --metro-red: #ff3333;
            --metro-dark: #0a0d0f;
            --metro-panel: #141a1f;
            --metro-border: #2c3842;
            --metro-text: #c8d6e0;
            --metro-muted: #627785;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            background-color: var(--metro-dark);
            color: var(--metro-text);
            font-family: 'Share Tech Mono', monospace;
            height: 100dvh; /* Высота под iOS Safari */
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Эффект ЭЛТ-монитора */
        .crt::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 999;
            background-size: 100% 3px, 6px 100%;
            pointer-events: none;
        }

        /* Экранные контейнеры */
        .screen {
            display: none;
            width: 100%;
            max-width: 900px;
            height: 100dvh;
            max-height: 100dvh;
            flex-direction: column;
            position: relative;
            z-index: 10;
            padding: 6px;
        }

        .screen.active {
            display: flex;
        }

        /* Загрузка */
        #screen-loading {
            justify-content: center;
            align-items: center;
            text-align: center;
            background: #050708;
        }

        .metro-loader {
            width: 50px;
            height: 50px;
            border: 4px solid var(--metro-border);
            border-top: 4px solid var(--metro-amber);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            box-shadow: 0 0 15px var(--metro-amber-glow);
            margin-bottom: 20px;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .loading-title {
            color: var(--metro-amber);
            font-size: 20px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--metro-amber);
            margin-bottom: 8px;
        }

        .loading-status {
            color: var(--metro-muted);
            font-size: 13px;
        }

        /* Логин */
        #screen-login {
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background: var(--metro-panel);
            border: 2px solid var(--metro-border);
            padding: 20px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 0 25px rgba(0,0,0,0.8);
        }

        .metro-title {
            color: var(--metro-amber);
            font-size: 20px;
            text-align: center;
            margin-bottom: 16px;
            text-shadow: 0 0 10px var(--metro-amber);
            letter-spacing: 2px;
        }

        .field-group {
            margin-bottom: 14px;
        }

        .field-group label {
            display: block;
            font-size: 11px;
            color: var(--metro-muted);
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .metro-input {
            width: 100%;
            background: #0b0e11;
            border: 1px solid var(--metro-border);
            color: var(--metro-amber);
            padding: 10px 12px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            user-select: text;
            -webkit-user-select: text;
        }

        .metro-btn {
            width: 100%;
            background: var(--metro-panel);
            color: var(--metro-amber);
            border: 1px solid var(--metro-amber);
            padding: 12px;
            font-family: inherit;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        /* Главный экран */
        #screen-chat {
            padding: 6px;
        }

        .chat-header {
            background: var(--metro-panel);
            border: 1px solid var(--metro-border);
            padding: 8px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            gap: 6px;
            flex-shrink: 0;
        }

        .channel-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--metro-green);
            box-shadow: 0 0 8px var(--metro-green);
        }

        .status-dot.disconnected {
            background: var(--metro-red);
            box-shadow: 0 0 8px var(--metro-red);
        }

        .user-tag {
            color: var(--metro-amber);
            font-weight: bold;
        }

        .header-actions {
            display: flex;
            gap: 6px;
        }

        .copy-btn {
            background: transparent;
            border: 1px solid var(--metro-border);
            color: var(--metro-text);
            padding: 6px 10px;
            font-family: inherit;
            font-size: 11px;
            cursor: pointer;
            white-space: nowrap;
        }

        /* Индикатор приема рации */
        .ptt-status-banner {
            display: none;
            background: rgba(255, 119, 0, 0.15);
            border: 1px solid var(--metro-amber);
            color: var(--metro-amber);
            padding: 6px;
            text-align: center;
            font-size: 12px;
            margin-bottom: 6px;
            letter-spacing: 1px;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .ptt-status-banner.active {
            display: block;
        }

        /* Область сообщений со скроллом */
        .chat-body {
            flex: 1;
            min-height: 0; /* Обязательно для iOS flex-scroll */
            background: #07090b;
            border: 1px solid var(--metro-border);
            padding: 10px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 6px;
        }

        .chat-body::-webkit-scrollbar { width: 4px; }
        .chat-body::-webkit-scrollbar-thumb { background: var(--metro-border); }

        .msg {
            max-width: 85%;
            padding: 8px 12px;
            border: 1px solid var(--metro-border);
            background: var(--metro-panel);
            word-wrap: break-word;
        }

        .msg.self {
            align-self: flex-end;
            border-color: rgba(255, 119, 0, 0.4);
            background: #1c150e;
        }

        .msg.other {
            align-self: flex-start;
            border-color: #2a343d;
        }

        .msg.system {
            align-self: center;
            max-width: 95%;
            background: transparent;
            border: none;
            color: var(--metro-muted);
            font-size: 11px;
            text-align: center;
            padding: 2px;
        }

        .msg-meta {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: var(--metro-muted);
            margin-bottom: 4px;
            gap: 10px;
        }

        .msg.self .msg-sender { color: var(--metro-amber); }

        .msg-text {
            font-size: 13px;
            line-height: 1.3;
            color: var(--metro-text);
            user-select: text;
            -webkit-user-select: text;
        }

        .msg-media img, .msg-media video {
            max-width: 100%;
            max-height: 200px;
            border: 1px solid var(--metro-border);
            margin-top: 4px;
        }

        /* Аудио плеер */
        .audio-player {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
            background: #0b0e11;
            padding: 6px 10px;
            border: 1px solid var(--metro-border);
        }

        .audio-play-btn {
            background: var(--metro-amber);
            color: var(--metro-dark);
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            flex-shrink: 0;
        }

        .audio-wave {
            flex: 1;
            height: 4px;
            background: var(--metro-border);
            position: relative;
            overflow: hidden;
        }

        .audio-progress {
            height: 100%;
            width: 0%;
            background: var(--metro-amber);
        }

        /* Панель ввода */
        .chat-input-panel {
            background: var(--metro-panel);
            border: 1px solid var(--metro-border);
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
        }

        .input-row {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .input-btn {
            background: #0b0e11;
            border: 1px solid var(--metro-border);
            color: var(--metro-amber);
            width: 38px;
            height: 38px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .input-btn.recording {
            background: var(--metro-red);
            color: white;
            border-color: var(--metro-red);
        }

        #chat-message-input {
            flex: 1;
            height: 38px;
            font-size: 13px;
        }

        /* Кнопка Рации PTT */
        .ptt-btn {
            width: 100%;
            height: 46px;
            background: #0b0e11;
            border: 2px solid var(--metro-amber);
            color: var(--metro-amber);
            font-family: inherit;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            touch-action: manipulation;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        .ptt-btn.transmitting {
            background: var(--metro-red);
            border-color: var(--metro-red);
            color: white;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.6);
        }

        #toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--metro-amber);
            color: var(--metro-dark);
            padding: 6px 16px;
            font-weight: bold;
            display: none;
            z-index: 1000;
            font-size: 12px;
        }
    </style>
</head>
<body class="crt">

    <div id="toast">СКОПИРОВАНО В БУФЕР</div>

    <!-- 1. Экран Загрузки -->
    <div id="screen-loading" class="screen active">
        <div class="metro-loader"></div>
        <div class="loading-title">METRO-NET v4.5</div>
        <div id="loading-status" class="loading-status">ПОДКЛЮЧЕНИЕ К ЧАСТОТАМ...</div>
    </div>

    <!-- 2. Экран Входа -->
    <div id="screen-login" class="screen">
        <div class="login-card">
            <div class="metro-title">РАДИОСТАНЦИЯ</div>
            <div class="field-group">
                <label for="username-input">Позывной сталкера</label>
                <input type="text" id="username-input" class="metro-input" placeholder="Артем" maxlength="15" autocomplete="off">
            </div>
            <div class="field-group">
                <label for="room-input">Номер частоты</label>
                <input type="text" id="room-input" class="metro-input" placeholder="канал..." maxlength="20" autocomplete="off">
            </div>
            <button class="metro-btn" onclick="startSession()">
                <span>ВЫЙТИ В ЭФИР</span> ➤
            </button>
        </div>
    </div>

    <!-- 3. Экран Чата и Рации -->
    <div id="screen-chat" class="screen">
        <div class="chat-header">
            <div class="channel-info">
                <div id="conn-status" class="status-dot"></div>
                <div>
                    <span>ПОЗЫВНОЙ: <strong id="display-user" class="user-tag">---</strong></span>
                    <span style="color:var(--metro-muted); margin-left: 4px;">[<span id="display-room" style="color:var(--metro-amber);">---</span>]</span>
                </div>
            </div>
            <div class="header-actions">
                <button class="copy-btn" onclick="copyInviteLink()">🔗 ССЫЛКА</button>
            </div>
        </div>

        <!-- Индикатор входящей речи рации -->
        <div id="ptt-banner" class="ptt-status-banner">
            📡 ВХОДЯЩАЯ ТРАНСЛЯЦИЯ РАЦИИ: <strong id="ptt-speaker-name">---</strong>
        </div>

        <div id="chat-messages" class="chat-body">
            <div class="msg system">Канал связи защищен. Зажмите кнопку «РАЦИЯ» для передачи речи.</div>
        </div>

        <div class="chat-input-panel">
            <!-- Большая кнопка Рации PTT -->
            <button id="ptt-button" class="ptt-btn">
                🎙️ ЗАЖМИ И ГОВОРИ (РАЦИЯ)
            </button>

            <div class="input-row">
                <button class="input-btn" onclick="document.getElementById('file-picker').click()" title="Файл">📎</button>
                <input type="file" id="file-picker" style="display:none;" accept="image/*,video/*" onchange="handleFileSelect(event)">

                <input type="text" id="chat-message-input" class="metro-input" placeholder="Сообщение..." onkeypress="handleKeyPress(event)">

                <button id="rec-btn" class="input-btn" onclick="toggleVoiceRecord()" title="Записать аудиосообщение">🎙️</button>
                <button class="input-btn" onclick="sendTextMessage()">➤</button>
            </div>
        </div>
    </div>

    <script>
        /* ================= 1. ЗВУКОВОЙ ДВИЖОК ЭФИРА ================= */
        class MetroSoundEngine {
            constructor() { this.ctx = null; }
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (this.ctx.state === 'suspended') this.ctx.resume();
            }
            playClick() {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(60, this.ctx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.05);
            }
            /* Сигнал начала рации (Roger Beep Start) */
            playPTTStart() {
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.setValueAtTime(1200, now + 0.04);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(now); osc.stop(now + 0.09);
            }
            /* Сигнал завершения передачи рации (Roger Beep End) */
            playPTTEnd() {
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.setValueAtTime(400, now + 0.06);
                gain.gain.setValueAtTime(0.06, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(now); osc.stop(now + 0.12);
            }
        }

        const audioEngine = new MetroSoundEngine();

        /* ================= 2. СОСТОЯНИЕ И МЕТРИКИ ================= */
        const BROKERS = ['wss://broker.hivemq.com:8884/mqtt', 'wss://broker.emqx.io:8084/mqtt'];
        let currentBrokerIdx = 0;
        let mqttClient = null;

        let myUserId = localStorage.getItem('metro_uid') || 'u_' + Math.random().toString(36).substr(2, 7);
        localStorage.setItem('metro_uid', myUserId);

        let myUsername = localStorage.getItem('metro_uname') || '';
        let currentRoom = new URLSearchParams(window.location.search).get('room') || localStorage.getItem('metro_room') || '';

        /* Переменные записи аудиосообщений */
        let isVoiceRecording = false;
        let voiceRecorder = null;
        let voiceChunks = [];

        /* Управление аудиосообщениями (Плей/Пауза) */
        let activeAudio = null;
        let activeAudioBtn = null;

        /* PTT (Рация) переменные */
        let isPTTTransmitting = false;
        let pttMediaRecorder = null;
        let pttStreamId = null;
        let pttAudioQueue = [];
        let isPlayingPTTQueue = false;

        /* ================= 3. ИНИЦИАЛИЗАЦИЯ ================= */
        window.onload = () => {
            setupPTTEvents();
            setTimeout(() => {
                document.getElementById('screen-loading').classList.remove('active');
                document.getElementById('screen-login').classList.add('active');

                if (myUsername) document.getElementById('username-input').value = myUsername;
                if (!currentRoom) currentRoom = 'metro-' + Math.random().toString(36).substr(2, 6);
                document.getElementById('room-input').value = currentRoom;

                if (myUsername && new URLSearchParams(window.location.search).get('room')) {
                    startSession();
                }
            }, 800);
        };

        /* ================= 4. ПОДКЛЮЧЕНИЕ К MQTT ================= */
        function startSession() {
            audioEngine.playClick();
            const unameInput = document.getElementById('username-input').value.trim();
            const roomInput = document.getElementById('room-input').value.trim();

            if (!unameInput || !roomInput) return alert("Укажите позывной и номер частоты!");

            myUsername = unameInput;
            currentRoom = roomInput;

            localStorage.setItem('metro_uname', myUsername);
            localStorage.setItem('metro_room', currentRoom);

            window.history.replaceState({}, '', `?room=${encodeURIComponent(currentRoom)}`);

            document.getElementById('screen-login').classList.remove('active');
            document.getElementById('screen-loading').classList.add('active');
            document.getElementById('loading-status').innerText = `ПОДКЛЮЧЕНИЕ К ЧАСТОТЕ #${currentRoom}...`;

            connectMQTT();
        }

        function connectMQTT() {
            const clientId = 'metro_' + myUserId + '_' + Math.random().toString(36).substr(2, 4);

            try {
                mqttClient = mqtt.connect(BROKERS[currentBrokerIdx], {
                    clientId: clientId, keepalive: 60, reconnectPeriod: 3000
                });

                mqttClient.on('connect', () => {
                    const topic = `metro/channel/v4/${currentRoom}`;
                    mqttClient.subscribe(topic, { qos: 1 }, (err) => {
                        if (!err) {
                            showChatScreen();
                            publishPayload({ type: 'system', content: `Сталкер [${myUsername}] вышел в эфир.` });
                        }
                    });
                });

                mqttClient.on('message', (topic, message) => {
                    try {
                        const payload = JSON.parse(message.toString());
                        if (payload.type.startsWith('ptt_')) {
                            handlePTTIncoming(payload);
                        } else {
                            renderIncomingMessage(payload);
                        }
                    } catch(e) { console.error(e); }
                });

                mqttClient.on('error', () => document.getElementById('conn-status').classList.add('disconnected'));
                mqttClient.on('offline', () => document.getElementById('conn-status').classList.add('disconnected'));
            } catch(e) {
                currentBrokerIdx = (currentBrokerIdx + 1) % BROKERS.length;
                setTimeout(connectMQTT, 1500);
            }
        }

        function showChatScreen() {
            document.getElementById('screen-loading').classList.remove('active');
            document.getElementById('screen-chat').classList.add('active');
            document.getElementById('display-user').innerText = myUsername;
            document.getElementById('display-room').innerText = '#' + currentRoom;
            document.getElementById('conn-status').classList.remove('disconnected');
        }

        /* ================= 5. ДВИЖОК РАЦИИ (PUSH-TO-TALK) ================= */
        function setupPTTEvents() {
            const btn = document.getElementById('ptt-button');

            // Мышь
            btn.addEventListener('mousedown', startPTT);
            btn.addEventListener('mouseup', stopPTT);
            btn.addEventListener('mouseleave', stopPTT);

            // Тачскрин (мобильные)
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); startPTT(); }, { passive: false });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); stopPTT(); }, { passive: false });
            btn.addEventListener('touchcancel', (e) => { e.preventDefault(); stopPTT(); }, { passive: false });
        }

        async function startPTT() {
            if (isPTTTransmitting) return;
            audioEngine.init();
            audioEngine.playPTTStart();

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                isPTTTransmitting = true;
                pttStreamId = 'stream_' + Date.now();

                const btn = document.getElementById('ptt-button');
                btn.classList.add('transmitting');
                btn.innerText = '🔴 ЭФИР ОТКРЫТ (ГОВОРИТЕ)';

                pttMediaRecorder = new MediaRecorder(stream);
                
                pttMediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0 && isPTTTransmitting) {
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            publishPayload({
                                type: 'ptt_chunk',
                                streamId: pttStreamId,
                                chunk: reader.result
                            });
                        };
                        reader.readAsDataURL(e.data);
                    }
                };

                // Оповещаем всех об открытии передачи
                publishPayload({ type: 'ptt_start', streamId: pttStreamId });

                // Нарезаем аудио фрагментами по 300 мс для передачи
                pttMediaRecorder.start(300);

            } catch (err) {
                isPTTTransmitting = false;
                alert("Ошибка рации: Нет доступа к микрофону!");
            }
        }

        function stopPTT() {
            if (!isPTTTransmitting) return;
            isPTTTransmitting = false;

            const btn = document.getElementById('ptt-button');
            btn.classList.remove('transmitting');
            btn.innerText = '🎙️ ЗАЖМИ И ГОВОРИ (РАЦИЯ)';

            audioEngine.playPTTEnd();

            if (pttMediaRecorder && pttMediaRecorder.state !== 'inactive') {
                pttMediaRecorder.stop();
                pttMediaRecorder.stream.getTracks().forEach(track => track.stop());
            }

            // Оповещаем об окончании передачи
            publishPayload({ type: 'ptt_end', streamId: pttStreamId });
        }

        /* Обработка входящих данных рации */
        function handlePTTIncoming(data) {
            if (data.uid === myUserId) return; // Игнорируем собственную речь

            const banner = document.getElementById('ptt-banner');
            const speakerTag = document.getElementById('ptt-speaker-name');

            if (data.type === 'ptt_start') {
                speakerTag.innerText = data.sender;
                banner.classList.add('active');
                audioEngine.playPTTStart();
            } else if (data.type === 'ptt_chunk') {
                pttAudioQueue.push(data.chunk);
                if (!isPlayingPTTQueue) {
                    processPTTQueue();
                }
            } else if (data.type === 'ptt_end') {
                setTimeout(() => {
                    banner.classList.remove('active');
                    audioEngine.playPTTEnd();
                }, 500);
            }
        }

        function processPTTQueue() {
            if (pttAudioQueue.length === 0) {
                isPlayingPTTQueue = false;
                return;
            }

            isPlayingPTTQueue = true;
            const chunkData = pttAudioQueue.shift();
            const audio = new Audio(chunkData);

            audio.onended = () => processPTTQueue();
            audio.onerror = () => processPTTQueue();

            audio.play().catch(() => processPTTQueue());
        }

        /* ================= 6. РАБОТА С ГОЛОСОВЫМИ СООБЩЕНИЯМИ ================= */
        function playAudio(btn, src) {
            // Повторное нажатие — Пауза/Возобновление
            if (activeAudio && activeAudioBtn === btn) {
                if (!activeAudio.paused) {
                    activeAudio.pause();
                    btn.innerText = '▶';
                } else {
                    activeAudio.play();
                    btn.innerText = '❚❚';
                }
                return;
            }

            // Выключаем предыдущее проигрывание
            if (activeAudio) {
                activeAudio.pause();
                if (activeAudioBtn) activeAudioBtn.innerText = '▶';
            }

            activeAudio = new Audio(src);
            activeAudioBtn = btn;
            const progress = btn.parentElement.querySelector('.audio-progress');

            btn.innerText = '❚❚';
            activeAudio.play().catch(e => console.error("Audio error:", e));

            activeAudio.ontimeupdate = () => {
                if (activeAudio && activeAudio.duration) {
                    const pct = (activeAudio.currentTime / activeAudio.duration) * 100;
                    progress.style.width = pct + '%';
                }
            };

            activeAudio.onended = () => {
                btn.innerText = '▶';
                progress.style.width = '0%';
                activeAudio = null;
                activeAudioBtn = null;
            };
        }

        async function toggleVoiceRecord() {
            const btn = document.getElementById('rec-btn');
            audioEngine.init();

            if (!isVoiceRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    voiceRecorder = new MediaRecorder(stream);
                    voiceChunks = [];

                    voiceRecorder.ondataavailable = e => { if (e.data.size > 0) voiceChunks.push(e.data); };
                    voiceRecorder.onstop = () => {
                        const audioBlob = new Blob(voiceChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            publishPayload({ type: 'audio', content: reader.result });
                        };
                        reader.readAsDataURL(audioBlob);
                        stream.getTracks().forEach(track => track.stop());
                    };

                    voiceRecorder.start();
                    isVoiceRecording = true;
                    btn.classList.add('recording');
                } catch(e) { alert("Ошибка микрофона: " + e.message); }
            } else {
                isVoiceRecording = false;
                btn.classList.remove('recording');
                if (voiceRecorder && voiceRecorder.state === 'recording') voiceRecorder.stop();
            }
        }

        /* ================= 7. ОТПРАВКА ОБЫЧНЫХ СООБЩЕНИЙ ================= */
        function publishPayload(data) {
            if (!mqttClient || !mqttClient.connected) return;
            const fullPayload = {
                id: 'm_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                uid: myUserId,
                sender: myUsername,
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                ...data
            };
            mqttClient.publish(`metro/channel/v4/${currentRoom}`, JSON.stringify(fullPayload), { qos: 1 });
        }

        function handleKeyPress(e) { if (e.key === 'Enter') sendTextMessage(); }

        function sendTextMessage() {
            const input = document.getElementById('chat-message-input');
            const text = input.value.trim();
            if (!text) return;
            publishPayload({ type: 'text', content: text });
            input.value = '';
        }

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            if (file.type.startsWith('image/')) {
                compressAndSendImage(file);
            } else if (file.type.startsWith('video/')) {
                if (file.size > 8 * 1024 * 1024) return alert("Видео до 8 МБ!");
                const reader = new FileReader();
                reader.onload = (evt) => publishPayload({ type: 'video', content: evt.target.result });
                reader.readAsDataURL(file);
            }
            e.target.value = '';
        }

        function compressAndSendImage(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let w = img.width, h = img.height, max = 900;
                    if (w > max || h > max) {
                        if (w > h) { h = Math.round((h * max) / w); w = max; }
                        else { w = Math.round((w * max) / h); h = max; }
                    }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    publishPayload({ type: 'image', content: canvas.toDataURL('image/jpeg', 0.6) });
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        /* ================= 8. ОТОБРАЖЕНИЕ СООБЩЕНИЙ ================= */
        const renderedMsgs = new Set();

        function renderIncomingMessage(data) {
            if (data.id && renderedMsgs.has(data.id)) return;
            if (data.id) renderedMsgs.add(data.id);

            const box = document.getElementById('chat-messages');

            if (data.type === 'system') {
                const sysDiv = document.createElement('div');
                sysDiv.className = 'msg system';
                sysDiv.innerText = data.content;
                box.appendChild(sysDiv);
                box.scrollTop = box.scrollHeight;
                return;
            }

            const isSelf = data.uid === myUserId;

            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${isSelf ? 'self' : 'other'}`;

            let contentHTML = '';
            if (data.type === 'text') {
                contentHTML = `<div class="msg-text">${escapeHTML(data.content)}</div>`;
            } else if (data.type === 'image') {
                contentHTML = `<div class="msg-media"><img src="${data.content}"></div>`;
            } else if (data.type === 'video') {
                contentHTML = `<div class="msg-media"><video src="${data.content}" controls></video></div>`;
            } else if (data.type === 'audio') {
                contentHTML = `
                    <div class="audio-player">
                        <button class="audio-play-btn" onclick="playAudio(this, '${data.content}')">▶</button>
                        <div class="audio-wave"><div class="audio-progress"></div></div>
                        <span style="font-size:10px; color:var(--metro-muted);">ГОЛОСОВОЕ</span>
                    </div>
                `;
            }

            msgDiv.innerHTML = `
                <div class="msg-meta">
                    <span class="msg-sender">${escapeHTML(data.sender)}</span>
                    <span class="msg-time">${data.timestamp}</span>
                </div>
                ${contentHTML}
            `;

            box.appendChild(msgDiv);
            box.scrollTop = box.scrollHeight;
        }

        function copyInviteLink() {
            audioEngine.playClick();
            navigator.clipboard.writeText(window.location.href);
            const toast = document.getElementById('toast');
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 2000);
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }
    </script>
</body>
</html>
