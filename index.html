<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>METRO NET // СЕКРЕТНЫЙ КАНАЛ</title>
    <!-- Шрифты для стиля Metro -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <!-- Библиотека PeerJS для связи без сервера -->
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        :root {
            --metro-orange: #ff5a00;
            --metro-dark: #0a0a0a;
            --metro-gray: #1f1f1f;
            --text-color: #d3d3d3;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--metro-dark);
            color: var(--text-color);
            font-family: 'Share Tech Mono', monospace;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* Эффект старого монитора (Scanlines) */
        .crt::before {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 999; background-size: 100% 2px, 3px 100%; pointer-events: none;
        }

        /* Экраны */
        .screen {
            display: none; height: 100%; width: 100%; flex-direction: column;
            justify-content: center; align-items: center; position: relative; z-index: 10;
        }
        .screen.active { display: flex; }

        /* Загрузка */
        #loading-screen { background: #000; }
        .spinner { width: 50px; height: 50px; border: 3px solid transparent; border-top-color: var(--metro-orange); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Типографика и кнопки */
        h1 { color: var(--metro-orange); text-shadow: 0 0 10px var(--metro-orange); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }
        
        input, button {
            font-family: 'Share Tech Mono', monospace; font-size: 16px;
            background: var(--metro-gray); color: var(--metro-orange);
            border: 1px solid var(--metro-orange); padding: 10px 15px; margin: 10px 0; outline: none;
        }
        input:focus { box-shadow: 0 0 8px var(--metro-orange); }
        
        button { cursor: pointer; text-transform: uppercase; transition: 0.2s; position: relative; overflow: hidden; }
        button:hover { background: var(--metro-orange); color: var(--metro-dark); box-shadow: 0 0 15px var(--metro-orange); }
        
        /* Чат интерфейс */
        #chat-container { width: 100%; max-width: 800px; height: 100%; display: flex; flex-direction: column; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--metro-orange); padding-bottom: 10px; margin-bottom: 10px; }
        
        .chat-box { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 10px; }
        .chat-box::-webkit-scrollbar { width: 5px; }
        .chat-box::-webkit-scrollbar-thumb { background: var(--metro-orange); }

        .message { max-width: 80%; padding: 10px; border: 1px solid #333; background: #111; animation: fadeIn 0.3s ease-out; }
        .message.self { align-self: flex-end; border-color: var(--metro-orange); color: var(--metro-orange); }
        .message.other { align-self: flex-start; border-color: #555; }
        .msg-name { font-size: 12px; opacity: 0.7; margin-bottom: 5px; }
        
        .media-content img, .media-content video { max-width: 100%; border: 1px solid var(--metro-orange); margin-top: 5px; }
        .media-content audio { height: 30px; margin-top: 5px; outline: none; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Панель ввода */
        .input-panel { display: flex; gap: 10px; margin-top: 10px; align-items: center; }
        #msg-input { flex: 1; margin: 0; }
        .icon-btn { padding: 10px; font-weight: bold; font-size: 18px; width: 45px; height: 45px; display: flex; justify-content: center; align-items: center; }
        .recording { background: #ff0000; color: white; border-color: #ff0000; animation: pulse 1s infinite; }
        
        @keyframes pulse { 0% { box-shadow: 0 0 5px red; } 50% { box-shadow: 0 0 20px red; } 100% { box-shadow: 0 0 5px red; } }

        .hidden-input { display: none; }
        #invite-link-box { font-size: 12px; color: #888; margin-top: 5px; text-align: center; cursor: pointer; }
    </style>
</head>
<body class="crt">

    <!-- Экран загрузки -->
    <div id="loading-screen" class="screen active">
        <div class="spinner"></div>
        <p style="margin-top: 20px; color: var(--metro-orange);" id="loading-text">ИНИЦИАЛИЗАЦИЯ СИСТЕМЫ...</p>
    </div>

    <!-- Экран входа / Создания комнаты -->
    <div id="login-screen" class="screen">
        <h1>ТЕРМИНАЛ СВЯЗИ</h1>
        <input type="text" id="username" placeholder="ВВЕДИТЕ ПОЗЫВНОЙ" autocomplete="off" maxlength="15">
        <button id="btn-action" onclick="joinOrCreateRoom()">ПОДКЛЮЧЕНИЕ</button>
    </div>

    <!-- Экран чата -->
    <div id="chat-screen" class="screen">
        <div id="chat-container">
            <div class="header">
                <div>ПОЗЫВНОЙ: <span id="display-name" style="color: var(--metro-orange);"></span></div>
                <button onclick="copyInviteLink()" style="padding: 5px 10px; font-size: 12px;">СКОПИРОВАТЬ КООРДИНАТЫ (LINK)</button>
            </div>
            <div id="invite-link-box"></div>
            
            <div class="chat-box" id="chat-box">
                <div class="message other"><div class="msg-name">СИСТЕМА</div>Канал связи установлен. Ожидание ответа...</div>
            </div>

            <div class="input-panel">
                <button class="icon-btn" onclick="document.getElementById('file-input').click()">📎</button>
                <input type="file" id="file-input" class="hidden-input" accept="image/*,video/*" onchange="handleFileUpload(event)">
                
                <input type="text" id="msg-input" placeholder="Введите сообщение..." onkeypress="handleEnter(event)">
                
                <button class="icon-btn" id="record-btn" onmousedown="startRecording()" onmouseup="stopRecording()" onmouseleave="stopRecording()" ontouchstart="startRecording()" ontouchend="stopRecording()">🎤</button>
                <button class="icon-btn" onclick="sendTextMessage()">➤</button>
            </div>
        </div>
    </div>

   <script>
    /* ================= ЗВУКОВОЙ ДВИЖОК (Web Audio API) ================= */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playClick() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'square'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    }

    /* ================= ПЕРЕМЕННЫЕ ================= */
    let peer = null;
    let connections = [];
    let myName = localStorage.getItem('metro_name') || '';
    let roomId = new URLSearchParams(window.location.search).get('room');
    let isHost = !roomId;
    
    let mediaRecorder;
    let audioChunks = [];
    let recordTimeout;

    /* ================= ИНИЦИАЛИЗАЦИЯ ================= */
    window.onload = () => {
        setTimeout(() => {
            document.getElementById('loading-screen').classList.remove('active');
            document.getElementById('login-screen').classList.add('active');
            
            if (myName) document.getElementById('username').value = myName;
            
            if (isHost) {
                document.getElementById('btn-action').innerText = "СОЗДАТЬ КОМНАТУ";
            } else {
                document.getElementById('btn-action').innerText = "ВОЙТИ В КАНАЛ";
            }
        }, 1200);
    };

    /* ================= ЛОГИКА КОМНАТЫ И PEERJS ================= */
    function joinOrCreateRoom() {
        playClick();
        const nameInput = document.getElementById('username').value.trim();
        if (!nameInput) return alert("Введите позывной!");
        
        myName = nameInput;
        localStorage.setItem('metro_name', myName);
        
        document.getElementById('login-screen').classList.remove('active');
        document.getElementById('loading-screen').classList.add('active');
        document.getElementById('loading-text').innerText = "ПОИСК ЧАСТОТЫ (STUN)...";

        if (isHost) {
            roomId = 'metro-' + Math.random().toString(36).substr(2, 9);
            initPeer(roomId, () => {
                window.history.replaceState({}, '', `?room=${roomId}`);
                showChat();
            });
        } else {
            initPeer(null, () => {
                document.getElementById('loading-text').innerText = "ПОДКЛЮЧЕНИЕ К ХОСТУ...";
                const conn = peer.connect(roomId, { reliable: true });
                setupConnection(conn);
                showChat();
            });
        }
    }

    function initPeer(id, callback) {
        // Конфигурация со STUN-серверами Google для пробития NAT/роутеров
        const peerConfig = {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' },
                    { urls: 'stun:stun3.l.google.com:19302' },
                    { urls: 'stun:stun4.l.google.com:19302' }
                ]
            }
        };

        peer = id ? new Peer(id, peerConfig) : new Peer(peerConfig);

        peer.on('open', (peerId) => {
            console.log('Узел инициализирован ID:', peerId);
            callback();
        });

        peer.on('connection', (conn) => {
            setupConnection(conn);
        });

        peer.on('error', (err) => {
            console.error('PeerJS Error:', err);
            document.getElementById('loading-screen').classList.remove('active');
            document.getElementById('login-screen').classList.add('active');
            
            if (err.type === 'peer-unavailable') {
                alert("ОШИБКА: Комната не найдена или Создатель вышел из сети.");
            } else {
                alert("Ошибка соединения: " + err.type);
            }
        });
    }

    function setupConnection(conn) {
        conn.on('open', () => {
            if (!connections.some(c => c.peer === conn.peer)) {
                connections.push(conn);
            }
            addSystemMessage(`Сталкер вошел в канал.`);
        });

        conn.on('data', (data) => {
            displayMessage(data.name, data.type, data.content, false);
            // Если мы создатель (хост), ретранслируем сообщение другим участникам
            if (isHost) {
                broadcast(data, conn.peer);
            }
        });

        conn.on('close', () => {
            connections = connections.filter(c => c.peer !== conn.peer);
            addSystemMessage("Сталкер покинул частоту.");
        });

        conn.on('error', (err) => {
            console.error("Ошибка канала:", err);
        });
    }

    function broadcast(data, excludePeerId = null) {
        connections.forEach(conn => {
            if (conn.peer !== excludePeerId && conn.open) {
                conn.send(data);
            }
        });
    }

    /* ================= ИНТЕРФЕЙС ЧАТА ================= */
    function showChat() {
        document.getElementById('loading-screen').classList.remove('active');
        document.getElementById('chat-screen').classList.add('active');
        document.getElementById('display-name').innerText = myName;
        
        const link = window.location.href;
        document.getElementById('invite-link-box').innerText = "КООРДИНАТЫ (URL): " + link;
    }

    function copyInviteLink() {
        playClick();
        navigator.clipboard.writeText(window.location.href);
        alert("Координаты скопированы! Отправьте ссылку другу.");
    }

    function addSystemMessage(text) {
        const box = document.getElementById('chat-box');
        box.innerHTML += `<div class="message other"><div class="msg-name">СИСТЕМА</div>${text}</div>`;
        box.scrollTop = box.scrollHeight;
    }

    /* ================= ОТПРАВКА ДАННЫХ ================= */
    function handleEnter(e) { if (e.key === 'Enter') sendTextMessage(); }

    function sendTextMessage() {
        const input = document.getElementById('msg-input');
        const text = input.value.trim();
        if (!text) return;
        
        if (connections.length === 0) {
            alert("Нет активных подключений! Подождите или пригласите друга по ссылке.");
            return;
        }

        playClick();
        const data = { name: myName, type: 'text', content: text };
        broadcast(data);
        displayMessage(myName, 'text', text, true);
        input.value = '';
    }

    function handleFileUpload(e) {
        const file = e.target.files[0];
        if (!file) return;

        if (connections.length === 0) {
            alert("Нет активных подключений в канале.");
            return;
        }

        if (file.size > 10 * 1024 * 1024) {
            alert("Файл слишком большой. Максимум 10MB.");
            return;
        }

        const reader = new FileReader();
        reader.onload = (event) => {
            const type = file.type.startsWith('image') ? 'image' : 'video';
            const data = { name: myName, type: type, content: event.target.result };
            broadcast(data);
            displayMessage(myName, type, event.target.result, true);
        };
        reader.readAsDataURL(file);
    }

    /* ================= ЗАПИСЬ АУДИО ================= */
    async function startRecording() {
        if (connections.length === 0) {
            alert("Нет активных подключений в канале.");
            return;
        }

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            
            document.getElementById('record-btn').classList.add('recording');

            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = () => {
                document.getElementById('record-btn').classList.remove('recording');
                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                
                const reader = new FileReader();
                reader.onload = (event) => {
                    const data = { name: myName, type: 'audio', content: event.target.result };
                    broadcast(data);
                    displayMessage(myName, 'audio', event.target.result, true);
                };
                reader.readAsDataURL(audioBlob);
                
                stream.getTracks().forEach(track => track.stop());
            };

            mediaRecorder.start();
            
            recordTimeout = setTimeout(() => {
                if (mediaRecorder.state === 'recording') stopRecording();
            }, 60000);

        } catch (err) {
            alert("Ошибка микрофона: проверьте разрешения браузера.");
        }
    }

    function stopRecording() {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
            mediaRecorder.stop();
            clearTimeout(recordTimeout);
        }
    }

    /* ================= ОТОБРАЖЕНИЕ СООБЩЕНИЙ ================= */
    function displayMessage(name, type, content, isSelf) {
        const box = document.getElementById('chat-box');
        const alignmentClass = isSelf ? 'self' : 'other';
        let innerHTML = `<div class="msg-name">${name}</div>`;

        if (type === 'text') {
            innerHTML += `<div>${content}</div>`;
        } else if (type === 'image') {
            innerHTML += `<div class="media-content"><img src="${content}"></div>`;
        } else if (type === 'video') {
            innerHTML += `<div class="media-content"><video src="${content}" controls></video></div>`;
        } else if (type === 'audio') {
            innerHTML += `<div class="media-content"><audio src="${content}" controls></audio></div>`;
        }

        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${alignmentClass}`;
        msgDiv.innerHTML = innerHTML;
        
        box.appendChild(msgDiv);
        box.scrollTop = box.scrollHeight;
    }
</script>
</body>
</html>
